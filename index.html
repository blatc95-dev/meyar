        return `<div class="compitem"><span class="clabel">${esc(it.label)}</span><div class="optpills">${pills}</div></div>`;
      }
      const opts=compItemOptions(it);
      const pills=opts.map(o=>`<button class="optpill ${val===o?'on':''}" data-cans="${it.key}|${esc(o)}">${esc(o)}</button>`).join('');
      return `<div class="compitem"><span class="clabel">${esc(it.label)}</span><div class="optpills">${pills}</div></div>`;
    }).join('');
    return items?`<div class="catcard cat-${c.color||'law'}"><div class="catlabel"><span class="dot"></span>${esc(c.title)}</div>${items}</div>`:'';
  }).join('');
  screen.innerHTML=`<div class="card">
    <div class="eyebrow">${esc(c?c.name:'')}</div><h1 class="h1" style="margin-bottom:4px;">قائمة المراجعة</h1><p class="sub" style="margin:0;">${esc(d.employee)} · ${esc(d.date)}</p>
    ${cats}
    <div class="field" style="margin-top:18px;"><label>الرأي النهائي</label><textarea id="f_verdict" placeholder="اكتب خلاصتك بعد مراجعة القائمة أعلاه">${esc(d.verdict)}</textarea></div>
    <div class="warnmsg" id="w"></div>
    <div class="nav-btns">
      <button class="btn btn-ghost" id="back">→ رجوع</button>
      <button class="btn btn-primary" id="saveComp"><svg class="icon"><use href="#ic-save"/></svg> ${isEdit?'حفظ التعديلات':'حفظ التحليل'}</button>
    </div>
  </div>`;
  screen.querySelectorAll('[data-cans]').forEach(b=>b.onclick=()=>{const[key,val]=b.dataset.cans.split('|');d.answers[key]=val;renderCompForm();});
  screen.querySelectorAll('[data-cmulti]').forEach(b=>b.onclick=()=>{
    const[key,val]=b.dataset.cmulti.split('|');
    const arr=Array.isArray(d.answers[key])?d.answers[key].slice():[];
    const i=arr.indexOf(val);if(i>-1)arr.splice(i,1);else arr.push(val);
    d.answers[key]=arr;renderCompForm();
  });
  screen.querySelectorAll('[data-ctxt]').forEach(el=>el.oninput=e=>{d.answers[el.dataset.ctxt]=e.target.value;});
  document.getElementById('back').onclick=()=>{app.sub='intro';render();window.scrollTo(0,0);};
  const verdictEl=document.getElementById('f_verdict');
  verdictEl.oninput=e=>d.verdict=e.target.value;
  document.getElementById('saveComp').onclick=()=>{
    const w=document.getElementById('w');
    const missing=compVisibleItems(d.product,d.answers).filter(it=>{
      if(it.type==='multi')return it.required&&!(Array.isArray(d.answers[it.key])&&d.answers[it.key].length);
      if(it.type==='text')return it.required&&!String(d.answers[it.key]||'').trim();
      return !d.answers[it.key];
    });
    if(missing.length){w.textContent='حدّد إجابة لكل معيار إلزامي في القائمة قبل الحفظ.';w.classList.add('show');return;}
    if(!d.verdict.trim()){w.textContent='اكتب الرأي النهائي قبل الحفظ.';w.classList.add('show');verdictEl.focus();return;}
    if(isEdit){
      const idx=COMP_RUNS[d.product].findIndex(x=>x.id===d.editId);
      if(idx>-1){
        const prev=COMP_RUNS[d.product][idx];
        COMP_RUNS[d.product][idx]={...prev,employee:d.employee,date:d.date,answers:clone(d.answers),verdict:d.verdict.trim()};
      }
    }else{
      const run={id:'c'+Date.now()+Math.random().toString(36).slice(2,7),competitorId:d.competitorId,employee:d.employee,date:d.date,answers:clone(d.answers),verdict:d.verdict.trim(),createdAt:new Date().toISOString()};
      COMP_RUNS[d.product].unshift(run);
    }
    save(K.compRuns,COMP_RUNS);
    app.ctx.compOpenCompetitor=d.competitorId;
    app.sub=null;app.ctx.compDraft=null;
    toast(isEdit?'تم حفظ التعديلات':'تم حفظ التحليل');render();window.scrollTo(0,0);
  };
}

function renderCompareView(){
  const product=app.ctx.compareProduct;setCrumb('مقارنة');

  const rowsHtml=items.map(it=>{

    return catHead+`<tr class="${diff?'diff':''}"><td class="rowlabel">${esc(it.label)}</td>${raws.map(v=>`<td>${esc(display(v))}</td>`).join('')}</tr>`;
  }).join('');
  const head=`<tr><th>المعيار</th>${runs.map(r=>`<th>${esc(competitorLabel(r.competitorId))}<br><span class="muted-note">${esc(r.date)}</span></th>`).join('')}</tr>`;

    ${verdicts}

  </div>`;
  document.getElementById('back').onclick=()=>{app.sub='compareSelect';render();};
}

function bindAI(){
  const note=document.getElementById('ai_note');
  /* تُقرأ الحقول قبل أي إعادة رسم حتى لا تضيع الروابط التي كتبها الأدمن للتوّ */
  const readForm=()=>{
    AI_CONFIG.askEndpoint=document.getElementById('ai_ask').value.trim();
    AI_CONFIG.judgeEndpoint=document.getElementById('ai_judge').value.trim();
    AI_CONFIG.judgeModel=document.getElementById('ai_jmodel').value.trim();
    AI_CONFIG.concurrency=Math.max(1,Math.min(6,+document.getElementById('ai_conc').value||3));
  };
  screen.querySelectorAll('[data-aimode]').forEach(b=>b.onclick=()=>{readForm();AI_CONFIG.mode=b.dataset.aimode;saveAIConfig();render();});
  document.getElementById('ai_save').onclick=()=>{readForm();saveAIConfig();toast('تم حفظ إعدادات الربط');render();};
  document.getElementById('ai_test').onclick=async()=>{
    readForm();saveAIConfig();
    note.textContent='جارٍ الاختبار...';
    const askVia=aiLiveAsk()?'الوسيط':'المحاكاة',judgeVia=aiLiveJudge()?'الوسيط':'المحاكاة';
    try{
      const r=await AI.ask({model:MODELS.length?MODELS[0].name:'test',lang:'ar',turns:[{q:'اختبار اتصال'}],fileLink:''});
      const j=await AI.judge({mode:'criteria',lang:'ar',question:'اختبار اتصال',answer:r.answers[0]||'',criteria:['معيار تجريبي']});
      note.innerHTML=`<span style="color:${aiEffectiveMode()==='live'?'var(--pass)':'#b87c00'};">تمّ (${esc(aiModeLabel())}) — النموذج المُختبَر عبر ${askVia} (${(r.answers[0]||'').length} حرفًا)، والمقيّم عبر ${judgeVia} (${(j.criteria||[]).length} حكم).</span>`;
    }catch(e){
      note.innerHTML=`<span style="color:var(--fail);">فشل الاختبار: ${esc(e.message||e)}</span>`;
    }
  };
  document.getElementById('ai_rsave').onclick=()=>{
    const list=document.getElementById('ai_reasons').value.split('\n').map(x=>x.trim()).filter(Boolean);
    if(!list.length){toast('أضِف سببًا واحدًا على الأقل');return;}
    REJECT_REASONS=list;save(K.rejectReasons,REJECT_REASONS);toast('تم حفظ الأسباب');
  };
}

function prodVisToggleHtml(key){
  const vis=PRODUCT_VIS[key]!==false;

function renderSettings(){
  const open=app.ctx.settingsOpen=app.ctx.settingsOpen||{};
  const groupsHtml=SETTAB_GROUPS.map(g=>{
    const itemsHtml=g.items.map(([k,l,soon,prodKey])=>{
      const isOpen=!soon&&!!open[k];
      const bodyHtml=soon?`<div class="empty">هذا القسم سيُفعّل مع إطلاق المنتج المقابل.</div>`:(isOpen?settingsSectionBody(k):'');
      return `<div class="acc ${isOpen?'open':''}">
        <div class="head" ${soon?'':`data-sechead="${k}"`}>
          <span class="caret">▶</span>
          <span class="title">${esc(l)}${soon?' · قريبًا':''}</span>
          ${prodKey?prodVisToggleHtml(prodKey):''}
        </div>
        <div class="body">${bodyHtml}</div>
      </div>`;
    }).join('');
    return `<div style="margin-top:18px;"><div class="eyebrow">${esc(g.label)}</div>${itemsHtml}</div>`;
  }).join('');
  screen.innerHTML=`<div class="card"><div class="eyebrow" data-edit-key="settings.eyebrow">${esc(t('settings.eyebrow','الإعدادات'))}</div><h1 class="h1" data-edit-key="settings.title">${esc(t('settings.title','الإعدادات'))}</h1>
    <p class="sub" data-edit-key="settings.sub">${esc(t('settings.sub','لكل منتج قسم خاص. المتاح الآن: تحرير فئات وحالات اختبار الدخان، وبنك الأسئلة، ومعايير تحليل المنافسين، ونماذج الذكاء الاصطناعي المتاحة للاختبار.'))}</p>
    </div>${groupsHtml}`;
  screen.querySelectorAll('[data-sechead]').forEach(h=>h.onclick=(e)=>{
    if(e.target.closest('[data-prodvis]'))return;
    const k=h.dataset.sechead;
    open[k]=!open[k];
    render();
  });
  screen.querySelectorAll('[data-prodvis]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const k=b.dataset.prodvis;
    PRODUCT_VIS[k]=PRODUCT_VIS[k]===false?true:false;
    saveProductVis();
    toast(PRODUCT_VIS[k]?'المنتج ظاهر الآن لبقية الأعضاء':'المنتج مخفي الآن عن بقية الأعضاء');
    render();
  });
  if(open.cases) bindCases();
  if(open.bank) bindBank();
  if(open.comp) bindComp();
  if(open.users) bindUsers();
  if(open.general) bindGeneral();
  if(open.ai) bindAI();
  bindEditable();
}

      <thead><tr><th>الإيميل</th><th>الدور</th><th>الحالة</th><th>كلمة المرور</th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5">لا يوجد مستخدمون بعد</td></tr>'}</tbody>
    </table>`;
}
function bindUsers(){
  if(!ALLOWED_USERS)return;
  document.getElementById('addUserBtn').onclick=async()=>{
    const email=document.getElementById('newUserEmail').value.trim();
    const role=document.getElementById('newUserRole').value;
    if(!email)return;
    const{error}=await sb.from('allowed_emails').insert({email,role,must_reset_password:true,active:true});
    if(error){toast('تعذّرت الإضافة: '+error.message);return;}
    toast('أُضيف العضو — لا تنسَ إنشاء حسابه من لوحة Supabase (Authentication → Users → Add user)');
    ALLOWED_USERS=null;render();
  };
  screen.querySelectorAll('[data-urole]').forEach(el=>el.onchange=async()=>{
    const{error}=await sb.from('allowed_emails').update({role:el.value}).eq('email',el.dataset.urole);
    toast(error?'تعذّر تحديث الدور':'تم تحديث الدور');
  });
  screen.querySelectorAll('[data-utoggle]').forEach(b=>b.onclick=async()=>{
    const email=b.dataset.utoggle;
    const u=ALLOWED_USERS.find(x=>x.email===email);
    const{error}=await sb.from('allowed_emails').update({active:!u.active}).eq('email',email);
    if(error){toast('تعذّر التحديث');return;}
    ALLOWED_USERS=null;render();
  });
  screen.querySelectorAll('[data-udel]').forEach(b=>b.onclick=async()=>{
    const email=b.dataset.udel;
    if(!confirm(`حذف وصول ${email}؟`))return;
    const{error}=await sb.from('allowed_emails').delete().eq('email',email);
    if(error){toast('تعذّر الحذف');return;}
    ALLOWED_USERS=null;render();
  });
}

function persistCats(){const cl=clone(adminCats);cl.forEach(c=>{delete c._open;c.tests.forEach(t=>{delete t._sel;delete t._open;});});CATS=cl;save(K.cats,CATS);}

/* tags حقل ملغى: تُحذف بقاياه من الأسئلة المحفوظة سابقًا عند أول حفظ بعد الإلغاء */
function persistBank(){const cl=clone(adminBank);Object.values(cl).forEach(w=>w.cats.forEach(c=>{delete c._open;c.tests.forEach(t=>{delete t._open;delete t._sel;delete t.tags;});}));QBANK=cl;save(K.qbank,QBANK);}
function bindBank(){
  const win=app.ctx.bankAdminWin||Object.keys(adminBank)[0];
  const re=()=>renderSettings();
  document.querySelectorAll('[data-abwin]').forEach(b=>b.onclick=()=>{app.ctx.bankAdminWin=b.dataset.abwin;re();});
  screen.querySelectorAll('[data-bwinf]').forEach(el=>el.oninput=e=>{adminBank[win].sub=e.target.value;});
  screen.querySelectorAll('[data-bcatadm]').forEach(a=>a.querySelector('.head').onclick=()=>{const ci=+a.dataset.bcatadm;const willOpen=!adminBank[win].cats[ci]._open;adminBank[win].cats.forEach((c,idx)=>{c._open=idx===ci?willOpen:false;});re();});
  screen.querySelectorAll('[data-bsub]').forEach(a=>a.querySelector('.head').onclick=(e)=>{if(e.target.matches('input,textarea'))return;const[ci,ti]=a.dataset.bsub.split('|');const t=adminBank[win].cats[+ci].tests[+ti];t._open=!t._open;a.classList.toggle('open');});
  screen.querySelectorAll('[data-bcatf]').forEach(el=>el.oninput=e=>{const[ci,f]=el.dataset.bcatf.split('|');adminBank[win].cats[+ci][f]=e.target.value;});
  screen.querySelectorAll('[data-bf]').forEach(el=>el.oninput=e=>{const[ci,ti,f]=el.dataset.bf.split('|');adminBank[win].cats[+ci].tests[+ti][f]=e.target.value;});
  screen.querySelectorAll('[data-bqlang]').forEach(el=>el.oninput=e=>{const[ci,ti,lang]=el.dataset.bqlang.split('|');bqSetLang(adminBank[win].cats[+ci].tests[+ti],lang,e.target.value);});
  screen.querySelectorAll('[data-bcrit]').forEach(el=>el.oninput=e=>{const[ci,ti,xi]=el.dataset.bcrit.split('|');adminBank[win].cats[+ci].tests[+ti].criteria[+xi]=e.target.value;});
  screen.querySelectorAll('[data-bsel]').forEach(el=>el.onchange=e=>{const[ci,ti]=el.dataset.bsel.split('|');adminBank[win].cats[+ci].tests[+ti]._sel=e.target.checked;});
  screen.querySelectorAll('[data-delcrit]').forEach(b=>b.onclick=()=>{const[ci,ti,xi]=b.dataset.delcrit.split('|');const t=adminBank[win].cats[+ci].tests[+ti];t.criteria.splice(+xi,1);t._open=true;re();});
  screen.querySelectorAll('[data-addcrit]').forEach(b=>b.onclick=()=>{const[ci,ti]=b.dataset.addcrit.split('|');const t=adminBank[win].cats[+ci].tests[+ti];t.criteria=t.criteria||[];t.criteria.push('');t._open=true;re();});
  if(document.getElementById('addBankTest'))document.getElementById('addBankTest').onclick=()=>{
    const w=adminBank[win];
    if(w.type==='conversation')w.cats[0].tests.push({title:'',messages:[{q:''}],criteria:'',_open:true});
    else if(w.type==='fileupload')w.cats[0].tests.push({title:'',file:{name:'',url:'',format:'',pages:''},goal:'',questions:[{q:'',criteria:[''],followUp:null}],_open:true});
    else w.cats[0].tests.push({q:'',criteria:[''],_open:true});
    re();
  };
  /* --- محرّر أقسام الملفات --- */
  const fileTest=key=>{const[ti]=key.split('|');return adminBank[win].cats[0].tests[+ti];};
  const fileQ=key=>{const[ti,qi]=key.split('|');const t=adminBank[win].cats[0].tests[+ti];t.questions=t.questions||[];return t.questions[+qi];};
  screen.querySelectorAll('[data-bfile]').forEach(el=>el.oninput=e=>{const[ti,f]=el.dataset.bfile.split('|');adminBank[win].cats[0].tests[+ti][f]=e.target.value;});
  screen.querySelectorAll('[data-bfilef]').forEach(el=>el.oninput=e=>{const[ti,f]=el.dataset.bfilef.split('|');const t=adminBank[win].cats[0].tests[+ti];t.file=t.file||{};t.file[f]=e.target.value;});
  screen.querySelectorAll('[data-bfq]').forEach(el=>el.oninput=e=>{fileQ(el.dataset.bfq).q=e.target.value;});
  screen.querySelectorAll('[data-bfqcrit]').forEach(el=>el.oninput=e=>{const[ti,qi,xi]=el.dataset.bfqcrit.split('|');const q=fileQ(ti+'|'+qi);q.criteria=q.criteria||[];q.criteria[+xi]=e.target.value;});
  /* كتابة نص السؤال التابع تُنشئه، ومحوه كاملًا يحذفه بمعاييره — فلا يبقى تابعٌ فارغ
     يُحسب سؤالًا ولا معايير معلّقة على سؤال غير موجود. */
  screen.querySelectorAll('[data-bffu]').forEach(el=>{
    const had=!!fileQ(el.dataset.bffu).followUp;
    el.oninput=e=>{
      const q=fileQ(el.dataset.bffu),v=e.target.value;
      if(!v.trim()){q.followUp=null;return;}
      q.followUp=q.followUp||{q:'',criteria:['']};
      q.followUp.q=v;
    };
    /* حقول معايير التابع تظهر أو تُخفى مع وجوده، فيُعاد الرسم عند تغيّر وجوده لا
       مع كل حرف — إعادة رسمٍ في oninput تُفقد مؤشّر الكتابة. */
    el.onchange=()=>{const q=fileQ(el.dataset.bffu);if(!!q.followUp!==had)re();};
  });

/* ===== إدارة تحليل المنافسين ===== */
let adminComp=null;
function settingsComp(){
  adminComp=adminComp||clone(COMP_DEFS);
  const prod=app.ctx.compAdminProd||'research';
  const p=adminComp[prod];
  const prodTabs=Object.entries(adminComp).map(([k,pp])=>`<button class="tab ${prod===k?'on':''}" data-acprod="${k}">${esc(pp.label)}</button>`).join('');
  const swatches=(ci)=>['law','jud','cir','book','feat'].map(cl=>`<button data-ccatcolor="${ci}|${cl}" class="cat-${cl}" title="${cl}" style="width:26px;height:26px;border-radius:50%;background:var(--cat-ink);border:2px solid ${p.cats[ci].color===cl?'var(--ink-2)':'transparent'};cursor:pointer;"></button>`).join('');
  const cats=(p.cats||[]).map((c,ci)=>{
    const items=c.items.map((it,ii)=>{
      const hasOptions=it.type==='scale'||it.type==='multi';
      const optsHtml=hasOptions?`<div class="lbl-sm">الخيارات</div><div class="row" style="gap:6px;flex-wrap:wrap;">${(it.options||[]).map((o,oi)=>`<span class="chip" style="display:flex;gap:6px;align-items:center;padding-inline-end:6px;">
        <input data-coptname="${ci}|${ii}|${oi}" value="${esc(o)}" style="border:none;background:transparent;width:${Math.max(6,o.length)}ch;color:inherit;font:inherit;padding:0;">
        <button class="iconbtn del" data-delcopt="${ci}|${ii}|${oi}" style="width:20px;height:20px;padding:0;display:grid;place-items:center;"><svg class="icon" style="width:12px;height:12px;"><use href="#ic-x"/></svg></button>
      </span>`).join('')}<button class="iconbtn" data-addcopt="${ci}|${ii}"><svg class="icon"><use href="#ic-plus"/></svg> خيار</button></div>`:'';
      const depOptions=c.items.filter((o,oi)=>oi!==ii).map(o=>`<option value="${esc(o.key)}" ${it.dependsOn&&it.dependsOn.key===o.key?'selected':''}>${esc(o.label||o.key)}</option>`).join('');
      return `<div class="subacc ${it._open?'open':''}" data-csub="${ci}|${ii}"><div class="head"><span class="caret">▶</span><span class="title" style="font-size:13.5px;">${esc(it.label)||'(بدون عنوان)'}</span></div>
        <div class="body">
          <div class="lbl-sm">عنوان المعيار</div><input data-cf="${ci}|${ii}|label" value="${esc(it.label)}">
          <div class="lbl-sm">نوع الإجابة</div>
          <div class="tabbar">
            <button class="tab ${it.type==='yesno'?'on':''}" data-ctype="${ci}|${ii}|yesno">نعم / لا</button>
            <button class="tab ${it.type==='scale'?'on':''}" data-ctype="${ci}|${ii}|scale">مستويات مخصّصة</button>
            <button class="tab ${it.type==='multi'?'on':''}" data-ctype="${ci}|${ii}|multi">متعدد الاختيار</button>
            <button class="tab ${it.type==='text'?'on':''}" data-ctype="${ci}|${ii}|text">نص حر</button>
          </div>
          ${optsHtml}
          <div class="lbl-sm">يظهر فقط إذا (اختياري)</div>
          <div class="row" style="gap:8px;">
            <select data-cdepkey="${ci}|${ii}" style="flex:1;">
              <option value="">بدون شرط — يظهر دائمًا</option>
              ${depOptions}
            </select>
            <input data-cdepval="${ci}|${ii}" placeholder="القيمة (مثال: نعم)" value="${esc((it.dependsOn&&it.dependsOn.equals)||'نعم')}" style="max-width:130px;" ${it.dependsOn?'':'disabled'}>
          </div>
          <label style="font-size:13px;display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--ink-2);"><input type="checkbox" data-creq="${ci}|${ii}" ${it.required?'checked':''}> إلزامي التعبئة عند الظهور</label>
          <div class="row" style="margin-top:10px;"><button class="iconbtn del" data-delitem="${ci}|${ii}"><svg class="icon"><use href="#ic-trash"/></svg> حذف المعيار</button></div>
        </div></div>`;
    }).join('');
    return `<div class="acc ${c._open?'open':''}" data-ccat="${ci}"><div class="head"><span class="caret">▶</span><span class="catlabel cat-${c.color||'law'}"><span class="dot"></span>${esc(c.title)||'(فئة)'}</span><span class="sub-c" style="margin-inline-start:auto;">${c.items.length} معيار</span></div>
      <div class="body">
        <div class="lbl-sm">عنوان الفئة</div><input data-ccatf="${ci}|title" value="${esc(c.title)}">
        <div class="lbl-sm">لون الفئة</div>
        <div class="row" style="gap:8px;">${swatches(ci)}</div>
        ${items}
        <div class="toolbar" style="margin-top:12px;"><button class="iconbtn" data-additem="${ci}"><svg class="icon"><use href="#ic-plus"/></svg> إضافة معيار</button><button class="iconbtn del" data-delcat2="${ci}"><svg class="icon"><use href="#ic-trash"/></svg> حذف الفئة</button></div>
      </div></div>`;
  }).join('');
  const body=`${cats||'<div class="muted-note">لا فئات بعد لهذا المنتج.</div>'}<div style="margin-top:14px;"><button class="btn btn-ghost" id="addCcat"><svg class="icon"><use href="#ic-plus"/></svg> إضافة فئة جديدة</button></div>`;
  return `<div class="toolbar" style="justify-content:space-between;">
      <h2 class="h2" style="margin:0;">إدارة قائمة معايير تحليل المنافسين</h2>
      <div class="row"><button class="btn btn-ghost btn-sm" id="resetComp"><svg class="icon"><use href="#ic-refresh"/></svg> استعادة الافتراضي</button><button class="btn btn-primary btn-sm" id="saveComp2"><svg class="icon"><use href="#ic-save"/></svg> حفظ التغييرات</button></div>
    </div>
    <p class="sub" style="margin-top:8px;">عدّل الفئات والمعايير لكل منتج. لكل معيار نوع إجابة: نعم/لا، مستويات مخصّصة، متعدد الاختيار، أو نص حر. اربط أي معيار بشرط ظهور مبني على إجابة معيار آخر في نفس الفئة (مثال: صندوق نص يظهر فقط عند اختيار «نعم»). إضافة أول فئة لمنتج تُفعّل صفحته في تحليل المنافسين.</p>
    <div class="tabbar" style="margin-top:14px;">${prodTabs}</div>
    ${body}`;
}
function persistComp(){const cl=clone(adminComp);Object.values(cl).forEach(p=>{(p.cats||[]).forEach(c=>{delete c._open;c.items.forEach(it=>delete it._open);});p.ready=(p.cats||[]).length>0;});COMP_DEFS=cl;save(K.comp,COMP_DEFS);}
function bindComp(){
  const prod=app.ctx.compAdminProd||'research';
  const p=adminComp[prod];
  const re=()=>renderSettings();
  document.querySelectorAll('[data-acprod]').forEach(b=>b.onclick=()=>{app.ctx.compAdminProd=b.dataset.acprod;re();});
  screen.querySelectorAll('[data-ccat]').forEach(a=>a.querySelector('.head').onclick=()=>{const ci=+a.dataset.ccat;const willOpen=!p.cats[ci]._open;p.cats.forEach((c,idx)=>{c._open=idx===ci?willOpen:false;});re();});
  screen.querySelectorAll('[data-csub]').forEach(a=>a.querySelector('.head').onclick=(e)=>{if(e.target.matches('input,textarea'))return;const[ci,ii]=a.dataset.csub.split('|');const it=p.cats[+ci].items[+ii];it._open=!it._open;a.classList.toggle('open');});
  screen.querySelectorAll('[data-ccatf]').forEach(el=>el.oninput=e=>{const[ci,f]=el.dataset.ccatf.split('|');p.cats[+ci][f]=e.target.value;});
  screen.querySelectorAll('[data-ccatcolor]').forEach(b=>b.onclick=()=>{const[ci,cl]=b.dataset.ccatcolor.split('|');p.cats[+ci].color=cl;re();});
  screen.querySelectorAll('[data-cf]').forEach(el=>el.oninput=e=>{const[ci,ii,f]=el.dataset.cf.split('|');p.cats[+ci].items[+ii][f]=e.target.value;});
  screen.querySelectorAll('[data-ctype]').forEach(b=>b.onclick=()=>{const[ci,ii,type]=b.dataset.ctype.split('|');const it=p.cats[+ci].items[+ii];it.type=type;if((type==='scale'||type==='multi')&&!it.options)it.options=type==='scale'?['لا يوجد','محدود','موسع']:['خيار 1','خيار 2'];re();});
  screen.querySelectorAll('[data-coptname]').forEach(el=>el.onblur=e=>{const[ci,ii,oi]=el.dataset.coptname.split('|');const v=e.target.value.trim();if(v)p.cats[+ci].items[+ii].options[+oi]=v;else re();});
  screen.querySelectorAll('[data-addcopt]').forEach(b=>b.onclick=()=>{const[ci,ii]=b.dataset.addcopt.split('|');const it=p.cats[+ci].items[+ii];it.options=it.options||[];it.options.push('خيار جديد');it._open=true;re();});
  screen.querySelectorAll('[data-delcopt]').forEach(b=>b.onclick=()=>{const[ci,ii,oi]=b.dataset.delcopt.split('|');p.cats[+ci].items[+ii].options.splice(+oi,1);re();});
  screen.querySelectorAll('[data-cdepkey]').forEach(el=>el.onchange=e=>{const[ci,ii]=el.dataset.cdepkey.split('|');const it=p.cats[+ci].items[+ii];const val=e.target.value;if(val){it.dependsOn={key:val,equals:(it.dependsOn&&it.dependsOn.equals)||'نعم'};}else{delete it.dependsOn;}re();});
  screen.querySelectorAll('[data-cdepval]').forEach(el=>el.oninput=e=>{const[ci,ii]=el.dataset.cdepval.split('|');const it=p.cats[+ci].items[+ii];if(it.dependsOn)it.dependsOn.equals=e.target.value;});
  screen.querySelectorAll('[data-creq]').forEach(el=>el.onchange=e=>{const[ci,ii]=el.dataset.creq.split('|');p.cats[+ci].items[+ii].required=e.target.checked;});
  screen.querySelectorAll('[data-additem]').forEach(b=>b.onclick=()=>{const ci=+b.dataset.additem;p.cats.forEach((c,idx)=>{c._open=idx===ci;});p.cats[ci].items.push({key:'item_'+Date.now(),label:'',type:'yesno',_open:true});re();});
  screen.querySelectorAll('[data-delitem]').forEach(b=>b.onclick=()=>{const[ci,ii]=b.dataset.delitem.split('|');if(confirm('حذف هذا المعيار؟')){p.cats[+ci].items.splice(+ii,1);re();}});
  screen.querySelectorAll('[data-delcat2]').forEach(b=>b.onclick=()=>{const ci=+b.dataset.delcat2;if(confirm('حذف الفئة وكل معاييرها؟')){p.cats.splice(ci,1);re();}});
  if(document.getElementById('addCcat'))document.getElementById('addCcat').onclick=()=>{p.cats=p.cats||[];p.cats.forEach(c=>c._open=false);p.cats.push({title:'فئة جديدة',color:'law',items:[],_open:true});re();};
  document.getElementById('saveComp2').onclick=()=>{persistComp();adminComp=null;toast('تم حفظ التغييرات');go('dashboard');};
  document.getElementById('resetComp').onclick=()=>{if(confirm('استعادة قائمة معايير تحليل المنافسين إلى القيم الافتراضية؟ لن يتأثر السجل المحفوظ للتحليلات السابقة.')){COMP_DEFS=clone(DEF_COMP);save(K.comp,COMP_DEFS);adminComp=null;toast('تمت استعادة القيم الافتراضية');re();}};
}

    </div>

      <div class="lbl-sm">ملاحظات</div><textarea data-mf="${mi}|notes" placeholder="ملاحظات عامة على هذا النموذج">${esc(m.notes||'')}</textarea>
      <div class="lbl-sm" style="margin-top:12px;">الإصدارات</div>${versions||'<div class="muted-note">لا إصدارات بعد.</div>'}

    <p class="sub" style="margin-top:8px;">أضِف هنا النماذج المتاحة للاختبار مع إصداراتها وملاحظاتها. تظهر أسماء النماذج كخيارات عند بدء اختبار دخان جديد ليختار الموظف النموذج الذي يختبره.</p>

function bindGeneral(){
  const re=()=>renderSettings();
  const persist=()=>{const cl=clone(adminModels);cl.forEach(m=>delete m._open);MODELS=cl;saveModels();};
  screen.querySelectorAll('[data-msub]').forEach(a=>a.querySelector('.head').onclick=(e)=>{if(e.target.matches('input,textarea'))return;const mi=+a.dataset.msub;adminModels[mi]._open=!adminModels[mi]._open;a.classList.toggle('open');});
  screen.querySelectorAll('[data-mf]').forEach(el=>el.oninput=e=>{const[mi,f]=el.dataset.mf.split('|');adminModels[+mi][f]=e.target.value;});
  screen.querySelectorAll('[data-mver]').forEach(el=>el.oninput=e=>{const[mi,vi,f]=el.dataset.mver.split('|');adminModels[+mi].versions[+vi][f]=e.target.value;});
  screen.querySelectorAll('[data-addver]').forEach(b=>b.onclick=()=>{const mi=+b.dataset.addver;const m=adminModels[mi];m.versions=m.versions||[];m.versions.push({number:'',date:today(),note:''});m._open=true;re();});
  screen.querySelectorAll('[data-delver]').forEach(b=>b.onclick=()=>{const[mi,vi]=b.dataset.delver.split('|');adminModels[+mi].versions.splice(+vi,1);adminModels[+mi]._open=true;re();});
  screen.querySelectorAll('[data-savemodel]').forEach(b=>b.onclick=()=>{
    const mi=+b.dataset.savemodel;const name=(adminModels[mi].name||'').trim();
    if(!name){toast('اكتب اسم النموذج أولًا');return;}
    if(adminModels.some((m,idx)=>idx!==mi&&(m.name||'').trim()===name)){toast('النموذج موجود مسبقًا');return;}
    adminModels[mi].name=name;
    persist();toast('تم حفظ النموذج');re();
  });
  screen.querySelectorAll('[data-delmodel]').forEach(b=>b.onclick=()=>{
    const mi=+b.dataset.delmodel;
    if(!confirm(`حذف النموذج "${adminModels[mi].name||'بلا اسم'}"؟`))return;
    adminModels.splice(mi,1);re();
  });
  document.getElementById('addModel').onclick=()=>{adminModels.forEach(m=>m._open=false);adminModels.push({name:'',dateAdded:today(),notes:'',versions:[],_open:true});re();};
  document.getElementById('saveModels').onclick=()=>{
    const before=adminModels.length;
    adminModels=adminModels.filter(m=>(m.name||'').trim());
    const dropped=before-adminModels.length;
    const names=adminModels.map(m=>m.name.trim());
    if(new Set(names).size!==names.length){toast('توجد أسماء نماذج مكررة، عدّلها أولًا');return;}
    persist();
    toast(dropped?'تم الحفظ (حُذفت نماذج بلا اسم)':'تم حفظ التغييرات');
    re();
  };
}

/* ===== الجوال والثيم ===== */
function closeSide(){document.getElementById('side').classList.remove('open');document.getElementById('scrim').classList.remove('show');}
document.getElementById('hamb').onclick=()=>{document.getElementById('side').classList.add('open');document.getElementById('scrim').classList.add('show');};
document.getElementById('scrim').onclick=closeSide;
/* طيّ/توسيع الشريط الجانبي — الوضع الافتراضي مطوي */
function applySideCollapsed(c){const s=document.getElementById('side'),t=document.getElementById('sideToggle');s.classList.toggle('collapsed',c);if(t){const lbl=c?'توسيع الشريط':'طيّ الشريط';t.title=lbl;t.setAttribute('aria-label',lbl);}}
let SIDE_COLLAPSED=store.get(K.sideCollapsed)!=='0';
applySideCollapsed(SIDE_COLLAPSED);
document.getElementById('sideToggle').onclick=()=>{SIDE_COLLAPSED=!SIDE_COLLAPSED;store.set(K.sideCollapsed,SIDE_COLLAPSED?'1':'0');applySideCollapsed(SIDE_COLLAPSED);};
document.getElementById('themeBtn').onclick=()=>{THEME=THEME==='light'?'dark':'light';store.set(K.theme,THEME);applyTheme(THEME);};
document.getElementById('homeBtn').onclick=()=>go('dashboard');
document.getElementById('copyLinkBtn').onclick=()=>copyText(location.href,'تم نسخ رابط الصفحة');
function setEditMode(v){if(v&&!IS_ADMIN){toast('تعديل النصوص متاح للأدمن فقط');return;}EDIT_MODE=v;document.body.classList.toggle('editmode',EDIT_MODE);document.getElementById('editBtn').classList.toggle('on',EDIT_MODE);bindEditable();}
document.getElementById('editBtn').onclick=()=>{setEditMode(!EDIT_MODE);if(IS_ADMIN)toast(EDIT_MODE?'وضع التحرير مفعّل':'تم إنهاء التحرير');};
document.getElementById('exitEdit').onclick=()=>setEditMode(false);
document.getElementById('resetTexts').onclick=()=>{if(confirm('استعادة كل النصوص إلى قيمها الافتراضية؟')){TEXTS={};save(K.texts,TEXTS);render();toast('تمت استعادة النصوص الافتراضية');}};

applyTheme(THEME);
render();
</script>
</body>
</html>
