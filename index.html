<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مِعيار — منصة تقييم الذكاء الاصطناعي القانوني</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230a1c6d'/%3E%3Cpath d='M12 3.2a5.6 5.6 0 0 0-3.4 10c.5.4.8 1 .8 1.7v.4c0 .6.5 1.1 1.1 1.1h3a1.1 1.1 0 0 0 1.1-1.1v-.4c0-.7.3-1.3.8-1.7a5.6 5.6 0 0 0-3.4-10z' fill='%23fff'/%3E%3Crect x='9.4' y='17.3' width='5.2' height='1.4' rx='.7' fill='%23fff'/%3E%3Crect x='9.9' y='19.3' width='4.2' height='1.2' rx='.6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230a1c6d'/%3E%3Cpath d='M12 3.2a5.6 5.6 0 0 0-3.4 10c.5.4.8 1 .8 1.7v.4c0 .6.5 1.1 1.1 1.1h3a1.1 1.1 0 0 0 1.1-1.1v-.4c0-.7.3-1.3.8-1.7a5.6 5.6 0 0 0-3.4-10z' fill='%23fff'/%3E%3Crect x='9.4' y='17.3' width='5.2' height='1.4' rx='.7' fill='%23fff'/%3E%3Crect x='9.9' y='19.3' width='4.2' height='1.2' rx='.6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  /* ===== الوضع النهاري (افتراضي) — هوية قانونية ===== */
  :root{
    --brand:#0a1c6d; --brand-2:#1f50ab; --brand-3:#000354; --brand-glow:#1f50ab;
    --ai:#7c5cff; --ai-2:#5b3df0;
    --side-bg:#ffffff; --side-bg2:#fbfcfe; --side-ink:#1f2937; --side-muted:#6b7280; --side-active-bg:#f2f5ff; --side-active-ink:#194089; --side-logo:#0a1c6d; --side-logo-ink:#ffffff;
    --bg:#f9fafb; --card:#ffffff; --card-2:#f3f4f6; --line:#e5e7eb; --line-2:#d1d5db;
    --ink:#1f2937; --ink-2:#111827; --muted:#4b5563; --muted-2:#6b7280;
    --accent-soft:#f2f5ff; --accent-border:#cad6ed;
    --pass:#15803d; --pass-bg:#f0fdf4; --pass-line:#86efac;
    --fail:#b91c1c; --fail-bg:#fef2f2; --fail-line:#fca5a5;
    --warn:#b45309; --warn-bg:#fffbeb; --warn-line:#fcd34d;
    --info-bg:#f2f5ff; --info-line:#cad6ed; --info-ink:#133067;
    --gold:#fffbeb; --gold-line:#fcd34d; --gold-ink:#78350f; --gold-lbl:#b45309;
    --radius:12px; --font:"Ping AR + LT","Tahoma","Segoe UI",Arial,sans-serif;
    --shadow:0 2px 10px rgba(31,41,55,.05);
  }
  /* ===== الوضع الليلي (مُستنتج من مقياس ألوان قانونية) ===== */
  [data-theme="dark"]{
    --brand:#7593cc; --brand-2:#4a72bb; --brand-3:#1f50ab; --brand-glow:#7593cc;
    --ai:#a08bff; --ai-2:#8a6bff;
    --side-bg:#00003a; --side-bg2:#000021; --side-ink:#ffffff; --side-muted:#9da4c5; --side-active-bg:#000354; --side-active-ink:#9fb5dc; --side-logo:#7593cc; --side-logo-ink:#000021;
    --bg:#0f172a; --card:#1e293b; --card-2:#0f172a; --line:#334155; --line-2:#475569;
    --ink:#f1f5f9; --ink-2:#ffffff; --muted:#94a3b8; --muted-2:#64748b;
    --accent-soft:#000354; --accent-border:#133067;
    --pass:#4ade80; --pass-bg:#14532d; --pass-line:#15803d;
    --fail:#f87171; --fail-bg:#7f1d1d; --fail-line:#b91c1c;
    --warn:#fbbf24; --warn-bg:#78350f; --warn-line:#b45309;
    --info-bg:#000021; --info-line:#133067; --info-ink:#9fb5dc;
    --gold:#78350f; --gold-line:#b45309; --gold-ink:#fde68a; --gold-lbl:#fcd34d;
    --shadow:0 3px 14px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
  button,input,textarea,select{font-family:var(--font);}
  input:not([type="checkbox"]):not([type="radio"]),textarea,select{background:var(--card-2);color:var(--ink);border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;font-size:13.5px;}
  textarea{min-height:120px;width:100%;resize:both;}

  .layout{display:flex;min-height:100vh;}
  .side{width:264px;flex:0 0 264px;background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-inline-start:1px solid var(--line);transition:width .2s ease,flex-basis .2s ease;}
  .brand{display:flex;align-items:center;gap:11px;padding:20px 18px;border-bottom:1px solid var(--line);}
  .brand-logo{display:flex;align-items:center;text-decoration:none;flex:1;min-width:0;}
  .brand-logo img{display:block;}
  .brand-logo .logo-h{height:26px;width:68.6px;}
  .brand-logo .logo-mk{height:30px;width:23.8px;display:none;}
  .brand-logo .logo-dark{display:none;}
  [data-theme="dark"] .brand-logo .logo-light{display:none;}
  [data-theme="dark"] .brand-logo .logo-h.logo-dark{display:block;}
  .side-toggle{flex:0 0 auto;background:none;border:none;color:var(--side-muted);width:30px;height:30px;display:grid;place-items:center;border-radius:8px;cursor:pointer;font-size:19px;transition:.15s;}
  .side-toggle:hover{background:var(--card-2);color:var(--side-ink);}

  /* ===== الشريط المطوي ===== */
  .side.collapsed{width:74px;flex-basis:74px;}
  .side.collapsed .brand{flex-direction:column;gap:12px;padding:18px 0;}
  .side.collapsed .brand-logo{flex:0 0 auto;justify-content:center;}
  .side.collapsed .brand-logo .logo-h{display:none;}
  .side.collapsed .brand-logo .logo-mk.logo-light{display:block;}
  [data-theme="dark"] .side.collapsed .brand-logo .logo-mk.logo-light{display:none;}
  [data-theme="dark"] .side.collapsed .brand-logo .logo-mk.logo-dark{display:block;}
  .side.collapsed .side-toggle svg{transform:scaleX(-1);}
  .side.collapsed .nav{padding:16px 10px;}
  .side.collapsed .nav .grp{font-size:0;padding:10px 0 2px;text-align:center;}
  .side.collapsed .nav .grp::after{content:"";display:block;height:1px;background:var(--line);margin:0 8px;}
  .side.collapsed .navitem,.side.collapsed .themebtn{justify-content:center;padding:10px;gap:0;}
  .side.collapsed .navitem .lbl,.side.collapsed .themebtn .lbl,.side.collapsed .navitem .badge-n,.side.collapsed .navitem .soon-badge,.side.collapsed .signedin{display:none;}
  .side.collapsed .foot{padding:10px 10px;}
  .icon{width:1em;height:1em;display:inline-block;vertical-align:-.15em;flex:0 0 auto;fill:none;stroke:currentColor;}
  .nav{padding:16px 12px;flex:1;overflow-y:auto;}
  .nav .grp{font-size:11px;color:var(--side-muted);letter-spacing:.3px;padding:14px 12px 7px;font-weight:600;}
  .navitem{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;color:var(--side-ink);padding:10px 12px;border-radius:9px;font-size:14px;cursor:pointer;text-align:right;margin-bottom:2px;transition:.15s;}
  .navitem:hover{background:var(--card-2);}
  .navitem.active{background:var(--side-active-bg);color:var(--side-active-ink);font-weight:600;}
  .navitem .ic{width:22px;height:22px;text-align:center;flex:0 0 auto;font-size:14px;display:grid;place-items:center;border-radius:7px;background:var(--accent-soft);color:var(--brand);}
  .navitem.active .ic{background:var(--brand);color:#fff;}
  .navitem .badge-n{margin-inline-start:auto;background:var(--accent-soft);color:var(--brand-2);border-radius:99px;font-size:11px;padding:1px 9px;}
  .navitem.soon{cursor:default;opacity:.6;}
  .navitem.soon:hover{background:none;}
  .navitem.soon .ic{background:var(--card-2);color:var(--muted-2);}
  .navitem.soon .soon-badge{margin-inline-start:auto;background:var(--card-2);color:var(--muted-2);border:1px solid var(--line-2);border-radius:99px;font-size:10.5px;padding:1px 8px;white-space:nowrap;}
  .side .foot{padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;}
  .themebtn{display:flex;align-items:center;gap:10px;width:100%;background:var(--card-2);border:none;color:var(--side-ink);padding:10px 12px;border-radius:9px;font-size:13px;cursor:pointer;}
  .themebtn:hover{background:var(--accent-soft);}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;}
  .topbar .crumb{font-size:13px;color:var(--muted);}
  .topbar .crumb b{color:var(--ink-2);}
  .hamb{display:none;background:none;border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:16px;cursor:pointer;color:var(--ink-2);}
  .homebtn{background:var(--accent-soft);border:none;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;font-size:16px;cursor:pointer;color:var(--brand);flex:0 0 auto;}
  .homebtn:hover{background:var(--accent-border);}
  .homebtn.on{background:var(--brand);color:#fff;}
  .editbar{display:none;align-items:center;gap:14px;background:var(--brand);color:#fff;padding:9px 26px;font-size:13px;position:sticky;top:0;z-index:30;flex-wrap:wrap;}
  body.editmode .editbar{display:flex;}
  .editbar button{background:rgba(255,255,255,.18);border:none;color:#fff;padding:5px 12px;border-radius:8px;font-size:12.5px;cursor:pointer;}
  .editbar button:hover{background:rgba(255,255,255,.3);}
  body.editmode [data-edit-key]{outline:1.5px dashed rgba(47,111,237,.55);outline-offset:3px;border-radius:4px;cursor:text;}
  body.editmode [data-edit-key]:hover{background:var(--accent-soft);}
  body.editmode [data-edit-key]:focus{outline:2px solid var(--brand);background:var(--accent-soft);}
  .mainrow{display:flex;gap:28px;padding:26px;max-width:1180px;width:100%;margin:0 auto;align-items:flex-start;}
  .content{flex:1;min-width:0;max-width:760px;}
  .toc{width:220px;flex:0 0 220px;position:sticky;top:86px;}
  .toc h3{font-size:12.5px;color:var(--muted);margin:0 0 10px;font-weight:600;}
  .toclist{display:flex;flex-direction:column;gap:2px;border-inline-end:1.5px solid var(--line);padding-inline-end:14px;margin-bottom:22px;}
  .tocitem{font-size:13px;color:var(--muted);padding:6px 0;text-decoration:none;border-inline-end:1.5px solid transparent;margin-inline-end:-15.5px;padding-inline-end:14px;transition:.15s;}
  .tocitem:hover{color:var(--ink-2);}
  .tocitem.on{color:var(--brand-2);font-weight:600;border-inline-end-color:var(--brand);}
  .tocitem.sub{padding-inline-start:12px;font-size:12.5px;}
  .sharebox h3{margin-bottom:10px;}
  .sharelink{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;padding:0;}
  .sharelink:hover{color:var(--brand-2);}
  @media (max-width:1080px){.toc{display:none;}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:var(--shadow);}
  .card.hero{border:none;box-shadow:none;background:transparent;padding:0 0 6px;}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.3px;color:var(--brand-2);margin-bottom:5px;}
  .h1{font-size:28px;margin:0 0 14px;color:var(--ink-2);font-weight:700;}
  .h2{font-size:17px;margin:0 0 4px;color:var(--ink-2);font-weight:600;}
  .sub{color:var(--muted);margin:0;font-size:15px;line-height:1.9;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .btn{border:none;border-radius:11px;padding:11px 20px;font-size:14.5px;font-weight:600;cursor:pointer;transition:.12s;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--brand);color:#fff;box-shadow:0 0 0 rgba(0,0,0,0);}
  [data-theme="dark"] .btn-primary{color:#000021;box-shadow:0 0 18px -4px var(--brand-glow);}
  .btn-primary:hover{background:var(--brand-3);}
  [data-theme="dark"] .btn-primary:hover{background:var(--brand-2);}
  .btn-ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line-2);} .btn-ghost:hover{border-color:var(--brand-2);}
  .btn-danger{background:var(--fail);color:#fff;} [data-theme="dark"] .btn-danger{color:#2a0a08;}
  .btn-sm{padding:7px 13px;font-size:13px;border-radius:9px;}
  .iconbtn{border:1px solid var(--line-2);background:var(--card);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--brand-2);}
  .iconbtn:hover{border-color:var(--brand-2);}
  .iconbtn.del{color:var(--fail);} .iconbtn.del:hover{border-color:var(--fail);}
  .auth-gate{min-height:100vh;display:none;align-items:center;justify-content:center;background:var(--bg);padding:20px;}
  .auth-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 28px;max-width:360px;width:100%;text-align:center;}
  .auth-card img{width:32px;height:40px;margin-bottom:10px;}
  .auth-card .logo-dark{display:none;}
  [data-theme="dark"] .auth-card .logo-light{display:none;}
  [data-theme="dark"] .auth-card .logo-dark{display:block;}
  .auth-card h1{margin:0 0 6px;font-size:18px;color:var(--ink-2);}
  .auth-card p{color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.6;}
  .auth-card input{width:100%;margin-bottom:12px;}
  .auth-card .btn{width:100%;}
  .auth-note{margin-top:12px;font-size:12.5px;min-height:1em;}
  .auth-note.err{color:var(--fail);}
  .auth-note.ok{color:var(--pass);}
  .signedin{font-size:11px;color:var(--side-muted);padding:0 12px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .field{margin-top:14px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px;}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;font-size:14.5px;background:var(--card-2);color:var(--ink);}
  .field textarea{resize:both;min-height:70px;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--brand-2);border-color:var(--brand-2);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .muted-note{font-size:12.5px;color:var(--muted);}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:26px;border:1px dashed var(--line-2);border-radius:12px;}
  .chip{font-size:12.5px;border:1px solid var(--line-2);border-radius:99px;padding:5px 12px;background:var(--card-2);color:var(--muted);}
  .chip b{color:var(--ink-2);}
  .badge{font-size:11.5px;font-weight:700;padding:3px 11px;border-radius:99px;white-space:nowrap;}
  .badge.pass{background:var(--pass-bg);color:var(--pass);border:1px solid var(--pass-line);}
  .badge.fail{background:var(--fail-bg);color:var(--fail);border:1px solid var(--fail-line);}
  .badge.draft{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);}

  .stat-row{display:grid;gap:12px;}
  .stat{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:15px;}
  .stat .ic{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center;color:var(--brand);margin-bottom:9px;font-size:16px;}
  .stat .n{font-size:23px;font-weight:700;color:var(--ink-2);}
  .stat .l{font-size:11.5px;color:var(--muted-2);margin-top:1px;}

  .lrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:10px;flex-wrap:wrap;background:var(--card-2);}
  .lrow .ri{flex:1;min-width:180px;}
  .lrow .t{font-weight:600;color:var(--ink-2);font-size:15px;}
  .lrow .m{font-size:12.5px;color:var(--muted);margin-top:2px;}

  .progress-track{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px;}
  .progress-fill{height:100%;background:var(--brand);border-radius:99px;transition:width .35s;}
  [data-theme="dark"] .progress-fill{box-shadow:0 0 12px -2px var(--brand-glow);}
  .progress-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);}

  .qoption{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer;background:var(--card-2);transition:.15s;}
  .qoption:hover{border-color:var(--brand-2);}
  .qoption.sel{border-color:var(--brand);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--brand);}
  .qoption input{margin-top:6px;accent-color:var(--brand);flex:0 0 auto;width:16px;height:16px;}
  .qoption .qtext{font-size:14.5px;color:var(--ink);}
  .copybtn{margin-inline-start:auto;flex:0 0 auto;border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--brand-2);cursor:pointer;}
  .qfilelink{color:var(--brand-2);text-decoration:underline;font-size:12.5px;white-space:nowrap;}
  .qfilelink:hover{color:var(--brand-3);}
  .section-h{font-size:12.5px;font-weight:600;color:var(--muted);margin:18px 0 8px;}
  .expected{background:var(--gold);border:1px solid var(--gold-line);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--gold-ink);margin-top:6px;}
  .expected .lbl{font-weight:700;color:var(--gold-lbl);display:block;margin-bottom:3px;font-size:12px;}
  .reason{background:var(--accent-soft);border:1px solid var(--accent-border);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink-2);margin-top:10px;}
  .criteria-box{background:var(--info-bg);border:1px solid var(--info-line);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--info-ink);margin-top:10px;}
  .criteria-box .lbl{font-weight:700;color:var(--brand-2);display:block;margin-bottom:6px;font-size:12px;}
  .criteria-box ul{margin:0;padding-inline-start:18px;}
  .criteria-box li{margin-bottom:4px;}
  .filenote{background:var(--accent-soft);border:1px dashed var(--brand-2);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink-2);margin-top:10px;}
  .dualnote{background:var(--info-bg);border:1px solid var(--info-line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--info-ink);margin-top:10px;}
  .tip{display:flex;gap:10px;align-items:flex-start;background:var(--info-bg);border:1px solid var(--info-line);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--ink-2);margin-top:14px;}
  .tip .ic{width:24px;height:24px;flex:0 0 auto;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px;}
  .steps{display:flex;flex-direction:column;gap:16px;margin-top:18px;}
  .step{display:flex;align-items:flex-start;gap:14px;}
  .step .num{width:26px;height:26px;flex:0 0 auto;border-radius:50%;background:var(--card-2);border:1px solid var(--line-2);color:var(--ink-2);font-size:12.5px;font-weight:700;display:grid;place-items:center;}
  .step .txt{font-size:14.5px;color:var(--ink);padding-top:3px;}

  /* مربّعا الوضعين */
  .modebox{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;}
  .modechk{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line-2);border-radius:11px;padding:12px 14px;cursor:pointer;background:var(--card-2);transition:.15s;}
  .modechk:hover{border-color:var(--brand-2);}
  .modechk.on{border-color:var(--brand);background:var(--accent-soft);}
  .modechk .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line-2);display:grid;place-items:center;color:#fff;flex:0 0 auto;font-size:13px;}
  .modechk.on .box{background:var(--brand);border-color:var(--brand);}
  [data-theme="dark"] .modechk.on .box{color:#000021;}
  .modechk .mlab{font-size:14px;font-weight:600;color:var(--ink-2);}
  .modechk .mst{font-size:11.5px;color:var(--muted);}

  .verdict{display:flex;gap:12px;margin-top:12px;}
  .vbtn{flex:1;border:1.5px solid var(--line-2);background:var(--card-2);border-radius:12px;padding:13px;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .vbtn .mk{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:12px;}
  .vbtn.pass.on{border-color:var(--pass);background:var(--pass-bg);color:var(--pass);}
  .vbtn.fail.on{border-color:var(--fail);background:var(--fail-bg);color:var(--fail);}
  .notes-block{margin-top:14px;display:none;} .notes-block.show{display:block;}
  .notes-block label{font-size:13px;font-weight:600;color:var(--fail);display:block;margin-bottom:6px;}
  textarea.notes,input.notes{width:100%;min-height:78px;border:1px solid var(--fail-line);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--card-2);color:var(--ink);resize:both;}
  input.notes{min-height:auto;}
  .warnmsg{color:var(--fail);font-size:13px;margin-top:10px;display:none;} .warnmsg.show{display:block;}
  .nav-btns{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap;}

  .rrow{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px;background:var(--card-2);}
  .rrow .rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .rrow .qq{font-size:14px;margin-top:9px;}
  .rrow .meta{font-size:12.5px;color:var(--muted);margin-top:6px;}
  .rrow .rnotes{font-size:13.5px;margin-top:8px;background:var(--fail-bg);border:1px solid var(--fail-line);border-radius:8px;padding:8px 12px;color:var(--fail);}

  .acc{border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden;background:var(--card);}
  .acc>.head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;background:var(--card-2);user-select:none;}
  .acc>.head:hover{background:var(--accent-soft);}
  .acc>.head .caret{transition:.2s;color:var(--muted);font-size:12px;}
  .acc.open>.head .caret{transform:rotate(90deg);}
  .acc>.body{display:none;padding:14px;border-top:1px solid var(--line);}
  .acc.open>.body{display:block;}
  .acc .title{font-weight:600;color:var(--ink-2);font-size:14.5px;}
  .acc .sub-c{font-size:12px;color:var(--muted);}
  .subacc{border:1px solid var(--line-2);border-radius:10px;margin-top:8px;overflow:hidden;}
  .subacc>.head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;background:var(--card-2);}
  .subacc>.head:hover{background:var(--accent-soft);}
  .subacc>.head .caret{transition:.2s;color:var(--muted);font-size:11px;flex:0 0 auto;}
  /* أسئلة الوقائع الطويلة تُقصّ إلى سطرين في الرأس المطويّ ليبقى التصفّح ممكنًا،
     ونصّها الكامل يُعرض داخل البطاقة عند فتحها */
  .subacc>.head .title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .subacc>.body{display:none;padding:12px;border-top:1px solid var(--line-2);background:var(--card);}
  .subacc.open>.body{display:block;}
  .subacc.open>.head .caret{transform:rotate(90deg);}
  .lbl-sm{font-size:11.5px;font-weight:600;color:var(--muted);margin:10px 0 4px;}
  .qline{display:flex;gap:8px;margin-top:6px;}
  /* زر النسخ لا يتمدّد بطول السؤال — أسئلة الملفات تمتدّ لأربعة أسطر وأكثر */
  .qline>.copybtn{align-self:flex-start;}
  .qline textarea{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;font-size:13.5px;resize:both;background:var(--card-2);color:var(--ink);}
  .upd-box{width:100%;min-height:130px;border:1px solid var(--line-2);border-radius:9px;padding:10px 12px;font-size:13.5px;resize:both;background:var(--card-2);color:var(--ink);}
  .qline input{width:100%;border:1px solid var(--line-2);border-radius:9px;padding:6px 10px;font-size:12.5px;background:var(--card-2);color:var(--ink);}
  .qoption input.qcount{width:64px;height:auto;margin-top:0;border:1px solid var(--line-2);border-radius:8px;padding:5px 8px;font-size:13px;background:var(--card);color:var(--ink);text-align:center;accent-color:auto;}
  .qcount-wrap .muted-note{font-size:12px;}
  .qrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;margin-top:8px;background:var(--card-2);}
  .qrow .qtext{flex:1;font-size:13.5px;color:var(--ink-2);}
  .conv-flow{display:flex;flex-direction:column;}
  .conv-msg,.conv-msg-edit{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--card-2);}
  .conv-num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--brand-2);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;margin-top:1px;}
  .conv-text{flex:1;font-size:13.5px;color:var(--ink-2);padding-top:2px;}
  .conv-arrow{text-align:center;color:var(--muted);font-size:15px;line-height:1;padding:3px 0;}
  /* وسم السؤال التابع — كلمة لا رقم، فلا تصلح له دائرة conv-num ذات العرض الثابت */
  .conv-tag{flex:0 0 auto;padding:2px 8px;border-radius:999px;background:var(--brand-2);color:#fff;font-size:10.5px;font-weight:700;line-height:1.6;margin-top:2px;}
  .conv-msg-edit{align-items:flex-start;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .selbox{width:16px;height:16px;accent-color:var(--fail);}
  .tabbar{display:flex;gap:8px;flex-wrap:wrap;}
  .tab{border:1px solid var(--line-2);background:var(--card-2);border-radius:10px;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);}
  .tab.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  [data-theme="dark"] .tab.on{color:#000021;}
  .tab.soon{opacity:.55;cursor:default;}

  .bankback{display:inline-flex;align-items:center;font-size:13px;font-weight:600;color:var(--brand-2);background:none;border:none;cursor:pointer;padding:0;margin-bottom:12px;}
  .bankback:hover{color:var(--brand-3);}
  .bankgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:18px;}
  .bankcard{display:flex;flex-direction:column;gap:10px;text-align:right;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:18px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;}
  .bankcard:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent-border);}
  .bankcard .bc-ic{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--brand);display:grid;place-items:center;font-size:20px;}
  .bankcard .bc-title{font-size:15px;font-weight:700;color:var(--ink-2);}
  .bankcard .bc-desc{font-size:12.5px;color:var(--muted);line-height:1.6;flex:1;}
  .bankcard .bc-count{align-self:flex-start;font-size:11.5px;font-weight:700;color:var(--brand-2);background:var(--accent-soft);border:1px solid var(--accent-border);border-radius:99px;padding:3px 11px;}

  /* ===== تحليل المنافسين ===== */
  .cat-law{--cat-ink:#14a950;--cat-bg:#f0fdf4;--cat-line:#86efac;}
  .cat-jud{--cat-ink:#f97315;--cat-bg:#fff7ed;--cat-line:#fdba74;}
  .cat-cir{--cat-ink:#ef4444;--cat-bg:#fef2f2;--cat-line:#fca5a5;}
  .cat-book{--cat-ink:#3c82f6;--cat-bg:#eff6ff;--cat-line:#93c5fd;}
  .cat-feat{--cat-ink:#0a1c6d;--cat-bg:#f2f5ff;--cat-line:#cad6ed;}
  [data-theme="dark"] .cat-law{--cat-bg:#0f2e1c;--cat-line:#14a950;}
  [data-theme="dark"] .cat-jud{--cat-bg:#3a220f;--cat-line:#f97315;}
  [data-theme="dark"] .cat-cir{--cat-bg:#3a1414;--cat-line:#ef4444;}
  [data-theme="dark"] .cat-book{--cat-bg:#122a4a;--cat-line:#3c82f6;}
  [data-theme="dark"] .cat-feat{--cat-bg:#000354;--cat-line:#7593cc;}
  .catlabel{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--cat-ink);}
  .catlabel .dot{width:9px;height:9px;border-radius:50%;background:var(--cat-ink);flex:0 0 auto;}
  .catcard{border:1px solid var(--cat-line);background:var(--cat-bg);border-radius:14px;padding:16px;margin-top:14px;}
  .compitem{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line);}
  .compitem:first-of-type{border-top:none;padding-top:6px;}
  .compitem .clabel{flex:1;min-width:180px;font-size:14px;color:var(--ink-2);font-weight:500;}
  .optpills{display:flex;gap:8px;flex-wrap:wrap;}
  .optpill{border:1.5px solid var(--line-2);background:var(--card);border-radius:99px;padding:7px 15px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;}
  .optpill:hover{border-color:var(--cat-ink,var(--brand-2));}
  .optpill.on{background:var(--cat-ink,var(--brand));border-color:var(--cat-ink,var(--brand));color:#fff;}
  [data-theme="dark"] .optpill.on{color:#000021;}
  .platcard{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;background:var(--card);}
  .platcard .phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .platcard .pname{font-size:16px;font-weight:700;color:var(--ink-2);}
  .platcard .pmeta{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .own-badge{font-size:11px;font-weight:700;color:var(--brand-2);background:var(--accent-soft);border:1px solid var(--accent-border);border-radius:99px;padding:2px 10px;}
  .pmeta a{color:var(--brand-2);text-decoration:none;}
  .pmeta a:hover{text-decoration:underline;}
  .pwmask{font-family:monospace;letter-spacing:1px;color:var(--ink-2);}
  .ctext{flex:1;min-width:220px;}
  .cmpwrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:14px;}
  .cmptable{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px;}
  .cmptable th,.cmptable td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;}
  .cmptable thead th{background:var(--card-2);color:var(--ink-2);font-size:12.5px;}
  .cmptable td.rowlabel{font-weight:600;color:var(--ink-2);white-space:normal;min-width:160px;}
  .cmptable tr.diff{background:var(--accent-soft);}
  .cmptable tr.diff td.rowlabel{color:var(--brand-2);}
  .verdictcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px;background:var(--card-2);}
  .verdictcard .vh{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink-2);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:99;pointer-events:none;}
  [data-theme="dark"] .toast{background:var(--brand);color:#000021;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;}

  @media (max-width:860px){
    .side,.side.collapsed{position:fixed;right:0;z-index:50;transform:translateX(100%);transition:.25s;box-shadow:-8px 0 30px rgba(0,0,0,.3);width:264px;flex-basis:264px;}
    .side.open{transform:translateX(0);}
    /* على الجوال يظهر الشريط دائمًا موسّعًا داخل الدرج */
    .side.collapsed .brand{flex-direction:row;gap:11px;padding:20px 18px;}
    .side.collapsed .brand-logo{flex:1;justify-content:flex-start;}
    .side.collapsed .brand-logo .logo-h.logo-light{display:block;}
    [data-theme="dark"] .side.collapsed .brand-logo .logo-h.logo-light{display:none;}
    [data-theme="dark"] .side.collapsed .brand-logo .logo-h.logo-dark{display:block;}
    .side.collapsed .brand-logo .logo-mk{display:none;}
    .side.collapsed .side-toggle{display:none;}
    .side.collapsed .nav{padding:16px 12px;}
    .side.collapsed .nav .grp{font-size:11px;text-align:right;padding:14px 12px 7px;}
    .side.collapsed .nav .grp::after{display:none;}
    .side.collapsed .navitem,.side.collapsed .themebtn{justify-content:flex-start;padding:10px 12px;gap:11px;}
    .side.collapsed .navitem .lbl,.side.collapsed .themebtn .lbl,.side.collapsed .navitem .badge-n,.side.collapsed .navitem .soon-badge,.side.collapsed .signedin{display:'';}
    .side.collapsed .navitem .lbl,.side.collapsed .themebtn .lbl{display:inline;}
    .side.collapsed .navitem .badge-n{display:inline-block;}
    .side.collapsed .signedin{display:block;}
    .side.collapsed .foot{padding:12px;}
    .grid2{grid-template-columns:1fr;} .verdict{flex-direction:column;} .modebox{flex-direction:column;}
    .kindgrid{grid-template-columns:1fr;} .v2card .v2head{flex-direction:column;align-items:flex-start;gap:10px;}
    .scorebig{align-self:flex-start;}
  }

  /* ===== V2: الاختبارات المرتبطة بالذكاء الاصطناعي ===== */
  .kindgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  .kindcard{border:1.5px solid var(--line-2);border-radius:14px;padding:16px;background:var(--card-2);cursor:pointer;transition:.15s;text-align:start;}
  .kindcard:hover{border-color:var(--brand);}
  .kindcard.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,transparent);}
  .kindcard .kc-t{font-size:15px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:8px;}
  .kindcard .kc-d{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.7;}

  .runprog{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line-2);border-radius:11px;background:var(--card-2);margin-top:8px;}
  .runprog .rp-n{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .runprog .rp-t{flex:1;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .runprog .rp-s{flex:0 0 auto;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--muted);}
  .runprog.running .rp-s{background:color-mix(in srgb,var(--brand) 18%,transparent);color:var(--brand);}
  .runprog.done .rp-n{background:color-mix(in srgb,var(--pass) 18%,transparent);color:var(--pass);}
  .runprog.done .rp-s{background:color-mix(in srgb,var(--pass) 15%,transparent);color:var(--pass);}
  .runprog.error .rp-n,.runprog.error .rp-s{background:color-mix(in srgb,var(--fail) 15%,transparent);color:var(--fail);}
  .progbar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:14px;}
  .progbar span{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s;}

  .v2card{border:1px solid var(--line-2);border-radius:14px;background:var(--card-2);padding:16px;margin-top:12px;}
  .v2card .v2head{display:flex;align-items:flex-start;gap:12px;}
  .v2card .v2q{flex:1;font-size:14px;font-weight:600;color:var(--ink-2);line-height:1.8;}
  .scorebig{flex:0 0 auto;text-align:center;border-radius:12px;padding:8px 13px;background:var(--line);min-width:70px;}
  .scorebig .sv{font-size:19px;font-weight:800;line-height:1.2;}
  .scorebig .sl{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .scorebig.pass{background:color-mix(in srgb,var(--pass) 14%,transparent);} .scorebig.pass .sv{color:var(--pass);}
  .scorebig.mid{background:color-mix(in srgb,#d99100 16%,transparent);} .scorebig.mid .sv{color:#b87c00;}
  .scorebig.fail{background:color-mix(in srgb,var(--fail) 13%,transparent);} .scorebig.fail .sv{color:var(--fail);}
  .answerbox{margin-top:12px;border:1px solid var(--line);border-radius:11px;background:var(--card);padding:12px 13px;}
  .answerbox .lbl{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.03em;margin-bottom:7px;}
  .answerbox .txt{font-size:13.2px;line-height:1.9;color:var(--ink-2);white-space:pre-wrap;}
  .answerbox.collapsed .txt{max-height:112px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent);mask-image:linear-gradient(180deg,#000 55%,transparent);}
  .morebtn{margin-top:8px;font-size:12px;font-weight:600;color:var(--brand);background:none;border:0;cursor:pointer;padding:0;}
  .critlist{list-style:none;margin:10px 0 0;padding:0;}
  .critlist li{display:flex;gap:9px;align-items:flex-start;font-size:12.8px;line-height:1.8;padding:7px 0;border-top:1px solid var(--line);}
  .critlist li:first-child{border-top:0;}
  .critlist .mk{flex:0 0 auto;width:19px;height:19px;border-radius:6px;display:flex;align-items:center;justify-content:center;margin-top:2px;}
  .critlist .mk .icon{width:12px;height:12px;}
  .critlist li.met .mk{background:color-mix(in srgb,var(--pass) 16%,transparent);color:var(--pass);}
  .critlist li.unmet .mk{background:color-mix(in srgb,var(--fail) 14%,transparent);color:var(--fail);}
  .critlist .ct{flex:1;color:var(--ink-2);}
  .critlist .cn{display:block;font-size:11.8px;color:var(--muted);margin-top:3px;}
  .verifybox{margin-top:13px;padding-top:13px;border-top:1px dashed var(--line-2);}
  .verifybox .vq{font-size:12.8px;font-weight:700;color:var(--ink-2);margin-bottom:9px;}

  .cmptable{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;}
  /* اسم مستقل عن .cmptable الخاصة بتحليل المنافسين لتفادي تعارض الأنماط */
  .v2tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;}
  .v2tbl th,.v2tbl td{padding:10px 12px;border:1px solid var(--line-2);text-align:start;white-space:normal;overflow-wrap:anywhere;}
  .v2tbl th{background:var(--card-2);font-weight:700;color:var(--ink-2);font-size:12.5px;}
  .v2tbl td{color:var(--ink-2);vertical-align:top;}
  /* جدول الأسئلة المشتركة: أعمدة ثابتة حتى تبقى درجات النماذج ظاهرة بلا تمرير أفقي */
  .v2tbl.fixed{table-layout:fixed;}
  .v2tbl.fixed td:first-child,.v2tbl.fixed th:first-child{width:46%;font-size:12.3px;line-height:1.7;}
  .cmpwrap{overflow-x:auto;}
  .mini-bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:5px;min-width:70px;}
  .mini-bar span{display:block;height:100%;border-radius:99px;}
</style>
</head>

<script type="module">
/* ===== التخزين ===== */
const store={mem:{},get(k){try{return localStorage.getItem(k);}catch(e){return (k in this.mem)?this.mem[k]:null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){this.mem[k]=v;}}};
const clone=o=>JSON.parse(JSON.stringify(o));

/* ===== دمج ثلاثي (base/ours/theirs) لمنع تضارب الحفظ بين مستخدمين ===== */
const LAST_SYNCED={};
const DOMAIN_SETTERS={};

function itemKeyOf(list){
  if(!list.length)return null;
  if(list.every(x=>x&&typeof x==='object'&&x.id!=null))return 'id';
  if(list.every(x=>x&&typeof x==='object'&&x.title!=null))return 'title';
  if(list.every(x=>x&&typeof x==='object'&&x.name!=null))return 'name';
  return null;
}

function mergeArraysById(base,ours,theirs,keyField){
  const byKey=arr=>{const m=new Map();arr.forEach(x=>m.set(x[keyField],x));return m;};
  const baseM=byKey(base),oursM=byKey(ours),theirsM=byKey(theirs);
  const order=[],seen=new Set();
  ours.forEach(x=>{const k=x[keyField];if(!seen.has(k)){order.push(k);seen.add(k);}});
  theirs.forEach(x=>{const k=x[keyField];if(!seen.has(k)){order.push(k);seen.add(k);}});
  const result=[];
  order.forEach(k=>{
    const b=baseM.get(k),o=oursM.get(k),th=theirsM.get(k);
    if(o===undefined&&th===undefined)return;
    if(o===undefined){if(b===undefined)result.push(th);return;}
    if(th===undefined){if(b===undefined)result.push(o);return;}
    result.push(mergeByStructure(b,o,th));
  });
  return result;
}

function mergeByStructure(base,ours,theirs){
  if(ours===theirs)return ours;
  const oursJson=JSON.stringify(ours),theirsJson=JSON.stringify(theirs);
  if(oursJson===theirsJson)return ours;
  const baseJson=JSON.stringify(base);
  if(Array.isArray(ours)||Array.isArray(theirs)){
    const oursArr=Array.isArray(ours)?ours:[];
    const theirsArr=Array.isArray(theirs)?theirs:[];
    const baseArr=Array.isArray(base)?base:[];
    const keyField=itemKeyOf([...oursArr,...theirsArr,...baseArr]);
    if(keyField)return mergeArraysById(baseArr,oursArr,theirsArr,keyField);
    return oursJson===baseJson?theirsArr:oursArr;
  }
  if(ours&&theirs&&typeof ours==='object'&&typeof theirs==='object'){
    const baseObj=(base&&typeof base==='object')?base:{};
    const keys=new Set([...Object.keys(baseObj),...Object.keys(ours),...Object.keys(theirs)]);
    const merged={};
    keys.forEach(k=>{merged[k]=mergeByStructure(baseObj[k],ours[k],theirs[k]);});
    return merged;
  }
  return oursJson===baseJson?theirs:ours;
}

async function cloudSaveAttempt(key,value,attempt){
  value=clone(value);
  const{data:row,error:selErr}=await sb.from('kv_store').select('value,updated_at').eq('key',key).maybeSingle();
  if(selErr)throw selErr;
  let toWrite=value;
  if(row&&LAST_SYNCED[key]&&row.updated_at!==LAST_SYNCED[key].updated_at){
    toWrite=mergeByStructure(LAST_SYNCED[key].value,value,row.value);
    const setter=DOMAIN_SETTERS[key];
    if(setter){setter(clone(toWrite));try{render();}catch(e){}}
  }
  const newUpdatedAt=new Date().toISOString();
  if(row){
    const{data:updated,error}=await sb.from('kv_store').update({value:toWrite,updated_by:CURRENT_USER_EMAIL,updated_at:newUpdatedAt}).eq('key',key).eq('updated_at',row.updated_at).select();
    if(error)throw error;
    if(!updated||updated.length===0){
      if(attempt<5)return cloudSaveAttempt(key,value,attempt+1);
      throw new Error('تعذّر حفظ التعديلات بسبب تحديثات متزامنة متكررة');
    }
  }else{
    const{error}=await sb.from('kv_store').insert({key,value:toWrite,updated_by:CURRENT_USER_EMAIL,updated_at:newUpdatedAt});
    if(error){
      if(error.code==='23505'&&attempt<5)return cloudSaveAttempt(key,value,attempt+1);
      throw error;
    }
  }
  LAST_SYNCED[key]={value:toWrite,updated_at:newUpdatedAt};
}

function cloudSave(key,value,isRetry){
  cloudSaveAttempt(key,value,0).then(()=>{cloudSyncBroken=false;}).catch(()=>{
    if(isRetry){if(!cloudSyncBroken){cloudSyncBroken=true;toast('تعذّر الحفظ السحابي، سيُعاد المحاولة عند الحفظ القادم');}}
    else{setTimeout(()=>cloudSave(key,value,true),1500);}
  });
}

        {q:{ar:`بالنسبة لموضوع العامل يرتكز على نقطتين: الاولى ممكن تطالب العامل بالمحكمة العمالية بالتعويض عن الضرر كونه عمل امور خارج عن صلاحياته ادت لمطالبات مالية غير مستحقة للشركة، ومن ثم راح واشتغل مع نفس الشركة وهذا يعتبر خرق لاتفاق عدم المنافسة وكلها تنظر بالمحكمة العمالية، والقضايا الي بالمحكمة العمالية ماعليها رسوم قضائية. النقطة الثانية: مطالبة الشركة بالمبلغ اول شي كويس انك ارسلت لهم عن طريق الايميل وانكرت ورقة الانجاز وعشان يكون موقفك القانوني جيد تفاوض معاهم على المبلغ المستحق بطريقة ودية واذكر ان المبلغ الي يطالبون فيه غير مستحق وانه سبق وان تم تقييم التنفيذ من قبل مختصين وان المبلغ المستحق فيه كذا كذا واذا رفضو غالباً بيرفعون دعوى يطالبون فيها بمستحقاتهم المالية هنا عاد بندفع ببطلان السند الي ارسله الموظف لهم الي هو (ورقة الانجاز) ونذكر انه قام بالتضليل والاحتيال على الشركة بدليل انه الان يعمل عندهم ونطلب من القاضي ندب خبير لتقييم العمل الفعلي الي قامو بتنفيذه وغالباً في هالحالة يتم الحكم بناء على تقرير الخبير.`,en:`Regarding the employee matter, it rests on two points. First, you can sue the employee at the labor court for damages, since he acted outside his authority in a way that resulted in unwarranted financial claims against the company, and then went on to work for the same company, which constitutes a breach of the non-compete agreement — all of which falls under the labor court's jurisdiction, and labor court cases carry no court fees. Second point: regarding the company's claim for the amount, it's good that you sent them the completion certificate ("ورقة الإنجاز") by email and then disputed it. To keep your legal position strong, negotiate the amount owed with them amicably, and state that the amount they are claiming is not due, that the work performed had already been assessed by specialists, and that the amount actually owed is such-and-such. If they refuse, they will most likely file a lawsuit claiming their financial dues — in that case, we would argue for invalidating the instrument the employee sent them (the completion certificate), and state that he misled and defrauded the company, evidenced by the fact that he now works for them, and we would ask the judge to appoint an expert to assess the actual work performed; in most such cases, the ruling is based on the expert's report.`}},
      ]},
      {title:'دراسة أولية',tests:[
        {q:{ar:`قام أحمد (المورّث) قبل وفاته بتوكيل ابنه هيثم لمتابعة إجراءات التحقق من البنك بعدما قاموا بإبلاغه عن تصفير حسابه بسبب شخصٍ مجهول كان يسحب كل يوم (5,000) خمسة آلاف ريال دون علمه، إلا أن هيثم لم يقم بالمتابعة مع البنك ولم يبدِ أي اهتمام. بعدما توفى أحمد وقد ترك خلفه ورثته: زوجته وأبناءه الخمسة، هناك اعتقاد بأن هيثم واثنان من إخوته المتحيزين له هم المسؤولون عن المبلغ الذي تم سحبه بالتدريج من حساب المورّث وهو (470,000) أربعمائة وسبعون ألف ريال. ما نريده الآن هو رفع دعوى على هيثم وإخوته ونطلب من القاضي مخاطبة البنك المركزي لجلب كشوفات الحساب وجلب مقاطع الفيديو من أجهزة الصرافة للأشخاص الذين قاموا بسحب هذا المبلغ، وإلزامهم بالدفع. المطلوب هو دراسة أولية للدعوى.`,en:`Before his death, Ahmed (the deceased) authorized his son Haitham to follow up with the bank after being notified that his account had been drained by an unknown person withdrawing (5,000) five thousand riyals every day without his knowledge. However, Haitham did not follow up with the bank and showed no interest in the matter. After Ahmed passed away, leaving behind his heirs — his wife and his five children — there is a belief that Haitham and two of his siblings who are biased toward him are responsible for the amount gradually withdrawn from the deceased's account, totaling (470,000) four hundred seventy thousand riyals. What we want now is to file a lawsuit against Haitham and his siblings, and to ask the judge to direct the Central Bank to provide account statements and ATM camera footage of the persons who withdrew this amount, and to hold them liable for payment. A preliminary study of the case is required.`}},
        {q:{ar:`إنه بتاريخ 1447/04/26هـ قام المدعى عليه باستئجار مركبة من المدعي برقم عقد 2573174055910001 من نوع اميجراند وتحمل اللوحة رقم (ر ر أ - 9823) ونتج عن ذلك أنه عند استلام المركبة اتضح وجود تلفيات (مقدمة المركبة) وعليه تم تقدير المركبة بمركز التقدير المعتمد نظاميًا برقم التقدير (1911256898) بمبلغ وقدره (2327.23) ريال قيمة التلفيات بالإضافة إلى 172.5 ريال قيمة فاتورة تقدير بالإضافة لقيمة الونش 450 ريال بتاريخ 1447/05/28هـ، والمدعى عليه مسؤول عن ذلك بسبب تلفيات المركبة ولا يوجد دعوى في الحق العام. هذه لائحة دعوى المدعي، أرجو الاطلاع عليها وتحليلها.`,en:`On 26/04/1447 AH, the defendant rented a vehicle from the plaintiff under contract No. 2573174055910001, an Emgrand model bearing plate number (R R A - 9823). As a result, upon return of the vehicle, damage was found (to the front of the vehicle), and the vehicle was accordingly assessed by a legally licensed damage-assessment center under assessment No. (1911256898) at an amount of (2,327.23) riyals for the damage, in addition to 172.5 riyals for the assessment invoice and 450 riyals for towing, dated 28/05/1447 AH. The defendant is liable for this due to the vehicle's damage, and there is no public-right lawsuit. This is the plaintiff's statement of claim; please review and analyze it.`}},
      ]},
      {title:'مراجعة مذكرة',tests:[
        {q:{ar:`إجابة على ما جاء في جواب المدعى عليه في الجلسة المقامة في 11/06/1447هـ وتكملتها في المذكرة المقيدة برقم (4713807358) وتاريخ (17/06/1447هـ): أما عن تاريخ المباشرة الصحيح فهو 17/10/2024م وندعّم قولنا بالبينات الآتية: 1- صورة من جواز سفر موكلي ومذيّلة بختم دخول المملكة ومؤرخة في 16/10/2024م وتدل على وجود موكلي في المملكة قبل تاريخ المباشرة بيوم واحد. 2- شهادة التأمينات الاجتماعية وهي محرر رسمي صادر من المؤسسة العامة للتأمينات الاجتماعية مؤرخ في 07/11/2025م باسم/ هشام حامد محمد حامد، هوية (2594307478) وهو المدعي، والجهة المنشئة/ مؤسسة باكورة لتقنية المعلومات وهي المدعى عليها، ومذكور به أن تاريخ الالتحاق في 16/10/2024م. 3- محرر عادي آخر معتمد من موظف حكومي وهو عرض فني ومالي مقدّم من المدعى عليها للهيئة السعودية لتنظيم الكهرباء، ويتضمن زيارة موقع من قبل المندوب هشام حامد (المدعي) بتاريخ 21 أكتوبر. 4- مجموعة صور من نظام الشركة المدعى عليها تُظهر المهام اليومية للمدعي وأحدها بتاريخ 26 أكتوبر. أما عن دفع المدعى عليها بأن الإنهاء تم في فترة التجربة (90 يومًا من تاريخ المباشرة)، فآخر يوم عمل كان 27/03/2025م، والفرق بين التاريخين 161 يومًا، أي أن العامل تجاوز فترة التجربة. المطلوب مراجعة هذه المذكرة.`,en:`A response to what was stated in the defendant's reply at the hearing held on 11/06/1447 AH, and its supplement in the memorandum recorded under No. (4713807358) dated (17/06/1447 AH): as for the correct start-of-work date, it is 17/10/2024 CE, and we support our statement with the following evidence: 1- A copy of my client's passport bearing the Kingdom's entry stamp, dated 16/10/2024 CE, showing my client was present in the Kingdom one day before the start-of-work date. 2- A Social Insurance certificate, an official document issued by the General Organization for Social Insurance dated 07/11/2025 CE in the name of Hisham Hamed Mohammed Hamed, ID (2594307478), who is the plaintiff, with the issuing entity being Bakoorah Information Technology Est., the defendant, stating the enrollment date as 16/10/2024 CE. 3- Another ordinary document certified by a government employee, being a technical and financial proposal submitted by the defendant to the Saudi Electricity Regulatory Authority, which includes a site visit by the representative Hisham Hamed (the plaintiff) on October 21. 4- A set of screenshots from the defendant company's system showing the plaintiff's daily tasks, one of which is dated October 26. As for the defendant's argument that the termination occurred during the probationary period (90 days from the start-of-work date), the last working day was 27/03/2025 CE, and the difference between the two dates is 161 days, meaning the worker had exceeded the probationary period. A review of this memorandum is required.`}},
      ]},
      {title:'تحرير دعوى',tests:[
        {q:{ar:`موضوع الدعوى: إنه بتاريخ 1446/09/3هـ وقع حادث مروري في رابغ (طريق البحر الأحمر) بين: الطرف الأول: المركبة التي يملكها المدعي من نوع تويوتا كامري سنة الصنع 2015 رقم اللوحة (ح ع ص 9097)، والتي كان يقودها المدعي وكانت متحركة أثناء وقوع الحادث. الطرف الثاني: المركبة التي تملكها شركة ... من نوع اشوك ليلاند حافلة سنة الصنع 2020 رقم اللوحة (ب ر م 3034)، والتي كان يقودها المدعى عليه وكانت متحركة أثناء وقوع الحادث. وحصل الحادث بأن الطرف الأول قادم من الغرب والطرف الثاني قادم من الشمال وتجاوز الإشارة الحمراء وارتطم بالطرف الأول. ويوجد تقرير صادر عن الإدارة العامة للمرور برقم (1003817311E9) بتاريخ 1446/10/11هـ حدّد نسبة الخطأ على المدعى عليه بنسبة 100%. علمًا أن لدى المدعي تأمينًا ضد الغير برقم بوليصة (P/205/5515/19/00912245/00/005)، ولدى المدعى عليه تأمين أيضًا. نتج عن الحادث إصابة جيبلي حنا موسى (ذكر): تهتك في مقلة العين اليسرى تمت خياطته بـ10 غرز لتثبيته، ولا يوجد تقرير من مقدّري الشجاج، ولا حكم في الحق العام. طلبات المدعي: إلزام المدعى عليه بدفع أرش الإصابات وقدره (150,000.00) مائة وخمسون ألف ريال سعودي. المطلوب تحرير هذه الدعوى.`,en:`Subject of the lawsuit: on 03/09/1446 AH, a traffic accident occurred in Rabigh (Red Sea Road) between: First party: the vehicle owned by the plaintiff, a Toyota Camry, model year 2015, plate number (H A S 9097), which was being driven by the plaintiff and was in motion at the time of the accident. Second party: the vehicle owned by ... Company, an Ashok Leyland bus, model year 2020, plate number (B R M 3034), which was being driven by the defendant and was in motion at the time of the accident. The accident occurred when the first party was coming from the west and the second party was coming from the north and ran the red light, colliding with the first party. There is a report issued by the General Traffic Department under No. (1003817311E9) dated 11/10/1446 AH, which determined the defendant to be 100% at fault. Note that the plaintiff has third-party insurance under policy No. (P/205/5515/19/00912245/00/005), and the defendant also has insurance. The accident resulted in an injury to Gebaly Hanna Moussa (male): a laceration to the left eyeball, sutured with 10 stitches to close it, with no report yet from the injury (shajjaj) assessors, and no ruling in the public-right claim. Plaintiff's requests: that the defendant be ordered to pay injury compensation (arsh) in the amount of (150,000.00) one hundred fifty thousand Saudi riyals. Drafting this lawsuit is required.`}},
      ]},

function migrateQBankGeneral(bank){
  if(!bank.general)return bank;
  const TAG_MAP={'حالات السريان والإلغاء':'expiry','القدرات التحليلية':'analytical','الاستحضار وعدم الهلوسة':'hallucination','شمول قاعدة البيانات':'coverage','تعديلات المواد':'amendments'};
  const NEW_KEYS=['expiry','analytical','hallucination','coverage','amendments'];
  NEW_KEYS.forEach(k=>{bank[k]={label:DEF_QBANK[k].label,type:'flat',sub:DEF_QBANK[k].sub,cats:[{title:'الكل',tests:[]}]};});
  ((bank.general.cats[0]||{}).tests||[]).forEach(t=>{
    const tag=(t.tags||[])[0];
    if(tag==='قدرات الصياغة')return;
    const key=TAG_MAP[tag]||'analytical';
    bank[key].cats[0].tests.push({q:t.q,criteria:t.criteria||[]});
  });
  delete bank.general;
  return bank;
}
/* هجرة قسم «اختبار رفع الملفات» الواحد إلى قسمَي لغة الملف.
   الاختبار القديم كان صفًّا مسطّحًا {q:{ar,en},fileLink,goal,criteria}: الرابط
   يتكرر مع كل سؤال، واللغتان ترجمتان لطلب واحد. يُحوَّل كل صفٍّ إلى ملفٍ بسؤال
   واحد، ويُوضع في القسم الذي يوافق اللغة المكتوب بها فعلًا. */
function migrateQBankFiles(bank){
  ['fileUploadAr','fileUploadEn'].forEach(k=>{
    if(!bank[k])bank[k]=clone(DEF_QBANK[k]);
    else bank[k].fileLang=DEF_QBANK[k].fileLang;
  });
  const old=bank.fileUpload;
  if(old){
    ((old.cats||[]).flatMap(c=>c.tests||[])).forEach(t=>{
      const ar=bilingualExact(t.q,'ar'),en=bilingualExact(t.q,'en');
      const key=(!ar&&en)?'fileUploadEn':'fileUploadAr';
      const text=key==='fileUploadEn'?en:ar;
      bank[key].cats[0].tests.push({
        title:(t.goal||text||'ملف').slice(0,70),
        file:{name:'',url:t.fileLink||'',format:'',pages:''},
        goal:t.goal||'',
        questions:[{q:text||'',criteria:critArray(t.criteria),followUp:null}],
      });
    });
    delete bank.fileUpload;
  }
  return bank;
}
let BANK_IMPORTS=load(K.bankImports,[]);
let QBANK=load(K.qbank,DEF_QBANK);
if(QBANK.general){QBANK=migrateQBankGeneral(QBANK);save(K.qbank,QBANK);}
if(QBANK.fileUpload||!QBANK.fileUploadAr||!QBANK.fileUploadEn){QBANK=migrateQBankFiles(QBANK);save(K.qbank,QBANK);}

/* دمج دفعة أسئلة في البنك المحفوظ.

   لماذا هجرة وقت التشغيل لا إضافة في DEF_QBANK: البنك يُقرأ بـ load(K.qbank,DEF_QBANK)
   والنسخة المحفوظة تغلب الافتراضية، فالإضافة إلى الافتراضي وحده لا تصل لأحد.

   يُنفَّذ مرة واحدة ويُسجَّل معرّفه، حتى لا ترجع الأسئلة إن حذفها المستخدم لاحقًا.
   وداخل التنفيذة الواحدة لا يمكن أن يتكرّر سؤال: الموجود يُستبدَل ولا يُضاف. */
function qNorm(s){
  return String(s==null?'':s)
    .replace(/[\u064B-\u0652\u0670\u0640]/g,'')
    .replace(/[\u0623\u0625\u0622]/g,'\u0627').replace(/\u0649/g,'\u064A')
    .replace(/\u0629/g,'\u0647').replace(/\u0624/g,'\u0648').replace(/\u0626/g,'\u064A')
    .replace(/[^\u0621-\u064A0-9a-zA-Z\s]/g,' ').replace(/\s+/g,' ').trim();
}
/* معامل دايس على مجموعتي الكلمات — يمسك إعادة الصياغة ولا يتأثر بترتيب الجُمل */
function qSimilarity(a,b){
  const A=new Set(qNorm(a).split(' ').filter(Boolean));
  const B=new Set(qNorm(b).split(' ').filter(Boolean));
  if(!A.size||!B.size)return 0;
  let inter=0;A.forEach(w=>{if(B.has(w))inter++;});
  return 2*inter/(A.size+B.size);
}
const BANK_IMPORT_MATCH=0.85;
function applyBankImport(id,win,items){
  if(BANK_IMPORTS.indexOf(id)>-1)return null;
  /* القسم الهدف قد يكون غائبًا أو مشوّهًا في بنك مُعدَّل يدويًا منذ زمن. لا نُسقط
     الدفعة في هذه الحالة — نُنشئ القسم من الافتراضي ونكمل، لأن غياب القسم ليس
     سببًا لضياع أسئلة طُلب إدخالها. */
  if(!QBANK[win]){
    const d=DEF_QBANK[win];
    QBANK[win]={label:(d&&d.label)||win,type:(d&&d.type)||'flat',sub:(d&&d.sub)||'',cats:[{title:'الكل',tests:[]}]};
  }
  if(!Array.isArray(QBANK[win].cats)||!QBANK[win].cats.length)QBANK[win].cats=[{title:'الكل',tests:[]}];
  if(!Array.isArray(QBANK[win].cats[0].tests))QBANK[win].cats[0].tests=[];
  let added=0;const replaced=[];
  items.forEach(it=>{
    let hit=null;
    Object.entries(QBANK).forEach(([wk,w])=>(w.cats||[]).forEach(c=>(c.tests||[]).forEach(t=>{
      const s=qSimilarity(bilingualExact(t.q,'ar'),it.q.ar);
      if(s>=BANK_IMPORT_MATCH&&(!hit||s>hit.s))hit={t,s,win:wk};
    })));
    if(hit){hit.t.q=clone(it.q);hit.t.criteria=clone(it.criteria);replaced.push(hit.win);}
    else{QBANK[win].cats[0].tests.push(clone(it));added++;}
  });
  /* البنك يُحفظ قبل العلامة لا بعدها: العلامة مشتركة بين الفريق، فلو سبقت حفظ
     البنك وفشل حفظه لظلّ الاستيراد «منجزًا» عند الجميع بلا أسئلة، ولا يعيد أحد
     المحاولة أبدًا. بهذا الترتيب أسوأ الأحوال إعادة استيراد لا فقدانه. */
  save(K.qbank,QBANK);
  BANK_IMPORTS.push(id);save(K.bankImports,BANK_IMPORTS);
  /* الاستيراد يغيّر بنكًا مشتركًا بين الفريق، فلا يمر بصمت على من يفتح التطبيق بعده */
  if(added||replaced.length)setTimeout(()=>toast(`بنك الأسئلة: أُضيف ${added} سؤال${replaced.length?` واستُبدل ${replaced.length}`:''} في ${QBANK[win].label}`),700);
  return {added,replaced};
}
/* المعرّف مرقّى إلى -b ليُعاد الاستيراد مرة واحدة: النسخة الأولى كانت تكتب علامة
   «تم» قبل حفظ البنك، فأمكن أن تبقى العلامة عند الفريق بلا أسئلة فلا يعيد أحد
   المحاولة. إعادة الاستيراد غير مضرّة — السؤال الموجود يُستبدل ولا يُضاف. */
applyBankImport('analytical-2026-08-04-b','analytical',IMPORT_ANALYTICAL_2026_08_04);

function bilingualText(val,lang){
  if(val==null)return '';

  const q=t.questions[qi];

  else if(app.sub==='fmImport') fileManualImport();
  else if(app.sub==='fmIntro') fileManualIntro();
  else if(app.sub==='fmTest') fileManualTest();
  else if(app.sub==='fmReview') fileManualReview();
  else if(app.sub==='fmViewRun') renderFileManualRunView();
  else renderDashboard();
  buildToc();
  bindEditable();
}
function buildToc(){
  const heads=[...screen.querySelectorAll('h1,h2')];
  const list=document.getElementById('tocList');
  if(!heads.length){list.innerHTML='<span class="muted-note">لا عناصر في هذه الصفحة</span>';return;}
  heads.forEach((h,i)=>{if(!h.id)h.id='sec-'+i;});
  list.innerHTML=heads.map((h,i)=>`<a href="#${h.id}" class="tocitem ${h.tagName==='H2'?'sub':''} ${i===0?'on':''}" data-scroll="${h.id}">${esc(h.textContent)}</a>`).join('');
  list.querySelectorAll('[data-scroll]').forEach(a=>a.onclick=(e)=>{e.preventDefault();document.getElementById(a.dataset.scroll).scrollIntoView({behavior:'smooth',block:'start'});list.querySelectorAll('.tocitem').forEach(x=>x.classList.remove('on'));a.classList.add('on');});
}

    const all=w.cats[0].tests;
    const tests=all.filter(t=>!q||bilingualText(t.q,lang).toLowerCase().includes(q));
    const rows=tests.map(t=>{
      const ti=all.indexOf(t);
      const criteria=(t.criteria||[]).map(x=>`<li>${esc(x)}</li>`).join('');
      return `<div class="subacc ${t._open?'open':''}" data-bq="0|${ti}">
        <div class="head"><span class="caret">▶</span><span class="title" style="font-size:13.5px;flex:1;font-weight:500;">${esc(bilingualText(t.q,lang))}</span>

          <div class="answerbox" style="margin-top:0;background:var(--card-2);"><span class="lbl">نص السؤال</span><div class="txt">${esc(bilingualText(t.q,lang))}</div></div>
          <div class="criteria-box"><span class="lbl">عناصر الإجابة الصحيحة</span><ul>${criteria}</ul></div>
        </div>
      </div>`;
    }).join('');
    document.getElementById('bankResults').innerHTML=rows||'<div class="card"><div class="empty">لا نتائج مطابقة.</div></div>';
  } else if(w.type==='conversation'){
    const all=w.cats[0].tests;
    const tests=all.filter(t=>{
      if(!q) return true;
      const hay=(t.title||'')+' '+(t.messages||[]).map(m=>bilingualText(m.q,lang)).join(' ');
      return hay.toLowerCase().includes(q);
    });
    const rows=tests.map(t=>{
      const ti=all.indexOf(t);
      const msgs=(t.messages||[]).map((m,mi,arr)=>{
        const arrow=mi<arr.length-1?`<div class="conv-arrow">↓</div>`:'';
        return `<div class="conv-msg"><span class="conv-num">${mi+1}</span><span class="conv-text">${esc(bilingualText(m.q,lang))}</span><button class="copybtn" data-bcopymsg="0|${ti}|${mi}" title="نسخ هذا السؤال"><svg class="icon"><use href="#ic-copy"/></svg></button></div>${arrow}`;
      }).join('');
      return `<div class="subacc ${t._open?'open':''}" data-bq="0|${ti}">
        <div class="head"><span class="caret">▶</span><span class="title" style="font-size:13.5px;flex:1;font-weight:500;">${esc(t.title)||'محادثة '+(ti+1)}</span><span class="badge-n" style="margin-inline-start:8px;">${(t.messages||[]).length} سؤال</span>
        <button class="copybtn" data-bcopyconv="0|${ti}" title="نسخ المحادثة كاملة"><svg class="icon"><use href="#ic-copy"/></svg></button></div>
        <div class="body">
          <div class="conv-flow">${msgs||'<div class="muted-note">لا أسئلة بعد.</div>'}</div>
          <div class="criteria-box"><span class="lbl">معايير المحادثة الناجحة</span><p style="margin:0;">${esc(t.criteria)||'<span class="muted-note">لم تُحدَّد بعد.</span>'}</p></div>
        </div>

  } else if(w.type==='fileupload'){
    const all=w.cats[0].tests;
    const tests=all.filter(t=>{
      if(!q)return true;
      const hay=(t.title||'')+' '+((t.file||{}).name||'')+' '+(t.goal||'')+' '+fileTestQuestions(t).map(x=>(x.q||'')+' '+((x.followUp||{}).q||'')).join(' ');
      return hay.toLowerCase().includes(q);
    });
    const rows=tests.map(t=>{
      const ti=all.indexOf(t);
      const qs=fileTestQuestions(t);
      const nFu=qs.filter(fileFollowUp).length;
      const critList=arr=>`<ul dir="auto">${critArray(arr).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
      const qsHtml=qs.map((x,qi)=>{
        const fu=fileFollowUp(x);
        return `<div class="conv-msg"><span class="conv-num">${qi+1}</span>
            <span class="conv-text" dir="auto">${esc(x.q)}</span>
            <button class="copybtn" data-bcopyfq="0|${ti}|${qi}" title="نسخ السؤال"><svg class="icon"><use href="#ic-copy"/></svg></button></div>
          <div class="criteria-box" style="margin-top:8px;"><span class="lbl">عناصر الإجابة الصحيحة</span>${critList(x.criteria)}</div>
          ${fu?`<div class="conv-arrow">↓</div>
            <div class="conv-msg"><span class="conv-tag">تابع</span>
              <span class="conv-text" dir="auto">${esc(fu.q)}</span>

          ${qi<qs.length-1?'<div style="height:1px;background:var(--line);margin:16px 0;"></div>':''}`;
      }).join('');
      const file=t.file||{},meta=fileMetaLine(file);
      return `<div class="subacc ${t._open?'open':''}" data-bq="0|${ti}">
        <div class="head"><span class="caret">▶</span><span class="title" style="font-size:13.5px;flex:1;font-weight:500;">${esc(t.title)||esc(file.name)||'ملف بلا عنوان'}</span>

        <div class="body">
          <div class="answerbox" style="margin-top:0;background:var(--card-2);"><span class="lbl">الملف المرفوع</span>
            <div class="txt">${esc(file.name||'—')}${meta?` <span class="muted-note">· ${esc(meta)}</span>`:''}</div>
            ${file.url?`<div class="row" style="margin-top:10px;"><a href="${esc(file.url)}" download class="btn btn-primary btn-sm"><svg class="icon"><use href="#ic-paperclip"/></svg> تنزيل الملف</a><a href="${esc(file.url)}" target="_blank" rel="noopener noreferrer" class="btn btn-ghost btn-sm"><svg class="icon"><use href="#ic-external-link"/></svg> فتح في تبويب</a></div>`:'<div class="muted-note" style="margin-top:8px;">لا يوجد ملف مرفق — أضِفه من الإعدادات ← بنك الأسئلة.</div>'}
          </div>
          ${t.goal?`<div class="tip"><span class="ic"><svg class="icon"><use href="#ic-lamp"/></svg></span><div><b>الهدف من الاختبار:</b> ${esc(t.goal)}</div></div>`:''}

        </div>
      </div>`;
    }).join('');
    document.getElementById('bankResults').innerHTML=rows||'<div class="card"><div class="empty">لا نتائج مطابقة.</div></div>';
  } else {
    const allSingle=w.cats.every(c=>c.tests.length===1);
    const cats=w.cats.map((c,ci)=>{
      const tests=c.tests.filter(t=>!q||(bilingualText(t.q,lang)+' '+c.title).toLowerCase().includes(q));
      if(!tests.length) return '';
      if(allSingle){
        const ti=c.tests.indexOf(tests[0]);
        return `<div class="qrow"><span class="chip" style="flex:0 0 auto;">${esc(c.title)}</span><span class="qtext">${esc(bilingualText(tests[0].q,lang))}</span><button class="copybtn" data-bcopy="${ci}|${ti}" title="نسخ السؤال"><svg class="icon"><use href="#ic-copy"/></svg></button></div>`;
      }
      const rows=tests.map(t=>{
        const ti=c.tests.indexOf(t);
        return `<div class="qrow"><span class="qtext">${esc(bilingualText(t.q,lang))}</span><button class="copybtn" data-bcopy="${ci}|${ti}" title="نسخ السؤال"><svg class="icon"><use href="#ic-copy"/></svg></button></div>`;
      }).join('');
      return `<div class="acc ${c._open?'open':''}" data-bcat="${ci}"><div class="head"><span class="caret">▶</span><span class="title">${esc(c.title)}</span><span class="sub-c" style="margin-inline-start:auto;">${tests.length} سؤال</span></div>
        <div class="body">${rows}</div></div>`;

    document.getElementById('bankResults').innerHTML=cats||'<div class="card"><div class="empty">لا نتائج مطابقة للبحث.</div></div>';
  }
  bindBankResults(win,lang);

function bindBankResults(win,lang){
  const w=QBANK[win];
  screen.querySelectorAll('[data-bcat]').forEach(a=>a.querySelector('.head').onclick=()=>{const ci=+a.dataset.bcat;w.cats[ci]._open=!w.cats[ci]._open;renderBankResults(win);});

  screen.querySelectorAll('[data-bcopyfq]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();const[ci,ti,qi]=b.dataset.bcopyfq.split('|');copyText(fileTestQuestions(w.cats[+ci].tests[+ti])[+qi].q);});
  screen.querySelectorAll('[data-bcopyfu]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();const[ci,ti,qi]=b.dataset.bcopyfu.split('|');const fu=fileFollowUp(fileTestQuestions(w.cats[+ci].tests[+ti])[+qi]);if(fu)copyText(fu.q,'تم نسخ السؤال التابع');});
  screen.querySelectorAll('[data-bcopy]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();const[ci,ti]=b.dataset.bcopy.split('|');copyText(bilingualText(w.cats[+ci].tests[+ti].q,lang));});
  screen.querySelectorAll('[data-bcopyconv]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();const[ci,ti]=b.dataset.bcopyconv.split('|');const conv=w.cats[+ci].tests[+ti];copyText((conv.messages||[]).map(m=>bilingualText(m.q,lang)).join('\n\n'),'تم نسخ المحادثة');});

}

/* ===== الصفحة الرئيسية ===== */
/* الإحصائيات تُحتسب من اختبارات الذكاء (V2_RUNS) وحدها. الاختبارات اليدوية القديمة
   مقياسها مختلف (نجح/لم ينجح يدويًا، وتقييم من ٥ في الجودة) فخلطها بالنِّسب يشوّه
   المتوسط والحدّين. وكل نسبة تُحتسب من الجلسات المقيَّمة فقط. */
function homeAgg(list){
  const sc=list.filter(r=>r.score!=null).map(r=>r.score);
  return {
    n:list.length,
    /* البنود ليست الأسئلة: جلسة «الوضعان» تُنفِّذ كل سؤال مرتين، فيُحتسب السؤال
       مرة واحدة وتُحتسب البنود مرتين. questionCount يغيب عن الجلسات القديمة. */
    questions:list.reduce((m,r)=>m+(r.questionCount||(r.items||[]).length),0),
    items:list.reduce((m,r)=>m+(r.items||[]).length,0),
    avg:sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length*10)/10:null,
    best:sc.length?Math.max(...sc):null,
    worst:sc.length?Math.min(...sc):null,
  };
}
function homeStats(){
  return {
    all:homeAgg(V2_RUNS),
    smoke:homeAgg(V2_RUNS.filter(r=>r.kind==='smoke')),
    quality:homeAgg(V2_RUNS.filter(r=>r.kind==='quality')),
    files:homeAgg(V2_RUNS.filter(r=>r.kind==='files')),
    disputed:V2_RUNS.reduce((m,r)=>m+(r.items||[]).filter(x=>x.review&&x.review.agree===false).length,0),
    last:V2_RUNS.length?V2_RUNS[0]:null,
  };
}

function qualityRunRow(r,i,isDraft){
  const done=r.results.filter(x=>x.rating).length;
  const avg=r.avgRating!=null?r.avgRating:(done?(r.results.reduce((s,x)=>s+(x.rating||0),0)/done).toFixed(1):null);
  const badge=isDraft?`<span class="badge draft">مسودة ${done}/${r.tests.length}</span>`:`<span class="badge ${avg>=4?'pass':avg>=2.5?'draft':'fail'}">متوسط ${avg}/5</span>`;
  const actions=isDraft?`<button class="btn btn-primary btn-sm" data-resume="${i}">إكمال</button><button class="iconbtn del" data-deldraft="${i}"><svg class="icon"><use href="#ic-trash"/></svg></button>`:`<button class="btn btn-ghost btn-sm" data-viewrun="${i}"><svg class="icon"><use href="#ic-external-link"/></svg> استعراض</button><button class="iconbtn" data-share="${i}"><svg class="icon"><use href="#ic-share"/></svg></button><button class="iconbtn del" data-delrun="${i}"><svg class="icon"><use href="#ic-trash"/></svg></button>`;
  return `<div class="lrow"><div class="ri"><div class="t">${esc(r.employee||'—')}</div><div class="m">${esc(r.date)} • ${r.tests.length} سؤال${r.model?' • المودل: '+esc(r.model):''}${r.reason?' • '+esc(r.reason):''}</div></div>${badge}${actions}</div>`;
}
function runRow(r,i,isDraft){
  const passed=r.results.filter(x=>x.result==='pass').length,failed=r.results.filter(x=>x.result==='fail').length,done=r.results.filter(x=>x.result).length;
  const badge=isDraft?`<span class="badge draft">مسودة ${done}/${r.tests.length}</span>`:(failed===0?`<span class="badge pass">مجتاز بالكامل</span>`:`<span class="badge fail">${failed} لم تجتَز</span>`);
  const actions=isDraft?`<button class="btn btn-primary btn-sm" data-resume="${i}">إكمال</button><button class="iconbtn del" data-deldraft="${i}"><svg class="icon"><use href="#ic-trash"/></svg></button>`:`<button class="btn btn-ghost btn-sm" data-viewrun="${i}"><svg class="icon"><use href="#ic-external-link"/></svg> استعراض</button><button class="iconbtn" data-share="${i}"><svg class="icon"><use href="#ic-share"/></svg></button><button class="iconbtn del" data-delrun="${i}"><svg class="icon"><use href="#ic-trash"/></svg></button>`;
  return `<div class="lrow"><div class="ri"><div class="t">${esc(r.employee||'—')}</div><div class="m">${esc(r.date)} • ${r.tests.length} حالة${isDraft?'':` • مجتاز ${passed} / غير مجتاز ${failed}`}${r.model?' • المودل: '+esc(r.model):''}${r.reason?' • '+esc(r.reason):''}</div></div>${badge}${actions}</div>`;
}
