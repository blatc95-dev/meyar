function smokeSaveDraft(){const r=app.ctx.run,d=clone(r);d.savedAt=new Date().toISOString();if(app.ctx.draftIndex!=null){d.id=DRAFTS[app.ctx.draftIndex].id;DRAFTS[app.ctx.draftIndex]=d;}else{d.id='d'+Date.now()+Math.random().toString(36).slice(2,7);DRAFTS.unshift(d);app.ctx.draftIndex=0;}save(K.drafts,DRAFTS);toast('تم حفظ المسودة');}

function smokeTest(){
  const r=app.ctx.run,i=r.step,t=r.tests[i],res=r.results[i],total=r.tests.length;
  setCrumb(`الحالة ${i+1}/${total}`);
  const dual=isDual(t);
  res.modeResults=res.modeResults||{};
  res.lang=res.lang||'ar';
  const hasEn=!t.custom&&(t.questions||[]).some(q=>bilingualHas(typeof q==='string'?null:q&&q.text,'en'));
  const langToggle=hasEn?`<div class="optpills" style="margin-bottom:8px;"><button class="optpill ${res.lang==='ar'?'on':''}" data-qlang="ar">عربي</button><button class="optpill ${res.lang==='en'?'on':''}" data-qlang="en">English</button></div>`:'';
  let qHtml;
  if(t.custom){qHtml=`<div class="qline"><textarea id="cq" placeholder="${esc(t.customHint||'اكتب السؤال المستخدم')}">${esc(res.customText)}</textarea><button class="copybtn" id="cqCopy"><svg class="icon"><use href="#ic-copy"/></svg> نسخ</button></div>`;}
  else{qHtml=(t.questions||[]).map((q,qi)=>{const qf=qFile(q);return `<label class="qoption ${res.qIndex===qi?'sel':''}" data-i="${qi}"><input type="radio" ${res.qIndex===qi?'checked':''}><span class="qtext">${esc(qText(q,res.lang))}${qf?` · <a href="${esc(qf)}" target="_blank" rel="noopener" class="qfilelink" data-stop>ملف مساعد <svg class="icon"><use href="#ic-external-link"/></svg></a>`:''}</span><span class="copybtn" data-copy="${qi}"><svg class="icon"><use href="#ic-copy"/></svg></span></label>`;}).join('');}

  // منطقة نتيجة التنفيذ: مفردة أو ثنائية
  let verdictHtml;
  if(dual){
    verdictHtml=`
      <div class="dualnote"><svg class="icon"><use href="#ic-repeat"/></svg> هذه الحالة تُنفَّذ في وضعين. حدّد نتيجة كل وضع؛ وتُحتسب مجتازة فقط إذا نجح الوضعان.</div>
      ${modeCard('normal','عادي',res)}
      ${modeCard('detailed','تفصيلي',res)}`;
  }else{
    const only=modeList(t)[0];
    verdictHtml=`
      <div class="verdict">
        <button class="vbtn pass ${res.result==='pass'?'on':''}" id="pass"><span class="mk"><svg class="icon"><use href="#ic-check"/></svg></span> مجتاز</button>
        <button class="vbtn fail ${res.result==='fail'?'on':''}" id="fail"><span class="mk"><svg class="icon"><use href="#ic-x"/></svg></span> غير مجتاز</button>
      </div>`;
  }

  screen.innerHTML=`<div class="card">
    <div class="progress-meta"><span>${esc(t.cat)}</span><span>الحالة ${i+1} من ${total}</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${(i/total)*100}%"></div></div>
    <div style="margin-top:14px;"><b style="font-size:17px;color:var(--ink-2);">${esc(t.title)}</b></div>
    <div class="section-h">${t.custom?'السؤال المستخدم':'اختر سؤالًا واحدًا (يُنسخ تلقائيًا)'}</div>
    ${langToggle}
    ${qHtml}
    ${t.fileNote?`<div class="filenote"><svg class="icon"><use href="#ic-paperclip"/></svg> ${esc(t.fileNote)}</div>`:''}
    ${t.reason?`<div class="reason"><b>سبب الحالة:</b> ${esc(t.reason)}</div>`:''}
    <div class="row" style="margin-top:14px;"><span class="chip">نوع الوضع المطلوب: <b>${esc(modeLabel(t))}</b></span></div>
    <div class="expected"><span class="lbl">النتيجة المتوقعة</span>${esc(t.expected)}</div>
    <div class="section-h">نتيجة التنفيذ</div>
    ${verdictHtml}
    <div class="notes-block ${res.result==='fail'?'show':''}" id="nb">
      <label>الملاحظات (سبب عدم الاجتياز) — إلزامية</label>
      <textarea class="notes" id="notes" placeholder="صف ما حدث: رسالة الخطأ، الجزء الناقص، الاختلاق...">${esc(res.notes)}</textarea>
      <label style="margin-top:12px;">معرّف السؤال / المحادثة — إلزامي</label>
      <input class="notes" id="convId" placeholder="رقم أو رابط المحادثة في المنصة لمراجعة الخلل" value="${esc(res.convId||'')}">
    </div>
    <div class="warnmsg" id="w"></div>
    <div class="nav-btns">
      <div class="row"><button class="btn btn-ghost" id="prev">→ السابق</button><button class="btn btn-ghost" id="draft"><svg class="icon"><use href="#ic-save"/></svg> حفظ كمسودة</button></div>
      <button class="btn btn-primary" id="next">${i===total-1?'إنهاء ومراجعة':'التالي ←'}</button>
    </div>
  </div>`;

  if(t.custom){const ta=document.getElementById('cq');ta.oninput=e=>res.customText=e.target.value;document.getElementById('cqCopy').onclick=()=>{if(ta.value.trim())copyText(ta.value.trim());};}
  else{
    screen.querySelectorAll('.qoption').forEach(el=>{const qi=+el.dataset.i;el.onclick=(e)=>{if(e.target.closest('[data-stop]'))return;res.qIndex=qi;screen.querySelectorAll('.qoption').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');el.querySelector('input').checked=true;copyText(qText(t.questions[qi],res.lang));};});
    screen.querySelectorAll('[data-copy]').forEach(b=>b.onclick=e=>{e.stopPropagation();copyText(qText(t.questions[+b.dataset.copy],res.lang));});
    screen.querySelectorAll('[data-stop]').forEach(a=>a.onclick=e=>e.stopPropagation());
    screen.querySelectorAll('[data-qlang]').forEach(b=>b.onclick=()=>{res.lang=b.dataset.qlang;smokeTest();});
  }
  const nb=document.getElementById('nb'),notes=document.getElementById('notes'),convId=document.getElementById('convId');
  notes.oninput=e=>res.notes=e.target.value; convId.oninput=e=>res.convId=e.target.value;
  const syncFail=()=>{ if(res.result==='fail'){nb.classList.add('show');}else{nb.classList.remove('show');} };

  if(dual){
    // كل مربّع وضع
    screen.querySelectorAll('[data-mode]').forEach(box=>{
      box.querySelectorAll('[data-mv]').forEach(btn=>btn.onclick=(e)=>{
        e.stopPropagation();
        const mode=box.dataset.mode, val=btn.dataset.mv;
        res.modeResults[mode]=val;
        // النتيجة الكلية: مجتاز فقط لو كل الأوضاع مجتازة، وتُحسب fail لو أي وضع fail
        const ms=modeList(t).map(m=>res.modeResults[m]);
        if(ms.some(x=>x==='fail')) res.result='fail';
        else if(ms.every(x=>x==='pass')) res.result='pass';
        else res.result=null;
        smokeTest();
      });
    });
  }else{
    document.getElementById('pass').onclick=()=>{res.result='pass';res.modeResults={};document.getElementById('pass').classList.add('on');document.getElementById('fail').classList.remove('on');syncFail();};
    document.getElementById('fail').onclick=()=>{res.result='fail';res.modeResults={};document.getElementById('fail').classList.add('on');document.getElementById('pass').classList.remove('on');syncFail();notes.focus();};
  }
  document.getElementById('draft').onclick=smokeSaveDraft;
  document.getElementById('prev').onclick=()=>{if(i===0){app.sub=app.ctx.draftIndex!=null?null:'intro';}else{r.step--;}render();window.scrollTo(0,0);};
  document.getElementById('next').onclick=()=>{
    const w=document.getElementById('w');
    const hasQ=t.custom?res.customText.trim():res.qIndex!==null;
    if(!hasQ){w.textContent=t.custom?'اكتب السؤال أولًا.':'اختر سؤالًا أولًا.';w.classList.add('show');return;}
    if(dual){
      const ms=modeList(t);
      if(ms.some(m=>!res.modeResults[m])){w.textContent='حدّد نتيجة كل وضع (عادي وتفصيلي).';w.classList.add('show');return;}
    } else if(!res.result){w.textContent='حدّد نتيجة التنفيذ.';w.classList.add('show');return;}
    if(res.result==='fail'&&!res.notes.trim()){w.textContent='الملاحظات إلزامية عند عدم الاجتياز.';w.classList.add('show');notes.focus();return;}
    if(res.result==='fail'&&!(res.convId||'').trim()){w.textContent='معرّف السؤال / المحادثة إلزامي عند عدم الاجتياز.';w.classList.add('show');convId.focus();return;}
    if(i===total-1){app.sub='review';}else{r.step++;}render();window.scrollTo(0,0);
  };
}
function modeCard(key,label,res){
  const v=(res.modeResults||{})[key];
  return `<div style="margin-top:10px;border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;background:var(--card-2);">
    <div style="font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px;"><svg class="icon"><use href="#ic-${key==='normal'?'search':'search-zoom'}"/></svg> الوضع ${label}</div>
    <div class="verdict" style="margin-top:0;" data-mode="${key}">
      <button class="vbtn pass ${v==='pass'?'on':''}" data-mv="pass"><span class="mk"><svg class="icon"><use href="#ic-check"/></svg></span> مجتاز</button>
      <button class="vbtn fail ${v==='fail'?'on':''}" data-mv="fail"><span class="mk"><svg class="icon"><use href="#ic-x"/></svg></span> غير مجتاز</button>
    </div></div>`;
}

function chosenQuestion(run,i){const t=run.tests[i],r=run.results[i];if(t.custom)return (r.customText||'').trim()||'—';return r.qIndex!=null?qText(t.questions[r.qIndex],r.lang):'—';}
function chosenQuestionFile(run,i){const t=run.tests[i],r=run.results[i];if(t.custom||r.qIndex==null)return '';return qFile(t.questions[r.qIndex]);}
function chosenQuestionLang(run,i){const r=run.results[i];return r.lang==='en'?'English':'';}
function modeResultText(run,i){const t=run.tests[i],r=run.results[i];if(!isDual(t)||!r.modeResults)return '';const parts=[];if(r.modeResults.normal)parts.push('عادي: '+(r.modeResults.normal==='pass'?'مجتاز':'غير مجتاز'));if(r.modeResults.detailed)parts.push('تفصيلي: '+(r.modeResults.detailed==='pass'?'مجتاز':'غير مجتاز'));return parts.join(' • ');}
function buildSummaryText(run){
  const passed=run.results.filter(r=>r.result==='pass').length,failed=run.results.filter(r=>r.result==='fail').length;
  const overall=failed===0?'مجتاز بالكامل':`يوجد ${failed} حالة لم تجتَز`;
  let L=['📋 تقرير اختبار الدخان — منصة مِعيار',`${SETTINGS.team} — ${SETTINGS.product}`,'———————————————',`الموظف: ${run.employee}`,`التاريخ: ${run.date}`];
  if(run.model)L.push(`المودل: ${run.model}`);
  if(run.reason)L.push(`سبب الاختبار: ${run.reason}`);
  L.push(`النتيجة: ${overall}  (مجتاز ${passed} / غير مجتاز ${failed} من ${run.tests.length})`,'———————————————');
  let lastCat='';
  run.tests.forEach((t,i)=>{const r=run.results[i];if(t.cat!==lastCat){L.push('',`【 ${t.cat} 】`);lastCat=t.cat;}
    L.push(`${r.result==='pass'?'✅':'❌'} ${t.title}`);
    L.push(`   السؤال${chosenQuestionLang(run,i)?' ('+chosenQuestionLang(run,i)+')':''}: ${chosenQuestion(run,i)}`);
    const mr=modeResultText(run,i); if(mr)L.push(`   الأوضاع: ${mr}`);
    if(r.result==='fail'){L.push(`   الملاحظات: ${r.notes}`);L.push(`   معرّف السؤال/المحادثة: ${r.convId||'—'}`);}
  });
  return L.join('\n');
}
function runResultRows(run){
  let rows='';
  run.tests.forEach((t,i)=>{const r=run.results[i],b=r.result==='pass'?'pass':'fail',bt=r.result==='pass'?'مجتاز':'غير مجتاز';const mr=modeResultText(run,i);const qf=chosenQuestionFile(run,i);
    rows+=`<div class="rrow"><div class="rhead"><b style="color:var(--ink-2);">${esc(t.title)}</b><span class="badge ${b}">${bt}</span></div>
    <div class="qq"><b>السؤال المختار${chosenQuestionLang(run,i)?' ('+chosenQuestionLang(run,i)+')':''}:</b> ${esc(chosenQuestion(run,i))}${qf?` · <a href="${esc(qf)}" target="_blank" rel="noopener" class="qfilelink">ملف مساعد <svg class="icon"><use href="#ic-external-link"/></svg></a>`:''}</div>
    <div class="meta"><b>الوضع:</b> ${esc(modeLabel(t))}${mr?' ('+esc(mr)+')':''} • <b>المتوقع:</b> ${esc(t.expected)}</div>
    ${r.result==='fail'?`<div class="rnotes"><b>الملاحظات:</b> ${esc(r.notes)}<br><b>معرّف السؤال/المحادثة:</b> ${esc(r.convId||'—')}</div>`:''}</div>`;});
  return rows;
}

function qualityStart(){
  app.ctx.qImportSel=app.ctx.qImportSel||[];
  app.ctx.qImportCount=app.ctx.qImportCount||20;
  app.sub='qImport';render();window.scrollTo(0,0);
}
function qualityImport(){
  setCrumb('استيراد من بنك الأسئلة');
  const opts=qualityTypeOptions();
  const sel=app.ctx.qImportSel||[];
  const allOn=sel.includes('__all__');
  const counts=app.ctx.qImportCounts=app.ctx.qImportCounts||{};
  const optsHtml=opts.map(o=>{
    const on=sel.includes(o.key);
    const cnt=Math.min(counts[o.key]!=null?counts[o.key]:3,o.n);
    const stepper=(on&&!allOn)?`<span class="qcount-wrap" style="flex:0 0 auto;display:flex;align-items:center;gap:6px;"><span class="muted-note">عدد</span><input type="number" class="qcount" data-qcount="${esc(o.key)}" min="1" max="${o.n}" value="${cnt}"></span>`:'';
    return `<label class="qoption ${on?'sel':''}" data-qopt="${esc(o.key)}"><input type="checkbox" ${on?'checked':''}><span class="qtext">${esc(o.label)}</span>${stepper}<span class="chip" style="flex:0 0 auto;">من ${o.n}</span></label>`;
  }).join('');
  screen.innerHTML=`<div class="card">
    <div class="eyebrow" data-edit-key="qimport.eyebrow">${esc(t('qimport.eyebrow','قبل البدء'))}</div><h1 class="h1" data-edit-key="qimport.title">${esc(t('qimport.title','استيراد أسئلة من بنك الأسئلة'))}</h1>
    <p class="sub" data-edit-key="qimport.sub">${esc(t('qimport.sub','اختر نوع أو أنواع الأسئلة المطلوب استيرادها لهذا الاختبار. تُسحب الأسئلة من آخر نسخة لبنك الأسئلة وتُقفل كما هي بعد الاستيراد.'))}</p>
    <div class="section-h">نوع السؤال</div>
    <label class="qoption ${allOn?'sel':''}" data-qopt="__all__"><input type="checkbox" ${allOn?'checked':''}><span class="qtext"><b>الكل</b></span></label>
    ${optsHtml||'<div class="muted-note">لا توجد أسئلة في بنك الأسئلة بعد.</div>'}
    ${allOn?`<div class="field" id="countField" style="margin-top:14px;">
      <label>عدد الأسئلة المطلوب استيرادها (عشوائيًا من الكل)</label>
      <input id="f_count" type="number" min="1" value="${esc(app.ctx.qImportCount||20)}">
    </div>`:''}
    <div class="warnmsg" id="w">اختر نوعًا واحدًا على الأقل.</div>
    <div class="nav-btns"><button class="btn btn-ghost" id="cancel">إلغاء</button><button class="btn btn-primary" id="go">استيراد وبدء ←</button></div>
  </div>`;
  document.getElementById('cancel').onclick=()=>{app.sub=null;render();};
  screen.querySelectorAll('[data-qopt]').forEach(el=>el.querySelector('input').onchange=()=>{
    const k=el.dataset.qopt;
    let s=(app.ctx.qImportSel||[]).slice();
    if(k==='__all__'){s=s.includes('__all__')?[]:['__all__'];}
    else{s=s.filter(x=>x!=='__all__');const i=s.indexOf(k);if(i>-1)s.splice(i,1);else s.push(k);}
    app.ctx.qImportSel=s;qualityImport();
  });
  const cf=document.getElementById('f_count');if(cf)cf.oninput=e=>app.ctx.qImportCount=+e.target.value||1;
  screen.querySelectorAll('[data-qcount]').forEach(inp=>inp.oninput=e=>{counts[inp.dataset.qcount]=Math.max(1,+e.target.value||1);});
  document.getElementById('go').onclick=()=>{
    const w=document.getElementById('w');
    const s=app.ctx.qImportSel||[];
    if(!s.length){w.classList.add('show');return;}
    let tests;
    if(s.includes('__all__')){
      const pool=qualityPool(s);
      if(!pool.length){w.textContent='لا توجد أسئلة مطابقة لهذا الاختيار.';w.classList.add('show');return;}
      tests=sample(pool,Math.min(app.ctx.qImportCount||20,pool.length));
    }else{
      tests=[];const seen=new Set();
      s.forEach(k=>{
        const pool=qualityPool([k]);
        sample(pool,Math.min(counts[k]!=null?counts[k]:3,pool.length)).forEach(it=>{const id=it.kind+'|'+JSON.stringify(it.q||it.messages||it.title||'');if(!seen.has(id)){seen.add(id);tests.push(it);}});
      });
      if(!tests.length){w.textContent='لا توجد أسئلة مطابقة لهذا الاختيار.';w.classList.add('show');return;}
    }
    app.ctx.qrun={employee:CURRENT_USER_EMAIL,date:today(),reason:'',model:'',importTypes:s.slice(),tests,results:tests.map(()=>({rating:null,note:'',questionId:'',answerText:'',lang:'ar'})),step:0};
    app.ctx.qDraftIndex=null;
    app.sub='qIntro';render();window.scrollTo(0,0);
  };
}

function qualitySaveDraft(){const r=app.ctx.qrun,d=clone(r);d.savedAt=new Date().toISOString();if(app.ctx.qDraftIndex!=null){d.id=QUALITY_DRAFTS[app.ctx.qDraftIndex].id;QUALITY_DRAFTS[app.ctx.qDraftIndex]=d;}else{d.id='qd'+Date.now()+Math.random().toString(36).slice(2,7);QUALITY_DRAFTS.unshift(d);app.ctx.qDraftIndex=0;}save(K.qualityDrafts,QUALITY_DRAFTS);toast('تم حفظ المسودة');}
function qualityResume(i){app.ctx.qrun=clone(QUALITY_DRAFTS[i]);app.ctx.qDraftIndex=i;app.sub='qTest';render();window.scrollTo(0,0);}

function qualityTest(){
  const r=app.ctx.qrun,i=r.step,item=r.tests[i],res=r.results[i],total=r.tests.length;
  setCrumb(`السؤال ${i+1}/${total}`);
  res.lang=res.lang||'ar';
  let bodyHtml;
  if(item.kind==='conversation'){
    const msgs=(item.messages||[]).map((m,mi,arr)=>{
      const arrow=mi<arr.length-1?`<div class="conv-arrow">↓</div>`:'';
      return `<div class="conv-msg"><span class="conv-num">${mi+1}</span><span class="conv-text">${esc(bilingualText(m.q,res.lang))}</span><button class="copybtn" data-copymsg="${mi}" title="نسخ هذا السؤال"><svg class="icon"><use href="#ic-copy"/></svg></button></div>${arrow}`;
    }).join('');
    bodyHtml=`<div style="margin-top:14px;"><b style="font-size:15px;color:var(--ink-2);">${esc(item.title)||'محادثة'}</b></div>
      <div class="conv-flow" style="margin-top:10px;">${msgs||'<div class="muted-note">لا أسئلة في هذه المحادثة.</div>'}</div>
      ${item.criteria?`<div class="criteria-box" style="margin-top:12px;"><span class="lbl">معايير المحادثة الناجحة (مرجع)</span><p style="margin:0;">${esc(item.criteria)}</p></div>`:''}
      <div class="row" style="margin-top:12px;"><button class="btn btn-ghost btn-sm" id="copyAll"><svg class="icon"><use href="#ic-copy"/></svg> نسخ المحادثة كاملة</button></div>`;
  } else if(item.kind==='fileupload'){
    /* مسودات محفوظة في نسخةٍ كان اختبار الملف فيها نوعًا داخل «جودة يدوي» — تُقرأ
       بنفس عارض شاشة «رفع ملفات يدوي» فلا يتكرّر البناء. */
    bodyHtml=fileItemRefHtml(item,res.lang);
  } else {
    const criteria=(item.criteria||[]).map(x=>`<li>${esc(x)}</li>`).join('');
    bodyHtml=`<div class="qline"><span class="qtext" style="flex:1;">${esc(bilingualText(item.q,res.lang))}</span><button class="copybtn" id="copyQ"><svg class="icon"><use href="#ic-copy"/></svg> نسخ</button></div>
      ${criteria?`<div class="criteria-box" style="margin-top:12px;"><span class="lbl">عناصر الإجابة الصحيحة (مرجع)</span><ul>${criteria}</ul></div>`:''}`;
  }
  /* لا مفتاح لغة في اختبار الملف: لغة سؤاله لغة ملفه، ونصه نصٌّ واحد لا {ar,en} */
  const hasEn=item.kind==='fileupload'?false:(item.kind==='conversation'?(item.messages||[]).some(m=>bilingualHas(m.q,'en')):bilingualHas(item.q,'en'));
  const langToggle=hasEn?`<div class="optpills" style="margin-bottom:8px;"><button class="optpill ${res.lang==='ar'?'on':''}" data-qlang="ar">عربي</button><button class="optpill ${res.lang==='en'?'on':''}" data-qlang="en">English</button></div>`:'';
  const ratingHtml=`<div class="optpills">${[1,2,3,4,5].map(n=>`<button class="optpill ${res.rating===n?'on':''}" data-rate="${n}">${n}</button>`).join('')}</div>`;
  const kindLabel=item.kind==='conversation'?'سياق محادثة':(item.kind==='fileupload'?'اختبار رفع الملفات':'سؤال');

  screen.innerHTML=`<div class="card">
    <div class="progress-meta"><span>${esc(kindLabel)}</span><span>السؤال ${i+1} من ${total}</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${(i/total)*100}%"></div></div>
    <div class="section-h">${item.kind==='conversation'?'سياق المحادثة':item.kind==='fileupload'?'الملف وسؤاله':'السؤال (يُنسخ تلقائيًا)'}</div>
    ${langToggle}
    ${bodyHtml}
    <div class="section-h">التقييم</div>
    <label style="font-size:13px;color:var(--muted);display:block;margin-bottom:8px;">قيّم إجابة المنتج من 1 (ضعيف) إلى 5 (ممتاز)</label>
    ${ratingHtml}
    <div class="notes-block show" style="margin-top:14px;">
      <label>ملاحظة</label>
      <textarea class="notes" id="note" placeholder="أي ملاحظة على الإجابة (اختياري)">${esc(res.note)}</textarea>
      <label style="margin-top:12px;">معرّف السؤال — إلزامي</label>
      <input class="notes" id="qid" placeholder="رقم أو رابط المحادثة في المنصة" value="${esc(res.questionId||'')}">
      <label style="margin-top:12px;">نص الإجابة — إلزامي</label>
      <textarea class="notes" id="answerText" placeholder="الصق نص إجابة المنتج هنا">${esc(res.answerText)}</textarea>
    </div>
    <div class="warnmsg" id="w"></div>
    <div class="nav-btns">
      <div class="row"><button class="btn btn-ghost" id="prev">→ السابق</button><button class="btn btn-ghost" id="draft"><svg class="icon"><use href="#ic-save"/></svg> حفظ كمسودة</button></div>
      <button class="btn btn-primary" id="next">${i===total-1?'إنهاء ومراجعة':'التالي ←'}</button>
    </div>
  </div>`;

  if(item.kind==='conversation'){
    screen.querySelectorAll('[data-copymsg]').forEach(b=>b.onclick=e=>{e.stopPropagation();copyText(bilingualText(item.messages[+b.dataset.copymsg].q,res.lang));});
    const ca=document.getElementById('copyAll');if(ca)ca.onclick=()=>copyText((item.messages||[]).map(m=>bilingualText(m.q,res.lang)).join('\n\n'),'تم نسخ المحادثة');
  } else if(item.kind==='fileupload'){
    document.getElementById('copyQ').onclick=()=>copyText(bilingualText(item.q,res.lang));
    const cf=document.getElementById('copyFu');if(cf)cf.onclick=()=>copyText(item.followUpQ,'تم نسخ السؤال التابع');
  } else {
    document.getElementById('copyQ').onclick=()=>copyText(bilingualText(item.q,res.lang));
  }
  screen.querySelectorAll('[data-qlang]').forEach(b=>b.onclick=()=>{res.lang=b.dataset.qlang;qualityTest();});
  screen.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{res.rating=+b.dataset.rate;qualityTest();});
  document.getElementById('note').oninput=e=>res.note=e.target.value;
  document.getElementById('qid').oninput=e=>res.questionId=e.target.value;
  document.getElementById('answerText').oninput=e=>res.answerText=e.target.value;
  document.getElementById('draft').onclick=qualitySaveDraft;
  document.getElementById('prev').onclick=()=>{if(i===0){app.sub=app.ctx.qDraftIndex!=null?null:'qIntro';}else{r.step--;}render();window.scrollTo(0,0);};
  document.getElementById('next').onclick=()=>{
    const w=document.getElementById('w');
    if(!res.rating){w.textContent='حدّد تقييمًا من 1 إلى 5.';w.classList.add('show');return;}
    if(!(res.questionId||'').trim()){w.textContent='معرّف السؤال إلزامي.';w.classList.add('show');document.getElementById('qid').focus();return;}
    if(!(res.answerText||'').trim()){w.textContent='نص الإجابة إلزامي.';w.classList.add('show');document.getElementById('answerText').focus();return;}
    if(i===total-1){app.sub='qReview';}else{r.step++;}render();window.scrollTo(0,0);
  };
}
function qualityResultRows(run){
  let rows='';
  run.tests.forEach((item,i)=>{
    const r=run.results[i];
    const qDisplay=item.kind==='conversation'?(item.title||'محادثة '+(i+1))+': '+(item.messages||[]).map(m=>bilingualText(m.q,r.lang)).join(' ← '):bilingualText(item.q,r.lang);
    rows+=`<div class="rrow"><div class="rhead"><b style="color:var(--ink-2);">سؤال ${i+1}</b><span class="badge ${r.rating>=4?'pass':r.rating>=3?'draft':'fail'}">تقييم ${r.rating||'—'}/5</span></div>
    ${item.kind==='fileupload'&&item.fileName?`<div class="meta"><b>الملف:</b> ${esc(item.fileName)}</div>`:''}
    <div class="qq" dir="auto"><b>السؤال:</b> ${esc(qDisplay)}</div>
    ${item.kind==='fileupload'&&(item.followUpQ||'').trim()?`<div class="qq" dir="auto"><b>السؤال التابع:</b> ${esc(item.followUpQ)}</div>`:''}
    ${r.note?`<div class="meta"><b>الملاحظة:</b> ${esc(r.note)}</div>`:''}
    <div class="rnotes"><b>معرّف السؤال:</b> ${esc(r.questionId||'—')}<br><b>نص الإجابة:</b> ${esc(r.answerText||'—')}</div></div>`;
  });
  return rows;
}
function buildQualitySummaryText(run){
  const avg=run.avgRating!=null?run.avgRating:(run.results.reduce((s,r)=>s+(r.rating||0),0)/run.results.length).toFixed(1);
  let L=['📋 تقرير اختبار الجودة — منصة مِعيار',`${SETTINGS.team} — ${SETTINGS.product}`,'———————————————',`الموظف: ${run.employee}`,`التاريخ: ${run.date}`];
  if(run.model)L.push(`المودل: ${run.model}`);
  if(run.reason)L.push(`سبب الاختبار: ${run.reason}`);
  L.push(`متوسط التقييم: ${avg}/5  (${run.tests.length} سؤال)`,'———————————————');
  run.tests.forEach((item,i)=>{
    const r=run.results[i];
    const qDisplay=item.kind==='conversation'?(item.title||'محادثة '+(i+1)):bilingualText(item.q,r.lang);
    L.push('',`${i+1}. ${item.kind==='fileupload'&&item.fileName?'['+item.fileName+'] ':''}${qDisplay}`);
    if(item.kind==='fileupload'&&(item.followUpQ||'').trim())L.push(`   ↳ سؤال تابع: ${item.followUpQ}`);
    L.push(`   التقييم: ${r.rating||'—'}/5`);
    if(r.note)L.push(`   الملاحظة: ${r.note}`);
    L.push(`   معرّف السؤال: ${r.questionId||'—'}`,`   نص الإجابة: ${r.answerText||'—'}`);
  });
  return L.join('\n');
}

  document.getElementById('copySum').onclick=()=>{const s=persist();copyText(buildQualitySummaryText(s));toast('تم نسخ ملخّص الاختبار');};
  document.getElementById('share').onclick=async()=>{const s=persist();await shareQualityRun(s);setTimeout(()=>{app.sub=null;app.ctx={};render();window.scrollTo(0,0);},600);};

/* ============================================================
   V2 — طبقة الربط بالذكاء الاصطناعي
   ------------------------------------------------------------
   كل الاتصال بالذكاء الاصطناعي يمرّ من هنا وفقط من هنا. لتفعيل الربط
   الحقيقي لا يلزم تعديل أي شاشة — يكفي أن يوصّل مهندس الذكاء الاصطناعي
   الدالتين aiAskLive و aiJudgeLive أدناه، ثم يُبدَّل الوضع من الإعدادات.

   ⚠ ملاحظة أمنية: هذا الملف يعمل داخل المتصفح، فأي مفتاح API يوضع فيه
   سيكون مكشوفًا لكل من يفتح الصفحة. لذلك الحقلان askEndpoint و judgeEndpoint
   يجب أن يشيرا إلى وسيط من طرف الخادم (Supabase Edge Function مثلًا) يحتفظ
   بالمفتاح عنده. لا تضع المفتاح هنا إطلاقًا.

   عقد الطلب/الرد المتوقَّع من الوسيط:

   POST askEndpoint
     { model, lang:'ar'|'en', searchMode:'normal'|'detailed', turns:[{q}], fileLink }
     → { answers:[string,...], conversationId, conversationUrl }
       (answers مرتّبة بترتيب turns، وطول المصفوفتين متساوٍ)
       searchMode هو نمط البحث في المنصة المُختبَرة: عادي أو تفصيلي. يُحدَّد لكل
       جلسة اختبار، ويصل هنا دائمًا كنمط واحد — «الوضعان» في اختبار الدخان
       يُترجَم إلى استدعاءين منفصلين، لا إلى قيمة ثالثة.

   POST judgeEndpoint
     { mode:'criteria'|'binary', lang, question, answer, criteria:[string,...] }
     → mode==='criteria': { criteria:[{met:boolean, note:string},...], summary }
       mode==='binary':   { pass:boolean, summary }
   ============================================================ */

function aiLiveAsk(){return AI_CONFIG.mode==='live'&&!!(AI_CONFIG.askEndpoint||'').trim();}
function aiLiveJudge(){return AI_CONFIG.mode==='live'&&!!(AI_CONFIG.judgeEndpoint||'').trim();}
/* الوضع الفعلي لا يساوي الوضع المختار دائمًا: اختيار «ربط حقيقي» دون كتابة روابط
   الوسيط يعني أن الاستدعاء سيقع على المحاكاة. نُظهر ذلك بدل ادّعاء ربط غير قائم. */
function aiEffectiveMode(){
  if(AI_CONFIG.mode!=='live')return 'mock';
  if(aiLiveAsk()&&aiLiveJudge())return 'live';
  if(aiLiveAsk()||aiLiveJudge())return 'partial';
  return 'mock';
}
function aiModeLabel(m){
  m=m||aiEffectiveMode();
  return m==='live'?'ربط حقيقي':m==='partial'?'ربط جزئي':'وضع المحاكاة';
}
function aiModeNoteHtml(){
  const m=aiEffectiveMode();
  if(m==='live')return '';
  if(m==='partial')return `<div class="warnmsg show"><b>الربط غير مكتمل.</b> ${aiLiveAsk()?'رابط المقيّم غير مضبوط، فالتقييم سيأتي من المحاكاة.':'رابط النموذج المُختبَر غير مضبوط، فالإجابات ستأتي من المحاكاة.'} اضبطه من الإعدادات ← الربط بالذكاء الاصطناعي.</div>`;
  return `<div class="tip"><span class="ic"><svg class="icon"><use href="#ic-lamp"/></svg></span><div><b>وضع المحاكاة مفعّل.</b> الإجابات والتقييمات تجريبية إلى أن يوصّل مهندس الذكاء الاصطناعي ربط منصة قانونية. الواجهة وسير العمل نهائيان — لن يتغيّر منهما شيء عند الربط.</div></div>`;
}

async function aiPost(url,body){
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!res.ok)throw new Error('استجابة غير ناجحة من الوسيط ('+res.status+')');
  return res.json();
}

/* --- الربط الحقيقي (يوصّله مهندس الذكاء الاصطناعي) --- */
async function aiAskLive(req){
  const d=await aiPost(AI_CONFIG.askEndpoint.trim(),{model:req.model,lang:req.lang,searchMode:req.searchMode||'normal',turns:req.turns.map(x=>({q:x.q})),fileLink:req.fileLink||''});
  const answers=Array.isArray(d.answers)?d.answers:[String(d.answer||'')];
  return {answers,conversationId:d.conversationId||'',conversationUrl:d.conversationUrl||''};
}
async function aiJudgeLive(req){
  const d=await aiPost(AI_CONFIG.judgeEndpoint.trim(),{mode:req.mode,lang:req.lang,question:req.question,answer:req.answer,criteria:req.criteria});
  if(req.mode==='binary')return {pass:!!d.pass,summary:d.summary||''};
  const crit=(d.criteria||[]).map((c,i)=>({text:req.criteria[i]||'',met:!!c.met,note:c.note||''}));
  return {criteria:crit,summary:d.summary||''};
}

/* --- وضع المحاكاة --- */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

const MOCK_AR=[

  'الجهة المختصة بهذا الإجراء ليست الجهة المذكورة في السؤال، وإنما جهة أخرى بحسب توزيع الاختصاصات النظامي. ويُفرَّق هنا بين الاختصاص بالعلاقة محل النزاع والاختصاص بالإجراء التنفيذي المترتب عليها.\n\nولذلك فإن ما تضمّنه السؤال من افتراض يحتاج إلى تصحيح قبل الإجابة عليه.',
  'أفيدكم بأن النظام المشار إليه قد صدر ونُشر في الجريدة الرسمية، ثم عُمل به بعد مضي المدة المحددة في مادته الختامية. وقد ألغى بموجب ذلك كل ما يتعارض معه من أحكام سابقة.\n\nأما ما يتعلق بأثره على الوقائع السابقة على نفاذه، فالأصل عدم رجعية الأنظمة ما لم يرد نص خاص بخلاف ذلك.',

];
const MOCK_EN=[
  'Based on the applicable statutory provisions, the ruling here turns on distinguishing the case in question from cases that may resemble it. The relevant article sets out the general rule and then provides a narrow exception, conditioned on a statutory cause and on the absence of any agreement to the contrary.\n\nIn short: the rule applies to the case at hand, subject to the parties\' right to agree otherwise unless a mandatory provision prohibits it.',
  'The competent authority for this procedure is not the one named in the question, but another body under the statutory allocation of jurisdiction. A distinction must be drawn between jurisdiction over the underlying relationship and jurisdiction over the enforcement procedure arising from it.\n\nThe premise in the question therefore needs to be corrected before it can be answered.',
  'The law referred to was issued and published in the Official Gazette, and came into force after the period specified in its concluding article had elapsed. It thereby repealed any prior provisions inconsistent with it.\n\nAs for its effect on events predating its entry into force, the default rule is that laws do not operate retroactively absent an express provision to the contrary.',
  'I could not find a statutory provision establishing what the question states in these absolute terms. What the relevant laws provide differs from this, and a ruling should not be built on an unsupported premise.\n\nI can provide you with the correct text and the article it appears in if you wish.',
];

async function aiAskMock(req){
  await wait(420+Math.random()*680);
  const answers=req.turns.map((turn,ti)=>{
    const pool=req.lang==='en'?MOCK_EN:MOCK_AR;
    const mode=req.searchMode||'normal';
    const h=hashStr((req.model||'')+'|'+mode+'|'+turn.q+'|'+ti);
    let body=pool[h%pool.length];
    if(ti>0)body=(req.lang==='en'?'Following on from the previous answer: ':'وبناءً على ما سبق في هذه المحادثة: ')+body;
    if(req.fileLink)body=(req.lang==='en'?'[Attached file read] ':'[تمت قراءة الملف المرفق] ')+body;
    if(mode==='detailed')body=(req.lang==='en'?'[Detailed search] ':'[بحث تفصيلي] ')+body;
    return body;
  });
  const cid='mock-'+hashStr(req.model+req.turns.map(x=>x.q).join('|')).toString(36);
  return {answers,conversationId:cid,conversationUrl:''};
}
async function aiJudgeMock(req){
  await wait(300+Math.random()*450);
  /* المحاكاة تربط النتيجة باسم النموذج ونص الإجابة ونص المعيار، فتبقى ثابتة لنفس
     المدخلات وتختلف بين النماذج وبين نمطَي البحث — حتى تكون شاشات المقارنة
     ونتائج «الوضعان» ذات معنى أثناء التجربة. */
  const seed=s=>hashStr((req.model||'')+'::'+hashStr(req.answer||'')+'::'+s)%100;
  if(req.mode==='binary'){
    const pass=seed(req.question)>26;
    return {pass,summary:pass?'الإجابة سليمة ولا تتضمّن خطأً ظاهرًا.':'الإجابة تتضمّن خللًا يستدعي المراجعة.'};
  }
  const criteria=req.criteria.map(c=>{
    const v=seed(c);
    return {text:c,met:v>32,note:v>32?'ورد في الإجابة ما يحقق هذا المعيار.':'لم تتضمّن الإجابة ما يحقق هذا المعيار.'};
  });
  const met=criteria.filter(c=>c.met).length;
  return {criteria,summary:`تحقّق ${met} من ${criteria.length} من عناصر الإجابة الصحيحة.`};
}

const AI={
  ask(req){return aiLiveAsk()?aiAskLive(req):aiAskMock(req);},
  judge(req){return aiLiveJudge()?aiJudgeLive(req):aiJudgeMock(req);},
};

function buildFileManualSummaryText(run){
  const avg=run.avgRating!=null?run.avgRating:(run.results.reduce((s,r)=>s+(r.rating||0),0)/run.results.length).toFixed(1);
  const L=['📋 تقرير اختبار رفع الملفات اليدوي — منصة مِعيار',`${SETTINGS.team} — ${SETTINGS.product}`,'———————————————',
    `الموظف: ${run.employee}`,`التاريخ: ${run.date}`,`نوع الملفات: ملفات ${FILE_LANG_LABEL[run.fileLang]||'عربي'}`];
  if(run.model)L.push(`المودل: ${run.model}`);
  if(run.reason)L.push(`سبب الاختبار: ${run.reason}`);
  L.push(`متوسط التقييم: ${avg}/5  (${run.tests.length} سؤال)`,'———————————————');
  run.tests.forEach((item,i)=>{
    const r=run.results[i];
    L.push('',`${i+1}. ${item.fileName?'['+item.fileName+'] ':''}${bilingualText(item.q,run.fileLang)}`);
    if((item.followUpQ||'').trim())L.push(`   ↳ سؤال تابع: ${item.followUpQ}`);
    L.push(`   التقييم: ${r.rating||'—'}/5`);
    if(r.note)L.push(`   الملاحظة: ${r.note}`);
    L.push(`   معرّف السؤال: ${r.questionId||'—'}`,`   نص الإجابة: ${r.answerText||'—'}`);
  });
  return L.join('\n');
}

function v2KindLabel(k){return (V2_KINDS[k]||{}).label||k;}
/* نمط البحث خصيصة للجلسة لا للسؤال: أسئلة البنك لا تحمل نمطًا، وإنما يُحدَّد قبل
   بدء الاختبار فيُطبَّق على الجلسة كاملة. اختبار الجودة يقتصر على نمط واحد حتى
   تبقى نسبته قابلة للمقارنة بين الجلسات، والدخان يسمح بالوضعين معًا لأن حكمه
   نجح/لم ينجح لكل بند على حِدة فلا يختلط شيء. */
const SEARCH_MODES={normal:'بحث عادي',detailed:'بحث تفصيلي'};
const SEARCH_MODE_SHORT={normal:'عادي',detailed:'تفصيلي'};
function searchModeLabel(m){return m==='both'?'الوضعان (عادي + تفصيلي)':(SEARCH_MODES[m]||'بحث عادي');}
function searchModeShort(m){return SEARCH_MODE_SHORT[m]||'عادي';}
function v2DefaultSearchMode(kind){return kind==='smoke'?'both':'normal';}
function v2SearchModeOptions(kind){return kind==='smoke'?['both','normal','detailed']:['normal','detailed'];}
/* «الوضعان» = كل سؤال يُنفَّذ مرتين كبندين مستقلّين، فتُقرأ نتيجة كل نمط على حِدة
   بدل دمج النمطين في حكم واحد يخفي أيّهما فشل. */
function v2ExpandModes(items,searchMode){
  if(searchMode!=='both')return items.map(it=>Object.assign(it,{searchMode}));
  const out=[];
  items.forEach(it=>['normal','detailed'].forEach(m=>out.push(Object.assign(clone(it),{searchMode:m}))));
  return out;
}
/* الجلسات المحفوظة قبل إضافة نمط البحث لا تحمل الحقل، فتُقرأ على أنها «عادي» */
function runSearchMode(run){return run&&run.searchMode||'normal';}
function itemSearchMode(it){return it&&it.searchMode||'normal';}
/* في جلسة «الوضعان» عدد البنود ضِعف عدد الأسئلة، فلا يصح تسمية البنود «أسئلة» */
function v2UnitLabel(run){return runSearchMode(run)==='both'?'بند':'سؤال';}
/* جلسة الملفات لغتها لغة ملفاتها، فتُقرأ «ملفات إنجليزية» لا «English» وحدها */
function v2RunLangLabel(run){
  if(run&&run.kind==='files')return 'ملفات '+(FILE_LANG_LABEL[run.fileLang||run.lang]||'عربي');
  return run&&run.lang==='en'?'English':'عربي';
}
function v2RunEyebrow(run){
  return [v2KindLabel(run.kind),searchModeLabel(runSearchMode(run)),v2RunLangLabel(run)].concat(run.model?[run.model]:[]).join(' · ');
}
function critArray(c){if(!c)return [];return Array.isArray(c)?c.filter(x=>(x||'').trim()):[String(c)].filter(x=>x.trim());}

/* اختبار الملف الواحد يولّد بندًا لكل سؤال من أسئلته، لا بندًا واحدًا: الأسئلة على
   الملف مستقلة عن بعضها، أما السؤال التابع فيُضاف كدورٍ ثانٍ في نفس المحادثة
   ليصله سياق سابقه، ومعاييره تُضاف لمعايير سؤاله فيُقيَّمان معًا. */
function v2ItemsFromBankTest(win,ci,ti,lang){
  const w=QBANK[win],t=w.cats[ci].tests[ti];
  const mk=extra=>Object.assign({ref:{win,ci,ti},srcLabel:w.label,criteria:[],fileLink:'',status:'pending',error:'',
    turns:[],judge:null,review:{agree:null,reason:'',note:''}},extra);
  if(w.type==='fileupload'){
    const file=t.file||{};
    return fileTestQuestions(t).map((q,qi)=>{
      const fu=fileFollowUp(q);
      return mk({kind:'fileupload',ref:{win,ci,ti,qi},title:q.q||'',
        fileLink:file.url||'',fileName:file.name||'',fileMeta:fileMetaLine(file),
        docTitle:t.title||'',goal:t.goal||'',fileLang:winFileLang(w),
        criteria:critArray(q.criteria).concat(fu?critArray(fu.criteria):[]),
        turns:[{q:q.q||'',answer:null}].concat(fu?[{q:fu.q,answer:null}]:[])});
    });
  }
  if(w.type==='conversation'){
    return [mk({kind:'conversation',title:t.title||'محادثة',criteria:critArray(t.criteria),
      turns:(t.messages||[]).map(m=>({q:bilingualText(m.q,lang),answer:null}))})];
  }
  return [mk({kind:'single',title:bilingualText(t.q,lang),criteria:critArray(t.criteria),
    turns:[{q:bilingualText(t.q,lang),answer:null}]})];
}
/* fileRefs (اختياري) يقصر السحب على ملفات بعينها بمفتاح "win|ci|ti" */
function v2BankPool(wins,lang,onlyScorable,fileRefs){
  const out=[];
  (wins.length?wins:textWinKeys()).forEach(win=>{
    const w=QBANK[win];if(!w)return;
    w.cats.forEach((c,ci)=>c.tests.forEach((t,ti)=>{
      if(fileRefs&&fileRefs.length&&isFileWin(w)&&fileRefs.indexOf(win+'|'+ci+'|'+ti)<0)return;
      out.push(...v2ItemsFromBankTest(win,ci,ti,lang));
    }));
  });
  return out.filter(it=>it.turns.length&&it.turns.every(x=>(x.q||'').trim())&&(!onlyScorable||it.criteria.length));
}
/* ملفات قسمٍ ما مع عدد أسئلتها — قائمة اختيار الملفات في شاشة إنشاء الاختبار */
function v2FileOptions(win){
  const w=QBANK[win];if(!isFileWin(w))return [];
  const out=[];
  w.cats.forEach((c,ci)=>c.tests.forEach((t,ti)=>{
    const qs=fileTestQuestions(t).filter(q=>(q.q||'').trim());
    out.push({key:win+'|'+ci+'|'+ti,title:t.title||((t.file||{}).name)||'ملف بلا عنوان',
      meta:fileMetaLine(t.file),n:qs.length,scorable:qs.filter(q=>critArray(q.criteria).length||(fileFollowUp(q)&&critArray(fileFollowUp(q).criteria).length)).length});
  }));
  return out;
}
/* عدد الأسئلة القابلة للتقييم بالمعايير في كل قسم — أسئلة بلا معايير لا يمكن
   إعطاؤها نسبة في اختبار الجودة، فنبيّن ذلك للمستخدم قبل البدء. */
function v2WinOptions(lang){
  return bankWinEntries().filter(([k,w])=>!isFileWin(w)).map(([k,w,n])=>{
    let scorable=0;
    w.cats.forEach(c=>c.tests.forEach(t=>{if(critArray(t.criteria).length)scorable++;}));
    return {key:k,label:w.label,n,scorable};
  });
}

function v2Start(){
  app.ctx.v2={kind:'quality',lang:'ar',searchMode:v2DefaultSearchMode('quality'),model:'',wins:[],count:V2_KINDS.quality.defaultCount,onlyScorable:true,reason:'',fileLang:'ar',files:[]};
  app.sub='v2setup';render();window.scrollTo(0,0);
}
/* الجلسة تُبنى دائمًا من هذه الحقول المشتقّة، فلا تتسرّب حالة نوعٍ إلى نوع آخر:
   في اختبار الملفات القسم واللغة يأتيان من نوع الملفات المختار لا من خطوة اللغة. */
function v2EffWins(s){return isFilesKind(s.kind)?[fileWinForLang(s.fileLang)].filter(Boolean):s.wins;}
function v2EffLang(s){return isFilesKind(s.kind)?s.fileLang:s.lang;}
function v2EffFiles(s){return isFilesKind(s.kind)?s.files:[];}
/* اختبار الملفات لا يُرشَّح بوجود المعايير ولا يُعيَّن له عدد: أسئلة الملف تُطرح كلها،
   لأنها مكتوبة على ملفٍ بعينه فليست عيّنة من مجموعة كبيرة يُنتقى منها. */
function v2EffScorable(s){return s.kind==='quality'&&s.onlyScorable;}
function v2TakesAll(s){return isFilesKind(s.kind);}
function v2Pool(s){return v2BankPool(v2EffWins(s),v2EffLang(s),v2EffScorable(s),v2EffFiles(s));}

function v2Setup(){
  const s=app.ctx.v2;setCrumb('اختبار جديد');
  const isFiles=isFilesKind(s.kind);
  const wins=v2WinOptions();
  const scorableOn=v2EffScorable(s);
  const poolN=v2Pool(s).length;
  const eWins=v2EffWins(s),eLang=v2EffLang(s),eFiles=v2EffFiles(s);
  const noCrit=v2BankPool(eWins,eLang,false,eFiles).length-v2BankPool(eWins,eLang,true,eFiles).length;
  const kindCards=Object.entries(V2_KINDS).map(([k,v])=>`<button class="kindcard ${s.kind===k?'on':''}" data-kind="${k}">
    <div class="kc-t"><svg class="icon"><use href="#ic-${v.icon}"/></svg> ${esc(v.label)}</div>
    <div class="kc-d">${esc(v.desc)}</div></button>`).join('');
  const modePills=v2SearchModeOptions(s.kind).map(m=>`<button class="optpill ${s.searchMode===m?'on':''}" data-vsmode="${m}">${esc(searchModeLabel(m))}</button>`).join('');
  const modeNote=s.kind==='smoke'
    ?'«الوضعان» يسأل كل سؤال مرتين — مرة بالبحث العادي ومرة بالتفصيلي — وتُسجَّل نتيجة كل نمط على حِدة، فيتبيّن أيّهما تعطّل. اختر نمطًا واحدًا لفحص أسرع.'
    :isFiles
      ?'اختبار الملفات يُنفَّذ بنمط واحد حتى تبقى نسبته قابلة للمقارنة مع الجلسات الأخرى على نفس الملف.'
      :'اختبار الجودة يُنفَّذ بنمط واحد حتى تبقى نسبته قابلة للمقارنة مع الجلسات الأخرى. لمقارنة النمطين شغّل جلستين ثم افتح شاشة المقارنة من السجل.';
  const winsHtml=wins.map(o=>{
    const gap=o.n-o.scorable;
    return `<label class="qoption ${s.wins.includes(o.key)?'sel':''}" data-win="${esc(o.key)}"><input type="checkbox" ${s.wins.includes(o.key)?'checked':''}><span class="qtext">${esc(o.label)}${gap?`<span class="cn" style="display:block;font-size:11.5px;color:var(--muted);margin-top:3px;">${gap} من أسئلته بلا معايير إجابة</span>`:''}</span><span class="chip" style="flex:0 0 auto;">${o.n} سؤال</span></label>`;
  }).join('');

  /* ٣ · اللغة: في اختبار الملفات ليست لغة يختارها المستخدم، وإنما هي نوع الملفات
     نفسه — فاختيار «ملفات إنجليزية» يُثبّت لغة الجلسة على الإنجليزية تلقائيًا. */
  const fileLangPills=['ar','en'].map(L=>{
    const key=fileWinForLang(L),w=QBANK[key];
    const n=w?bankWinCount(w):0;
    return `<button class="optpill ${s.fileLang===L?'on':''}" data-vflang="${L}">${esc(w?w.label:FILE_LANG_LABEL[L])} <span class="badge-n" style="margin-inline-start:6px;">${n}</span></button>`;
  }).join('');
  const fileOpts=isFiles?v2FileOptions(fileWinForLang(s.fileLang)):[];
  const filesHtml=fileOpts.map(o=>{
    const gap=o.n-o.scorable;
    return `<label class="qoption ${s.files.includes(o.key)?'sel':''}" data-vfile="${esc(o.key)}"><input type="checkbox" ${s.files.includes(o.key)?'checked':''}><span class="qtext">${esc(o.title)}${o.meta?`<span class="cn" style="display:block;font-size:11.5px;color:var(--muted);margin-top:3px;">${esc(o.meta)}${gap?` · ${gap} من أسئلته بلا معايير إجابة`:''}</span>`:(gap?`<span class="cn" style="display:block;font-size:11.5px;color:var(--muted);margin-top:3px;">${gap} من أسئلته بلا معايير إجابة</span>`:'')}</span><span class="chip" style="flex:0 0 auto;">${o.n} سؤال</span></label>`;
  }).join('');

  const langSection=isFiles
    ?`<div class="section-h" style="margin-top:20px;">٣ · نوع الملفات</div>
      <div class="optpills">${fileLangPills}</div>
      <div class="muted-note" style="margin-top:8px;" data-edit-key="v2.setup.filelang.note">${esc(t('v2.setup.filelang.note','لغة الجلسة تتبع نوع الملفات: ملفات عربية تُسأل بالعربية وملفات إنجليزية تُسأل بالإنجليزية، فلا يُسأل ملفٌ بلغةٍ غير لغته.'))}</div>`
    :`<div class="section-h" style="margin-top:20px;">٣ · لغة الاختبار</div>
      <div class="optpills"><button class="optpill ${s.lang==='ar'?'on':''}" data-vlang="ar">عربي</button><button class="optpill ${s.lang==='en'?'on':''}" data-vlang="en">English</button></div>`;

  const poolSection=isFiles
    ?`<div class="section-h" style="margin-top:20px;">٥ · الملفات</div>
      <p class="muted-note" style="margin:0 0 10px;" data-edit-key="v2.setup.files.note">${esc(t('v2.setup.files.note','اترك الملفات دون تحديد لاختبار كل ملفات هذا النوع. كل سؤال من أسئلة الملف يُنفَّذ في محادثة مستقلة على نفس الملف، وسؤاله التابع يُطرح داخل نفس المحادثة.'))}</p>
      ${filesHtml||'<div class="muted-note">لا توجد ملفات في هذا النوع بعد. أضِفها من الإعدادات ← بنك الأسئلة.</div>'}`
    :`<div class="section-h" style="margin-top:20px;">٥ · الأسئلة</div>
      <p class="muted-note" style="margin:0 0 10px;">اترك الأقسام دون تحديد لسحب الأسئلة من بنك الأسئلة كاملًا.</p>
      ${winsHtml||'<div class="muted-note">لا توجد أسئلة في بنك الأسئلة بعد.</div>'}`;

  screen.innerHTML=`<div class="card">
    <div class="eyebrow" data-edit-key="v2.setup.eyebrow">${esc(t('v2.setup.eyebrow','قبل البدء'))}</div>
    <h1 class="h1" data-edit-key="v2.setup.title">${esc(t('v2.setup.title','بدء اختبار جديد'))}</h1>
    <p class="sub" data-edit-key="v2.setup.sub">${esc(t('v2.setup.sub','حدّد نوع الاختبار ولغته والنموذج المُختبَر، ثم اضغط بدء. سينشئ البرنامج محادثة لكل سؤال، ويقيّم الإجابات آليًا، ثم يعرضها عليك للمراجعة.'))}</p>
    ${aiModeNoteHtml()}

    <div class="section-h">١ · نوع الاختبار</div>
    <div class="kindgrid">${kindCards}</div>

    <div class="section-h" style="margin-top:20px;">٢ · نمط البحث</div>
    <div class="optpills">${modePills}</div>
    <div class="muted-note" style="margin-top:8px;">${esc(modeNote)}</div>

    ${langSection}

    <div class="section-h" style="margin-top:20px;">٤ · النموذج المُختبَر</div>
    <div class="field"><select id="v_model" ${MODELS.length?'':'disabled'}>
      <option value="">${MODELS.length?'اختر النموذج':'لا توجد نماذج مضافة بعد'}</option>
      ${MODELS.map(m=>`<option value="${esc(m.name)}" ${s.model===m.name?'selected':''}>${esc(m.name)}</option>`).join('')}
    </select>${MODELS.length?'':'<div class="muted-note" style="margin-top:6px;">أضِف نماذج من الإعدادات ← عام قبل بدء الاختبار.</div>'}</div>

    ${poolSection}
    ${s.kind==='quality'?`<label class="qoption ${s.onlyScorable?'sel':''}" data-onlyscorable style="margin-top:10px;"><input type="checkbox" ${s.onlyScorable?'checked':''}><span class="qtext">اقتصر على الأسئلة التي لها معايير إجابة صحيحة${noCrit?`<span class="cn" style="display:block;font-size:11.5px;color:var(--muted);margin-top:3px;">${noCrit} سؤال في اختيارك الحالي بلا معايير — لا يمكن إعطاؤه نسبة.</span>`:''}</span></label>`:''}
    ${v2TakesAll(s)
      ?`<div class="tip" style="margin-top:14px;"><span class="ic"><svg class="icon"><use href="#ic-lamp"/></svg></span><div>ستُطرح <b>كل أسئلة الملفات المختارة</b> — ${poolN} سؤال. لتقليل العدد اختر ملفات أقل من الأعلى.</div></div>`
      :`<div class="field" style="margin-top:14px;"><label>عدد الأسئلة (المتاح الآن: ${poolN})</label><input id="v_count" type="number" min="1" max="${Math.max(poolN,1)}" value="${Math.min(s.count,Math.max(poolN,1))}"></div>`}
    ${s.searchMode==='both'?`<div class="muted-note" style="margin-top:-6px;margin-bottom:12px;">${Math.min(s.count,Math.max(poolN,1))} سؤال × نمطَي بحث = ${Math.min(s.count,Math.max(poolN,1))*2} محادثة.</div>`:''}
    ${poolN?'':`<div class="warnmsg show">${isFiles?'لا توجد أسئلة في ملفات هذا الاختيار.':'لا توجد أسئلة مطابقة لهذا الاختيار.'}</div>`}

    <div class="section-h" style="margin-top:20px;">٦ · معلومات إضافية (اختيارية)</div>
    <div class="field"><label>سبب الاختبار</label><textarea id="v_reason" placeholder="مثال: التحقق بعد تحديث نموذج الاسترجاع">${esc(s.reason)}</textarea></div>

    <div class="warnmsg" id="w"></div>
    <div class="nav-btns"><button class="btn btn-ghost" id="cancel">إلغاء</button><button class="btn btn-primary" id="start"><svg class="icon"><use href="#ic-search"/></svg> بدء الاختبار ←</button></div>
  </div>`;
  /* حقل العدد غائب في اختبار الملفات (يُطرح كل شيء)، فلا يُقرأ إلا إن وُجد */
  const sync=()=>{s.model=document.getElementById('v_model').value;const c=document.getElementById('v_count');if(c)s.count=Math.max(1,+c.value||1);s.reason=document.getElementById('v_reason').value.trim();};
  screen.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{sync();const prev=s.kind;s.kind=b.dataset.kind;if(s.count===V2_KINDS[prev].defaultCount)s.count=V2_KINDS[s.kind].defaultCount;
    /* نمط النوع السابق إن كان هو افتراضيه يُستبدل بافتراضي النوع الجديد، وإلا نحترم
       اختيار المستخدم — عدا «الوضعان» فهو غير متاح في الجودة. */
    if(s.searchMode===v2DefaultSearchMode(prev))s.searchMode=v2DefaultSearchMode(s.kind);
    else if(!v2SearchModeOptions(s.kind).includes(s.searchMode))s.searchMode=v2DefaultSearchMode(s.kind);
    /* لا يُفتح اختبار الملفات على نوعٍ فارغ إن كان النوع الآخر فيه ملفات — المستخدم
       يرى قائمة خاوية فيحسب أنه لا توجد ملفات أصلًا. */
    if(isFilesKind(s.kind)){
      const cur=fileWinForLang(s.fileLang);
      if(!bankWinCount(QBANK[cur])){
        const other=s.fileLang==='ar'?'en':'ar';
        if(bankWinCount(QBANK[fileWinForLang(other)])){s.fileLang=other;s.files=[];}
      }
    }
    v2Setup();});
  screen.querySelectorAll('[data-vsmode]').forEach(b=>b.onclick=()=>{sync();s.searchMode=b.dataset.vsmode;v2Setup();});
  screen.querySelectorAll('[data-vlang]').forEach(b=>b.onclick=()=>{sync();s.lang=b.dataset.vlang;v2Setup();});
  /* تغيير نوع الملفات يُلغي اختيار الملفات: مفاتيحها تحمل اسم قسمها فلا تصلح لقسم آخر */
  screen.querySelectorAll('[data-vflang]').forEach(b=>b.onclick=()=>{sync();s.fileLang=b.dataset.vflang;s.files=[];v2Setup();});
  screen.querySelectorAll('[data-win]').forEach(el=>el.querySelector('input').onchange=()=>{sync();const k=el.dataset.win,i=s.wins.indexOf(k);if(i>-1)s.wins.splice(i,1);else s.wins.push(k);v2Setup();});
  screen.querySelectorAll('[data-vfile]').forEach(el=>el.querySelector('input').onchange=()=>{sync();const k=el.dataset.vfile,i=s.files.indexOf(k);if(i>-1)s.files.splice(i,1);else s.files.push(k);v2Setup();});
  const os=screen.querySelector('[data-onlyscorable] input');if(os)os.onchange=()=>{sync();s.onlyScorable=!s.onlyScorable;v2Setup();};
  document.getElementById('cancel').onclick=()=>{app.sub=null;app.ctx.v2=null;render();};
  document.getElementById('start').onclick=()=>{
    sync();
    const w=document.getElementById('w');
    if(MODELS.length&&!s.model){w.textContent='اختر النموذج المُختبَر أولًا.';w.classList.add('show');return;}
    const pool=v2Pool(s);
    if(!pool.length){w.textContent=isFiles?'لا توجد أسئلة في ملفات هذا الاختيار.':'لا توجد أسئلة مطابقة لهذا الاختيار.';w.classList.add('show');return;}
    /* اختبار الملفات يأخذ المجموعة كلها بترتيبها كما في البنك — لا عيّنة عشوائية،
       فالأسئلة على ملفٍ واحد يُقرأ تسلسلها في التقرير. */
    const take=v2TakesAll(s)?pool.length:Math.min(s.count,pool.length);
    const picked=v2TakesAll(s)?pool:sample(pool,take);
    app.ctx.v2run={
      id:'v2'+Date.now()+Math.random().toString(36).slice(2,7),

/* --- تشغيل الاختبار: إنشاء المحادثات ثم التقييم --- */
function v2Running(){
  const run=app.ctx.v2run;setCrumb('جارٍ التنفيذ');
  v2PaintProgress();
  if(!app.ctx.v2started){app.ctx.v2started=true;v2Execute(run);}
}
function v2PaintProgress(){
  const run=app.ctx.v2run;
  const done=run.items.filter(i=>i.status==='judged'||i.status==='error').length;
  const pct=Math.round(done/run.items.length*100);
  const rows=run.items.map((it,i)=>{
    const cls=it.status==='judged'?'done':it.status==='error'?'error':(it.status==='running'||it.status==='judging')?'running':'';
    const st={pending:'بالانتظار',running:'جارٍ سؤال النموذج',judging:'جارٍ التقييم',judged:'تم',error:'تعذّر'}[it.status]||'';
    const modeTag=runSearchMode(run)==='both'?`<span class="chip" style="flex:0 0 auto;margin-inline-end:8px;">${esc(searchModeShort(itemSearchMode(it)))}</span>`:'';
    const fileTag=it.kind==='fileupload'&&it.fileName?`<span class="chip" style="flex:0 0 auto;margin-inline-end:8px;">${esc(it.fileName)}</span>`:'';
    return `<div class="runprog ${cls}"><span class="rp-n">${it.status==='judged'?'<svg class="icon"><use href="#ic-tick"/></svg>':i+1}</span><span class="rp-t">${modeTag}${fileTag}<span dir="auto">${esc(it.title)}</span></span><span class="rp-s">${esc(st)}</span></div>`;
  }).join('');
  screen.innerHTML=`<div class="card">
    <div class="eyebrow">${esc(v2RunEyebrow(run))}</div>
    <h1 class="h1">جارٍ تنفيذ الاختبار</h1>
    <p class="sub">${run.kind==='files'?'يرفع البرنامج الملف مع كل سؤال من أسئلته في محادثة مستقلة، ثم يقيّم الإجابة حسب عناصر الإجابة الصحيحة. لا تغلق الصفحة.':'يُنشئ البرنامج محادثة لكل سؤال ويرسلها للنموذج المُختبَر، ثم يقيّم كل إجابة حسب عناصر الإجابة الصحيحة. لا تغلق الصفحة.'}</p>
    ${run.aiMode!=='live'?`<div class="tip"><span class="ic"><svg class="icon"><use href="#ic-lamp"/></svg></span><div>${esc(aiModeLabel(run.aiMode))} — بعض النتائج أو كلها تجريبية.</div></div>`:''}
    <div class="progbar"><span style="width:${pct}%"></span></div>
    <div class="muted-note" style="margin-top:8px;">${done} من ${run.items.length} · ${pct}%</div>
    ${rows}
  </div>`;
  buildToc();
}
async function v2Execute(run){
  const judgeMode=V2_KINDS[run.kind].judge;
  const queue=run.items.map((it,i)=>i);
  const workers=Math.max(1,Math.min(+AI_CONFIG.concurrency||3,6));
  async function worker(){
    while(queue.length){
      const i=queue.shift();
      const it=run.items[i];
      try{
        it.status='running';if(app.sub==='v2running')v2PaintProgress();
        const r=await AI.ask({model:run.model,lang:run.lang,searchMode:itemSearchMode(it),turns:it.turns,fileLink:fileAbsUrl(it.fileLink)});
        it.turns.forEach((turn,ti)=>{turn.answer=r.answers[ti]!=null?r.answers[ti]:'';});
        it.conversationId=r.conversationId||'';it.conversationUrl=r.conversationUrl||'';
        it.status='judging';if(app.sub==='v2running')v2PaintProgress();
        const question=it.turns.map((x,n)=>it.turns.length>1?`(${n+1}) ${x.q}`:x.q).join('\n');
        const answer=it.turns.map((x,n)=>it.turns.length>1?`(${n+1}) ${x.answer}`:x.answer).join('\n\n');
        const j=await AI.judge({mode:judgeMode,lang:run.lang,question,answer,criteria:it.criteria,model:run.model});
        it.judge=judgeMode==='binary'
          ?{mode:'binary',pass:!!j.pass,summary:j.summary||'',criteria:[]}
          :{mode:'criteria',criteria:j.criteria||[],summary:j.summary||''};
        it.status='judged';
      }catch(e){
        it.status='error';it.error=e&&e.message?e.message:'خطأ غير معروف';
      }
      if(app.sub==='v2running')v2PaintProgress();
    }
  }
  await Promise.all(Array.from({length:workers},worker));
  run.score=v2RunScore(run);
  if(app.sub==='v2running'){app.sub='v2review';render();window.scrollTo(0,0);}
}

/* --- احتساب الدرجات: معيار بمعيار ثم المجموع --- */
function v2ItemScore(it){
  if(!it.judge)return null;
  if(it.judge.mode==='binary')return it.judge.pass?1:0;
  const c=it.judge.criteria||[];
  if(!c.length)return null;
  return c.filter(x=>x.met).length/c.length;
}
function v2RunScore(run){
  const vals=run.items.map(v2ItemScore).filter(v=>v!=null);
  if(!vals.length)return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*1000)/10;
}
function scoreClass(pct){return pct>=80?'pass':pct>=50?'mid':'fail';}
function scoreColor(pct){return pct>=80?'var(--pass)':pct>=50?'#d99100':'var(--fail)';}
/* اختبار الدخان حكمه نجح/لم ينجح، فلا يُعرض كنسبة مئوية حتى لا يُقرأ خطأً */
function v2ScoreCellHtml(it){
  const s=v2ItemScore(it);
  if(s==null)return '<span class="muted-note">بلا معايير</span>';
  if(it.judge&&it.judge.mode==='binary')return `<span class="badge ${it.judge.pass?'pass':'fail'}">${it.judge.pass?'نجح':'لم ينجح'}</span>`;
  const p=Math.round(s*100);
  return `<b style="color:${scoreColor(p)}">${p}%</b><div class="mini-bar"><span style="width:${p}%;background:${scoreColor(p)}"></span></div>`;
}

    ?`<div class="scorebig fail"><div class="sv">!</div><div class="sl">تعذّر</div></div>`

      :`<div class="scorebig ${pctN==null?'':scoreClass(pctN)}"><div class="sv">${pctN==null?'—':pctN+'%'}</div><div class="sl">الدرجة</div></div>`);

  /* في اختبار الملف الدور الثاني سؤالٌ تابع لا سؤال مستقل، فتسميته بالرقم تُوهم

  }else if(it.judge&&!it.criteria.length){
    judgeHtml=`<div class="tip" style="margin-top:13px;"><span class="ic"><svg class="icon"><use href="#ic-lamp"/></svg></span><div>لا توجد معايير إجابة صحيحة لهذا السؤال في بنك الأسئلة، فلا يمكن إعطاؤه نسبة وهو غير محتسب في نتيجة الاختبار. أضِف معاييره من الإعدادات ← بنك الأسئلة.</div></div>`;
  }else if(it.judge){
    const lis=(it.judge.criteria||[]).map(c=>`<li class="${c.met?'met':'unmet'}"><span class="mk"><svg class="icon"><use href="#ic-${c.met?'tick':'x'}"/></svg></span><span class="ct" dir="auto">${esc(c.text)}${c.note?`<span class="cn">${esc(c.note)}</span>`:''}</span></li>`).join('');
    judgeHtml=`<div class="criteria-box" style="margin-top:13px;"><span class="lbl">تقييم عناصر الإجابة الصحيحة</span><ul class="critlist">${lis}</ul></div>`;
  }

  const rv=it.review;
  const verify=it.status==='error'?'':`<div class="verifybox">
    <div class="vq">هل تقييم الذكاء الاصطناعي صحيح؟</div>

    ${turnsHtml}

function v2BindCards(){
  const run=app.ctx.v2run;
  screen.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{
    const box=screen.querySelector(`[data-ans="${b.dataset.more}"]`);

function v2SummaryText(run){
  const pct=v2RunScore(run);
  const L=['📋 تقرير '+v2KindLabel(run.kind)+' — منصة مِعيار',`${SETTINGS.team} — ${SETTINGS.product}`,'———————————————',
    `الموظف: ${run.employee}`,`التاريخ: ${run.date}`,`نمط البحث: ${searchModeLabel(runSearchMode(run))}`,
    run.kind==='files'?`نوع الملفات: ${v2RunLangLabel(run)}`:`اللغة: ${run.lang==='en'?'English':'عربي'}`];
  if(run.model)L.push(`النموذج المُختبَر: ${run.model}`);
  if(run.aiMode&&run.aiMode!=='live')L.push('⚠ '+aiModeLabel(run.aiMode)+' — بعض النتائج أو كلها تجريبية');
  if(run.reason)L.push(`سبب الاختبار: ${run.reason}`);
  L.push(`النتيجة: ${pct==null?'—':pct+'%'} من ${run.items.length} ${v2UnitLabel(run)}`,'———————————————');
  run.items.forEach((it,i)=>{
    const s=v2ItemScore(it);
    const head=it.status==='error'?'⚠ تعذّر':(it.judge&&it.judge.mode==='binary'?(it.judge.pass?'✅ نجح':'❌ لم ينجح'):`${s>=0.8?'✅':s>=0.5?'🟡':'❌'} ${Math.round(s*100)}%`);
    L.push('',`${i+1}. ${head} — ${runSearchMode(run)==='both'?'['+searchModeShort(itemSearchMode(it))+'] ':''}${it.kind==='fileupload'&&it.fileName?'['+it.fileName+'] ':''}${it.title}`);
    if(it.kind==='fileupload'&&it.turns.length>1)L.push(`   ↳ سؤال تابع: ${it.turns[1].q}`);
    if(it.judge&&it.judge.mode==='criteria')(it.judge.criteria||[]).forEach(c=>L.push(`   ${c.met?'✓':'✗'} ${c.text}`));
    else if(it.judge)L.push(`   ${it.judge.summary}`);
    if(it.review.agree===false)L.push(`   ⚑ اعتراض على التقييم: ${it.review.reason}${it.review.note?' — '+it.review.note:''}`);
  });
  return L.join('\n');
}

  screen.querySelectorAll('[data-htab]').forEach(b=>b.onclick=()=>{app.ctx.histTab=b.dataset.htab;render();});

  screen.innerHTML=`<div class="card">
    <button class="bankback" id="back">→ سجل الاختبارات</button>
    <div class="eyebrow">${esc(v2KindLabel(run.kind))} · ${esc(searchModeLabel(runSearchMode(run)))} · ${esc(v2RunLangLabel(run))}</div>

      ${run.judgeModel?` • <b style="color:var(--ink-2)">المقيّم:</b> ${esc(run.judgeModel)}`:''}

    ${disputed.length?`<div class="tip" style="margin-top:12px;"><span class="ic"><svg class="icon"><use href="#ic-lamp"/></svg></span><div><b>${disputed.length} تقييم اعترض عليه المختبِر:</b><ul style="margin:6px 0 0;padding-inline-start:18px;">${disputed.map(d=>`<li>${esc(d.review.reason)}${d.review.note?' — '+esc(d.review.note):''}</li>`).join('')}</ul></div></div>`:''}
    <div class="row" style="margin-top:14px;"><button class="btn btn-ghost btn-sm" id="copySum"><svg class="icon"><use href="#ic-copy"/></svg> نسخ الملخّص</button></div>
  </div>
  ${run.items.map((it,i)=>v2ReadonlyCard(it,i,run)).join('')}`;
  document.getElementById('back').onclick=()=>{app.ctx.histSub=null;render();window.scrollTo(0,0);};
  document.getElementById('copySum').onclick=()=>copyText(v2SummaryText(run),'تم نسخ ملخّص الاختبار');
  screen.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{
    const box=screen.querySelector(`[data-ans="${b.dataset.more}"]`);
    b.textContent=box.classList.toggle('collapsed')?'عرض الإجابة كاملة':'إخفاء';
  });

function v2ReadonlyCard(it,i,run){
  const pct=v2ItemScore(it),pctN=pct==null?null:Math.round(pct*100);
  const scoreHtml=it.judge&&it.judge.mode==='binary'
    ?`<div class="scorebig ${it.judge.pass?'pass':'fail'}"><div class="sv"><svg class="icon" style="width:19px;height:19px;"><use href="#ic-${it.judge.pass?'tick':'x'}"/></svg></div><div class="sl">${it.judge.pass?'نجح':'لم ينجح'}</div></div>`
    :`<div class="scorebig ${pctN==null?'':scoreClass(pctN)}"><div class="sv">${pctN==null?'—':pctN+'%'}</div><div class="sl">الدرجة</div></div>`;
  const crit=it.judge&&it.judge.mode==='criteria'
    ?`<div class="criteria-box" style="margin-top:13px;"><span class="lbl">تقييم عناصر الإجابة الصحيحة</span><ul class="critlist">${(it.judge.criteria||[]).map(c=>`<li class="${c.met?'met':'unmet'}"><span class="mk"><svg class="icon"><use href="#ic-${c.met?'tick':'x'}"/></svg></span><span class="ct" dir="auto">${esc(c.text)}${c.note?`<span class="cn">${esc(c.note)}</span>`:''}</span></li>`).join('')}</ul></div>`
    :(it.judge?`<div class="criteria-box" style="margin-top:13px;"><span class="lbl">حكم المقيّم</span><p style="margin:0;">${esc(it.judge.summary)}</p></div>`:'');
  const rv=it.review||{};
  return `<div class="v2card">
    <div class="v2head"><div class="v2q"><span class="chip" style="margin-inline-end:8px;">${i+1}</span>${runSearchMode(run)==='both'?`<span class="chip" style="margin-inline-end:8px;">${esc(searchModeShort(itemSearchMode(it)))}</span>`:''}<span dir="auto">${esc(it.title)}</span>
      <div class="muted-note" style="margin-top:6px;font-weight:400;">${esc(it.srcLabel||'')} · ${esc(searchModeLabel(itemSearchMode(it)))}${it.kind==='fileupload'&&it.docTitle?' · '+esc(it.docTitle):''}</div></div>${scoreHtml}</div>
    ${it.fileLink?`<div class="answerbox" style="margin-top:10px;background:var(--card-2);"><span class="lbl">الملف المرفوع</span>
      <div class="txt">${esc(it.fileName||it.fileLink)}${it.fileMeta?` <span class="muted-note">· ${esc(it.fileMeta)}</span>`:''}</div>
      <div class="row" style="margin-top:10px;"><a href="${esc(it.fileLink)}" download class="btn btn-ghost btn-sm"><svg class="icon"><use href="#ic-paperclip"/></svg> تنزيل الملف</a></div></div>`:''}
    ${it.turns.map((turn,ti)=>`<div style="margin-top:12px;">
      <div class="answerbox" style="background:var(--card-2);"><span class="lbl">${it.turns.length<2?'السؤال':(it.kind==='fileupload'?(ti?'السؤال التابع':'السؤال'):'السؤال '+(ti+1))}</span><div class="txt" dir="auto">${esc(turn.q)}</div></div>
      <div class="answerbox collapsed" data-ans="v${i}|${ti}"><span class="lbl">إجابة النموذج</span><div class="txt" dir="auto">${esc(turn.answer||'—')}</div></div>
      ${(turn.answer||'').length>210?`<button class="morebtn" data-more="v${i}|${ti}">عرض الإجابة كاملة</button>`:''}
    </div>`).join('')}
    ${crit}
    ${rv.agree===false?`<div class="warnmsg show" style="margin-top:12px;"><b>المختبِر اعترض على هذا التقييم:</b> ${esc(rv.reason)}${rv.note?' — '+esc(rv.note):''}</div>`
      :rv.agree===true?`<div class="muted-note" style="margin-top:10px;"><svg class="icon"><use href="#ic-tick"/></svg> راجع المختبِر التقييم وأقرّه.</div>`:''}
  </div>`;
}

/* --- مقارنة بين أكثر من نموذج --- */
function renderV2Compare(){
  setCrumb('مقارنة النماذج');
  const sel=app.ctx.cmpSel=app.ctx.cmpSel||[];
  const rows=V2_RUNS.map((r,i)=>`<label class="qoption ${sel.includes(i)?'sel':''}" data-cmp="${i}"><input type="checkbox" ${sel.includes(i)?'checked':''}>
    <span class="qtext">${esc(r.model||'—')} · ${esc(v2KindLabel(r.kind))} · ${esc(r.date)}</span>
    <span class="chip" style="flex:0 0 auto;">${r.score==null?'—':r.score+'%'}</span></label>`).join('');
  const picked=sel.map(i=>V2_RUNS[i]).filter(Boolean);
  screen.innerHTML=`<div class="card">
    <button class="bankback" id="back">→ سجل الاختبارات</button>
    <div class="eyebrow">السجل</div><h1 class="h1">مقارنة النماذج</h1>
    <p class="sub">اختر اختبارين أو أكثر لعرض نتائجها جنبًا إلى جنب. تظهر الأسئلة المشتركة في جدول موحّد للمقارنة المباشرة.</p>
    ${V2_RUNS.length?rows:'<div class="empty">لا توجد اختبارات محفوظة بعد.</div>'}
  </div>
  <div id="cmpOut"></div>`;
  document.getElementById('back').onclick=()=>{app.ctx.histSub=null;render();window.scrollTo(0,0);};
  screen.querySelectorAll('[data-cmp]').forEach(el=>el.querySelector('input').onchange=()=>{
    const i=+el.dataset.cmp,k=sel.indexOf(i);
    if(k>-1)sel.splice(k,1);else sel.push(i);
    renderV2Compare();
  });
  const out=document.getElementById('cmpOut');
  if(picked.length<2){out.innerHTML='<div class="card"><div class="empty">اختر اختبارين على الأقل للمقارنة.</div></div>';buildToc();return;}

  const overview=`<div class="cmpwrap"><table class="v2tbl">
    <tr><th>النموذج</th><th>النوع</th><th>نمط البحث</th><th>اللغة</th><th>التاريخ</th><th>الأسئلة</th><th>النتيجة</th><th>اعتراضات المختبِر</th></tr>
    ${picked.map(r=>{const d=r.items.filter(x=>x.review&&x.review.agree===false).length;return `<tr>
      <td><b>${esc(r.model||'—')}</b></td><td>${esc(v2KindLabel(r.kind))}</td><td>${esc(searchModeLabel(runSearchMode(r)))}</td><td>${esc(v2RunLangLabel(r))}</td><td>${esc(r.date)}</td><td>${r.items.length}</td>
      <td><b style="color:${r.score==null?'':scoreColor(r.score)}">${r.score==null?'—':r.score+'%'}</b><div class="mini-bar"><span style="width:${r.score||0}%;background:${scoreColor(r.score||0)}"></span></div></td>
      <td>${d||'—'}</td></tr>`;}).join('')}
  </table></div>`;

  /* الأسئلة المشتركة: تطابق بنص السؤال الأول مع نمط البحث. إدخال النمط في المفتاح
     ضروري — في جلسة «الوضعان» يتكرّر نص السؤال مرتين، فبدونه يُقارَن العادي
     بالعادي دائمًا ويُهمل التفصيلي بلا أن يظهر ذلك. */
  const keyOf=it=>(it.turns[0]&&it.turns[0].q||it.title||'').trim()+' ⟨'+itemSearchMode(it)+'⟩';
  const shared=[];
  (picked[0].items||[]).forEach(it=>{
    const k=keyOf(it);
    const row=picked.map(r=>(r.items||[]).find(x=>keyOf(x)===k));
    if(row.every(Boolean))shared.push({key:k,title:it.title,mode:itemSearchMode(it),row});
  });
  const cell=x=>`<td>${v2ScoreCellHtml(x)}</td>`;
  const anyBoth=picked.some(r=>runSearchMode(r)==='both');
  const sharedHtml=shared.length?`<div class="cmpwrap"><table class="v2tbl fixed">
    <tr><th>السؤال</th>${picked.map(r=>`<th>${esc(r.model||'—')}</th>`).join('')}</tr>
    ${shared.map(s=>`<tr><td>${anyBoth?`<span class="chip" style="margin-inline-end:6px;">${esc(searchModeShort(s.mode))}</span>`:''}${esc(s.title)}</td>${s.row.map(cell).join('')}</tr>`).join('')}
  </table></div>`:'<div class="empty">لا توجد أسئلة مشتركة بين الاختبارات المختارة. اختر اختبارات سُحبت من نفس أقسام بنك الأسئلة.</div>';

  out.innerHTML=`<div class="card"><h2 class="h2">نظرة عامة</h2>${overview}</div>
    <div class="card"><h2 class="h2">الأسئلة المشتركة (${shared.length})</h2>${sharedHtml}</div>`;
  buildToc();
}

/* --- نتائج عدة نماذج على السؤال نفسه --- */
function renderV2QuestionView(){
  setCrumb('نتائج النماذج لسؤال واحد');
  const byQ=new Map();
  V2_RUNS.forEach(r=>(r.items||[]).forEach(it=>{
    const k=((it.turns[0]&&it.turns[0].q)||it.title||'').trim();
    if(!k)return;
    if(!byQ.has(k))byQ.set(k,{title:it.title,hits:[]});
    byQ.get(k).hits.push({run:r,item:it});
  }));
  const entries=[...byQ.entries()].sort((a,b)=>b[1].hits.length-a[1].hits.length);
  const sel=app.ctx.qvSel||'';
  const opts=entries.map(([k,v])=>`<option value="${esc(k)}" ${sel===k?'selected':''}>${esc(v.title.slice(0,90))} (${v.hits.length} نتيجة)</option>`).join('');
  const chosen=sel?byQ.get(sel):null;

  let body='<div class="card"><div class="empty">اختر سؤالًا لعرض إجابات النماذج عليه.</div></div>';
  if(chosen){
    body=`<div class="card"><h2 class="h2">${esc(chosen.title)}</h2>
      <div class="cmpwrap"><table class="v2tbl" style="margin-top:14px;">
        <tr><th>النموذج</th><th>نوع الاختبار</th><th>نمط البحث</th><th>التاريخ</th><th>النتيجة</th><th>المختبِر</th><th>مراجعة التقييم</th></tr>
        ${chosen.hits.map(h=>{
          const rv=h.item.review||{};
          return `<tr><td><b>${esc(h.run.model||'—')}</b></td><td>${esc(v2KindLabel(h.run.kind))}</td><td>${esc(searchModeShort(itemSearchMode(h.item)))}</td><td>${esc(h.run.date)}</td>
            <td>${v2ScoreCellHtml(h.item)}</td>
            <td>${esc(h.run.employee||'—')}</td>
            <td>${rv.agree===true?'أقرّه':rv.agree===false?`<span style="color:var(--fail);">اعترض — ${esc(rv.reason)}</span>`:'—'}</td></tr>`;
        }).join('')}
      </table></div></div>
      ${chosen.hits.map((h,i)=>`<div class="v2card">
        <div class="v2head"><div class="v2q">${esc(h.run.model||'—')}<div class="muted-note" style="margin-top:6px;font-weight:400;">${esc(h.run.date)} · ${esc(v2KindLabel(h.run.kind))} · ${esc(searchModeLabel(itemSearchMode(h.item)))}</div></div>
        ${(()=>{const it=h.item,s=v2ItemScore(it);
          if(it.judge&&it.judge.mode==='binary')return `<div class="scorebig ${it.judge.pass?'pass':'fail'}"><div class="sv"><svg class="icon" style="width:19px;height:19px;"><use href="#ic-${it.judge.pass?'tick':'x'}"/></svg></div><div class="sl">${it.judge.pass?'نجح':'لم ينجح'}</div></div>`;
          const p=s==null?null:Math.round(s*100);
          return `<div class="scorebig ${p==null?'':scoreClass(p)}"><div class="sv">${p==null?'—':p+'%'}</div><div class="sl">الدرجة</div></div>`;})()}</div>
        <div class="answerbox collapsed" data-ans="q${i}|0"><span class="lbl">إجابة النموذج</span><div class="txt">${esc((h.item.turns[0]||{}).answer||'—')}</div></div>
        ${(((h.item.turns[0]||{}).answer)||'').length>210?`<button class="morebtn" data-more="q${i}|0">عرض الإجابة كاملة</button>`:''}
        ${h.item.judge&&h.item.judge.mode==='criteria'?`<div class="criteria-box" style="margin-top:13px;"><span class="lbl">عناصر الإجابة الصحيحة</span><ul class="critlist">${(h.item.judge.criteria||[]).map(c=>`<li class="${c.met?'met':'unmet'}"><span class="mk"><svg class="icon"><use href="#ic-${c.met?'tick':'x'}"/></svg></span><span class="ct">${esc(c.text)}</span></li>`).join('')}</ul></div>`:''}
      </div>`).join('')}`;
  }

  screen.innerHTML=`<div class="card">
    <button class="bankback" id="back">→ سجل الاختبارات</button>

    <div class="field" style="margin-top:14px;margin-bottom:0;"><select id="qvSel"><option value="">اختر سؤالًا</option>${opts}</select></div>
    ${entries.length?'':'<div class="muted-note" style="margin-top:10px;">لا توجد اختبارات محفوظة بعد.</div>'}
  </div>${body}`;
  document.getElementById('back').onclick=()=>{app.ctx.histSub=null;render();window.scrollTo(0,0);};
  document.getElementById('qvSel').onchange=e=>{app.ctx.qvSel=e.target.value;renderV2QuestionView();};
  screen.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{

    b.textContent=box.classList.toggle('collapsed')?'عرض الإجابة كاملة':'إخفاء';
  });
  buildToc();
}

/* ===== تحليل المنافسين ===== */
function renderCompRouter(){
  const s=app.sub;
  if(s==='competitorForm') renderCompetitorForm();
  else if(s==='competitorPage') renderCompetitorPage();
  else if(s==='runView') renderRunView();
  else if(s==='intro') renderCompIntro();
  else if(s==='form') renderCompForm();
  else if(s==='compareSelect') renderCompareSelect();
  else if(s==='compareView') renderCompareView();
  else renderComp();
}
function runActionsHtml(product,gi){
  return `<div class="row" style="margin-top:8px;flex-wrap:wrap;">
    <button class="btn btn-ghost btn-sm" data-viewrun="${product}|${gi}"><svg class="icon"><use href="#ic-external-link"/></svg> استعراض</button>
    <button class="btn btn-ghost btn-sm" data-editrun="${product}|${gi}"><svg class="icon"><use href="#ic-pencil"/></svg> تعديل</button>
    <button class="iconbtn del" data-delrun="${product}|${gi}"><svg class="icon"><use href="#ic-trash"/></svg> حذف</button>
  </div>`;
}
function bindRunActions(){
  screen.querySelectorAll('[data-viewrun]').forEach(b=>{const[p,gi]=b.dataset.viewrun.split('|');b.onclick=()=>viewRun(p,+gi);});
  screen.querySelectorAll('[data-editrun]').forEach(b=>{const[p,gi]=b.dataset.editrun.split('|');b.onclick=()=>compEditRun(p,+gi);});
  screen.querySelectorAll('[data-delrun]').forEach(b=>b.onclick=()=>{
    const[p,gi]=b.dataset.delrun.split('|');
    if(!confirm('حذف هذا التحليل؟'))return;
    COMP_RUNS[p].splice(+gi,1);save(K.compRuns,COMP_RUNS);render();
  });
}
function renderComp(){
  const product=app.ctx.compProduct||'research';
  const tabsHtml=Object.entries(COMP_DEFS).map(([k,p])=>`<button class="tab ${product===k?'on':''}" data-cprod="${k}">${esc(p.label)}${p.ready?'':' · قريبًا'}</button>`).join('');

      <div class="toolbar" style="justify-content:space-between;">

    <p class="sub" data-edit-key="comp.sub">${esc(t('comp.sub','قائمة معايير ثابتة تُراجَع مع منصتنا ومع كل منافس على حدة، ويُحفظ كل تحليل بتاريخه ليمكن الرجوع له أو مقارنته لاحقًا. الهدف رصد الفروقات بين المنصات لا احتساب نسبة أو تقييم رقمي.'))}</p>

  </div>

  if(def.ready){
    document.getElementById('addComp').onclick=()=>openCompetitorForm(null);

    if(cmpGo) cmpGo.onclick=()=>{app.ctx.compareProduct=product;app.ctx.compareSel=[];app.sub='compareSelect';render();};
    bindCompCompetitorCards(product);

function compCompetitorCard(product,c){
  const runs=compAllRuns(product).filter(r=>r.competitorId===c.id).sort((a,b)=>b.date.localeCompare(a.date));
  const last=runs[0];
  const open=app.ctx.compOpenCompetitor===c.id;
  const pwRevealed=(app.ctx.pwReveal||[]).includes(c.id);
  const rows=runs.map(r=>{
    const gi=compAllRuns(product).indexOf(r);
    return `<div class="rrow">
      <div class="rhead"><b style="color:var(--ink-2);">${esc(r.date)}</b><span class="chip">${esc(r.employee)}</span></div>
      ${r.verdict?`<div class="qq" style="margin-top:6px;">${esc(r.verdict)}</div>`:''}
      ${runActionsHtml(product,gi)}
    </div>`;
  }).join('');
  return `<div class="platcard">
    <div class="phead">
      <span class="pname">${esc(c.name)}</span>${c.isOurs?`<span class="own-badge">منصتنا</span>`:''}
      <span class="badge-n" style="margin-inline-start:auto;">${runs.length} تحليل</span>
    </div>
    ${c.url?`<div class="pmeta"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.url)}</a></div>`:''}
    ${(c.username||c.password)?`<div class="pmeta">تسجيل الدخول: ${esc(c.username||'—')} · <span class="pwmask">${pwRevealed?esc(c.password||'—'):'••••••'}</span> <button class="iconbtn" data-togglepw="${c.id}" title="${pwRevealed?'إخفاء':'إظهار'}"><svg class="icon"><use href="#ic-eye${pwRevealed?'-slash':''}"/></svg></button></div>`:''}
    <div class="pmeta">آخر تحليل: ${last?esc(last.date)+' · '+esc(last.employee):'—'}</div>
    <div class="row" style="margin-top:10px;flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm" data-newfor="${c.id}"><svg class="icon"><use href="#ic-plus"/></svg> تحليل جديد لهذه المنصة</button>
      <button class="btn btn-ghost btn-sm" data-toghist="${c.id}">${open?'إخفاء السجل':'عرض السجل'} (${runs.length})</button>
      <button class="btn btn-ghost btn-sm" data-openpage="${c.id}"><svg class="icon"><use href="#ic-external-link"/></svg> صفحة المنصة</button>
      <button class="btn btn-ghost btn-sm" data-editcomp="${c.id}"><svg class="icon"><use href="#ic-pencil"/></svg> تعديل</button>
      ${!c.isOurs?`<button class="iconbtn del" data-delcomp="${c.id}"><svg class="icon"><use href="#ic-trash"/></svg></button>`:''}
    </div>
    ${open?rows:''}
  </div>`;
}
function bindCompCompetitorCards(product){
  screen.querySelectorAll('[data-newfor]').forEach(b=>b.onclick=()=>compStart(product,b.dataset.newfor));
  screen.querySelectorAll('[data-toghist]').forEach(b=>b.onclick=()=>{const id=b.dataset.toghist;app.ctx.compOpenCompetitor=app.ctx.compOpenCompetitor===id?null:id;render();});
  bindRunActions();
  screen.querySelectorAll('[data-openpage]').forEach(b=>b.onclick=()=>{app.ctx.competitorId=b.dataset.openpage;app.sub='competitorPage';render();window.scrollTo(0,0);});
  screen.querySelectorAll('[data-editcomp]').forEach(b=>b.onclick=()=>openCompetitorForm(b.dataset.editcomp));
  screen.querySelectorAll('[data-togglepw]').forEach(b=>b.onclick=()=>{const id=b.dataset.togglepw;app.ctx.pwReveal=app.ctx.pwReveal||[];const i=app.ctx.pwReveal.indexOf(id);if(i>-1)app.ctx.pwReveal.splice(i,1);else app.ctx.pwReveal.push(id);render();});
  screen.querySelectorAll('[data-delcomp]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.delcomp;
    if(!confirm('حذف هذا المنافس؟ سيُحذف كل تحليل مرتبط به في جميع المنتجات.'))return;
    COMPETITORS=COMPETITORS.filter(x=>x.id!==id);saveCompetitors();
    Object.keys(COMP_RUNS).forEach(k=>{COMP_RUNS[k]=COMP_RUNS[k].filter(r=>r.competitorId!==id);});
    save(K.compRuns,COMP_RUNS);
    render();
  });
}

function compStart(product,competitorId){

  app.sub='intro';render();window.scrollTo(0,0);

function compEditRun(product,runIndex){

}

}
function renderRunView(){
  const {product,runIndex}=app.ctx.viewRun;

  if(!r){app.sub=null;render();return;}
  setCrumb('استعراض تحليل');

  const cats=(COMP_DEFS[d.product].cats||[]).map(c=>{

      if(it.dependsOn&&d.answers[it.dependsOn.key]!==it.dependsOn.equals)return '';

      if(it.type==='text'){
